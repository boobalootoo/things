<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling DVR Camera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #video-container {
            position: relative;
            flex-grow: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* Custom range styling for the timeline */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 12px;
            border-radius: 3px;
            background: #6366f1;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .selection-overlay {
            pointer-events: none;
            position: absolute;
            height: 8px;
            background: rgba(16, 185, 129, 0.5);
            border-radius: 4px;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center z-10">
        <div>
            <h1 class="text-lg font-bold tracking-tight">Rolling Buffer Cam</h1>
            <div class="flex items-center gap-2 mt-1">
                <select id="bufferLimit" class="bg-slate-800 text-xs text-slate-300 border-none rounded px-1 py-0.5 outline-none">
                    <option value="300">5 min</option>
                    <option value="900">15 min</option>
                    <option value="1800">30 min</option>
                    <option value="3600" selected>60 min</option>
                </select>
                <p id="storage-info" class="text-xs text-slate-400">0s stored</p>
            </div>
        </div>
        <div id="rec-indicator" class="hidden items-center text-red-500 font-mono text-sm font-bold">
            <span class="status-dot"></span> REC
        </div>
    </header>

    <!-- Preview Area -->
    <main id="video-container">
        <video id="preview" autoplay playsinline muted></video>
        <p id="msg-box" class="absolute top-4 left-1/2 -translate-x-1/2 bg-black/60 px-4 py-2 rounded-full text-xs text-white backdrop-blur pointer-events-none opacity-0 transition-opacity"></p>
    </main>

    <!-- Timeline & Controls -->
    <footer class="bg-slate-900 border-t border-slate-800 p-4 pb-8 flex flex-col gap-4">
        
        <!-- Timeline Section -->
        <div id="timeline-container" class="hidden">
            <div class="flex justify-between text-[10px] text-slate-500 mb-1 font-mono">
                <span>OLD</span>
                <span id="currentTimeDisplay">SCRUB TIMELINE</span>
                <span>NOW</span>
            </div>
            <div class="relative w-full h-8 flex items-center">
                <div id="selectionBar" class="selection-overlay"></div>
                <input type="range" id="timeline" min="0" max="0" value="0" class="w-full">
            </div>
            <div class="flex gap-2 justify-center mt-2">
                <button id="setStartBtn" class="bg-slate-800 text-[10px] px-3 py-1 rounded border border-slate-700 hover:bg-slate-700">MARK START</button>
                <button id="setEndBtn" class="bg-slate-800 text-[10px] px-3 py-1 rounded border border-slate-700 hover:bg-slate-700">MARK END</button>
                <button id="clearRangeBtn" class="bg-slate-800 text-[10px] px-3 py-1 rounded border border-slate-700 hover:bg-slate-700">RESET</button>
            </div>
        </div>

        <!-- Main Controls -->
        <div class="flex gap-3 justify-center">
            <button id="startBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-2xl font-bold shadow-lg transition-all flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                START RECORDING
            </button>
            
            <button id="captureBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-2xl font-bold shadow-lg transition-all flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" Resilience y2="3"/></svg>
                DOWNLOAD CLIP
            </button>

            <button id="stopBtn" class="hidden bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-2xl shadow-lg transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12"/></svg>
            </button>
        </div>
    </footer>

    <script>
        const video = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const captureBtn = document.getElementById('captureBtn');
        const storageInfo = document.getElementById('storage-info');
        const recIndicator = document.getElementById('rec-indicator');
        const msgBox = document.getElementById('msg-box');
        const timeline = document.getElementById('timeline');
        const timelineContainer = document.getElementById('timeline-container');
        const selectionBar = document.getElementById('selectionBar');
        const bufferLimitSelect = document.getElementById('bufferLimit');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');

        let mediaRecorder;
        let stream;
        let chunks = []; 
        let selectionStart = null;
        let selectionEnd = null;
        
        const CHUNK_DURATION_MS = 1000; 

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: true
                });
                
                video.srcObject = stream;
                
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                captureBtn.classList.remove('hidden');
                timelineContainer.classList.remove('hidden');
                
                // Fixed the classList chaining bug here
                recIndicator.classList.remove('hidden');
                recIndicator.classList.add('flex');
                
                startRecording();
                showMessage("Buffering active.");
            } catch (err) {
                console.error(err);
                showMessage("Camera Error: Permission Denied.");
            }
        }

        function startRecording() {
            chunks = [];
            selectionStart = null;
            selectionEnd = null;
            updateSelectionUI();

            const options = { mimeType: 'video/webm;codecs=vp8,opus' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options.mimeType = 'video/webm';
            }

            mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    chunks.push({
                        blob: e.data,
                        timestamp: Date.now()
                    });
                    
                    const maxAllowed = parseInt(bufferLimitSelect.value);
                    if (chunks.length > maxAllowed) {
                        chunks.shift();
                        if (selectionStart !== null) selectionStart = Math.max(0, selectionStart - 1);
                        if (selectionEnd !== null) selectionEnd = Math.max(0, selectionEnd - 1);
                    }
                    
                    updateTimelineUI();
                    updateStatus();
                }
            };

            mediaRecorder.start(CHUNK_DURATION_MS);
        }

        function updateTimelineUI() {
            timeline.max = Math.max(0, chunks.length - 1);
            if (timeline.value == timeline.max - 1 || timeline.value == 0) {
                timeline.value = timeline.max;
            }
            updateSelectionUI();
        }

        function updateSelectionUI() {
            if (selectionStart !== null && selectionEnd !== null) {
                const total = chunks.length - 1;
                if (total <= 0) return;
                
                const startPos = (selectionStart / total) * 100;
                const endPos = (selectionEnd / total) * 100;
                
                selectionBar.style.left = `${Math.min(startPos, endPos)}%`;
                selectionBar.style.width = `${Math.abs(endPos - startPos)}%`;
                
                const duration = Math.abs(selectionEnd - selectionStart);
                currentTimeDisplay.innerText = `SELECTED: ${duration}s`;
                currentTimeDisplay.classList.add('text-emerald-400');
            } else {
                selectionBar.style.width = '0%';
                currentTimeDisplay.innerText = "SCRUB TO CLIP";
                currentTimeDisplay.classList.remove('text-emerald-400');
            }
        }

        function updateStatus() {
            const count = chunks.length;
            const minutes = Math.floor(count / 60);
            const seconds = count % 60;
            storageInfo.innerText = `${minutes}m ${seconds}s stored`;
        }

        function showMessage(text) {
            msgBox.innerText = text;
            msgBox.style.opacity = "1";
            setTimeout(() => { msgBox.style.opacity = "0"; }, 3000);
        }

        async function downloadSelection() {
            let targetChunks = [];
            
            if (selectionStart !== null && selectionEnd !== null) {
                const start = Math.min(selectionStart, selectionEnd);
                const end = Math.max(selectionStart, selectionEnd);
                targetChunks = chunks.slice(start, end + 1).map(c => c.blob);
                showMessage(`Exporting ${targetChunks.length}s clip...`);
            } else {
                targetChunks = chunks.slice(-30).map(c => c.blob);
                showMessage("Exporting last 30s...");
            }

            if (targetChunks.length === 0) return;

            const blob = new Blob(targetChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `dvr_clip_${new Date().getTime()}.webm`;
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }

        function stopAll() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (stream) stream.getTracks().forEach(track => track.stop());
            
            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            captureBtn.classList.add('hidden');
            timelineContainer.classList.add('hidden');
            recIndicator.classList.add('hidden');
            recIndicator.classList.remove('flex');
            
            chunks = [];
            updateStatus();
            showMessage("Recording saved to memory cleared.");
        }

        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopAll);
        captureBtn.addEventListener('click', downloadSelection);
        
        document.getElementById('setStartBtn').addEventListener('click', () => {
            selectionStart = parseInt(timeline.value);
            updateSelectionUI();
        });

        document.getElementById('setEndBtn').addEventListener('click', () => {
            selectionEnd = parseInt(timeline.value);
            updateSelectionUI();
        });

        document.getElementById('clearRangeBtn').addEventListener('click', () => {
            selectionStart = null;
            selectionEnd = null;
            updateSelectionUI();
        });

        timeline.addEventListener('input', () => {
            const index = parseInt(timeline.value);
            if (selectionStart === null && selectionEnd === null) {
                const timeFromNow = chunks.length - index;
                currentTimeDisplay.innerText = timeFromNow === 0 ? "LIVE" : `-${timeFromNow}s ago`;
            } else {
                updateSelectionUI();
            }
        });
    </script>
</body>
</html>
