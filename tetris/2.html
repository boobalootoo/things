<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CALC-TRIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a; /* Dark Plastic Case */
            color: #22d3ee; /* Cyan LED */
            font-family: 'VT323', monospace;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* The "Screen" inset look */
        #calc-display {
            background-color: #050a0a; /* Darker LCD background */
            width: 95%;
            height: 90%;
            max-width: 500px; /* Keep it playable on tablets */
            border-radius: 8px;
            border: 4px solid #444; /* Bezel */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 0 2px #000;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }

        /* Top Status Bar (Score) */
        .status-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #22d3ee33;
            padding-bottom: 5px;
            margin-bottom: 5px;
            text-shadow: 0 0 5px rgba(34, 211, 238, 0.5);
        }

        /* Game Board Area */
        .game-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            image-rendering: pixelated; /* Sharp pixels */
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.1);
            border: 1px solid #22d3ee33;
        }

        /* Overlays (Start/Game Over) - styled like system messages */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            text-align: center;
        }
        
        button {
            background: transparent;
            border: 2px solid #22d3ee;
            color: #22d3ee;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            padding: 10px 30px;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.2);
        }
        button:active {
            background: #22d3ee;
            color: #000;
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* Minimal Tilt Indicator at bottom */
        #tilt-bar {
            height: 4px;
            width: 100px;
            background: #22d3ee33;
            margin: 10px auto 0;
            border-radius: 2px;
            position: relative;
        }
        #tilt-cursor {
            width: 8px; height: 8px;
            background: #22d3ee;
            border-radius: 50%;
            position: absolute;
            top: -2px; left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 5px #22d3ee;
        }

        /* Calibration Message */
        #calib-msg {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            background: #000;
            padding: 10px;
            border-top: 1px solid #22d3ee;
            border-bottom: 1px solid #22d3ee;
            display: none;
            z-index: 60;
        }
        
        .hidden { display: none !important; }

    </style>
</head>
<body>

    <div id="calc-display">
        <!-- Header Stats -->
        <div class="status-bar">
            <div class="text-xl">SCORE:<span id="score">0</span></div>
            <div class="text-xl">LVL:<span id="level">1</span></div>
        </div>

        <!-- Main Game -->
        <div class="game-area">
            <!-- Canvas size logic handled in JS to fill space -->
            <canvas id="gameCanvas"></canvas>
            
            <div id="calib-msg" class="blink">CALIBRATING SENSORS...</div>
        </div>

        <!-- Minimal footer -->
        <div id="tilt-bar">
            <div id="tilt-cursor"></div>
        </div>
        
        <!-- Start Screen -->
        <div id="startScreen" class="overlay">
            <h1 class="text-6xl mb-4" style="text-shadow: 4px 4px 0 #004d40;">TETRIS</h1>
            <div class="text-xl space-y-2 text-cyan-200 opacity-80">
                <p>[ TILT L/R TO MOVE ]</p>
                <p>[ TWIST TO ROTATE ]</p>
                <p>[ TAP TO DROP ]</p>
            </div>
            <button id="startBtn">INIT_SYSTEM</button>
        </div>

        <!-- Game Over -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1 class="text-5xl mb-2 text-red-500 blink">SYSTEM HALTED</h1>
            <p class="text-2xl">FINAL_SCORE: <span id="finalScore">0</span></p>
            <button id="restartBtn">REBOOT</button>
        </div>
    </div>
    
    <!-- Hidden settings toggle for power users, just tap the Score label -->
    <div id="settings-trigger" style="position:absolute; top:20px; left:20px; width:50px; height:50px; z-index:100;" onclick="toggleSettings()"></div>
    
    <div id="settingsScreen" class="overlay hidden">
        <h2 class="text-3xl mb-6">CONFIG</h2>
        <div class="w-3/4 mb-4">
            <div class="flex justify-between mb-1 text-lg">
                <label>TILT SENS:</label>
                <span id="tiltVal">10</span>
            </div>
            <input type="range" id="tiltRange" min="5" max="30" step="1" value="10" class="w-full">
        </div>
        <div class="w-3/4">
            <div class="flex justify-between mb-1 text-lg">
                <label>TWIST SENS:</label>
                <span id="twistVal">20</span>
            </div>
            <input type="range" id="twistRange" min="10" max="45" step="1" value="20" class="w-full">
        </div>
        <button onclick="toggleSettings()">EXIT</button>
    </div>

    <script>
        // --- DOM Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const finalScoreEl = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const settingsScreen = document.getElementById('settingsScreen');
        const calibMsg = document.getElementById('calib-msg');
        const tiltCursor = document.getElementById('tilt-cursor');
        const tiltBar = document.getElementById('tilt-bar');

        // --- Game Constants ---
        const COLS = 10;
        const ROWS = 20;
        let BLOCK_SIZE = 20; // Calculated dynamically
        
        // Colors (Monochrome/LCD Theme)
        // 1 = Active Pixel (Bright), 0 = Empty (Dark)
        const THEME_COLOR = '#22d3ee'; // Cyan
        const GHOST_COLOR = '#22d3ee33'; // Faint Cyan
        
        // --- State ---
        let grid = createGrid();
        let player = { pos: {x: 0, y: 0}, matrix: null, score: 0, level: 1, lines: 0 };
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = false;
        let isGameOver = false;
        
        // --- Motion State ---
        let lastMotionTime = 0;
        let moveDelay = 120;
        let centerTilt = 0;
        let centerTwist = 0;
        let isCalibrating = false;
        let twisted = false;
        
        let tiltThreshold = 10;
        let twistThreshold = 20;
        let twistResetThreshold = 10;

        // --- Resize Logic ---
        function resize() {
            const container = document.querySelector('.game-area');
            const h = container.clientHeight;
            const w = container.clientWidth;
            
            // Calculate max block size that fits 10x20 in this area
            const blockH = Math.floor(h / ROWS);
            const blockW = Math.floor(w / COLS);
            BLOCK_SIZE = Math.min(blockH, blockW) - 1; // -1 for spacing
            
            canvas.width = BLOCK_SIZE * COLS;
            canvas.height = BLOCK_SIZE * ROWS;
            
            // Redraw if game active
            if(!isGameOver && player.matrix) draw();
        }
        window.addEventListener('resize', resize);

        // --- Core Functions ---
        function createGrid() { return Array.from({length: ROWS}, () => Array(COLS).fill(0)); }
        
        function createPiece(type) {
            if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
            if (type === 'L') return [[0, 0, 1], [1, 1, 1], [0, 0, 0]];
            if (type === 'J') return [[1, 0, 0], [1, 1, 1], [0, 0, 0]];
            if (type === 'O') return [[1, 1], [1, 1]];
            if (type === 'Z') return [[1, 1, 0], [0, 1, 1], [0, 0, 0]];
            if (type === 'S') return [[0, 1, 1], [1, 1, 0], [0, 0, 0]];
            if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
        }

        function draw() {
            // Clear screen (LCD Backlight effect)
            ctx.fillStyle = '#050a0a'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Grid (faint gridlines for "LCD segments")
            ctx.strokeStyle = '#112222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let x=0; x<=COLS; x++) { ctx.moveTo(x*BLOCK_SIZE, 0); ctx.lineTo(x*BLOCK_SIZE, canvas.height); }
            for(let y=0; y<=ROWS; y++) { ctx.moveTo(0, y*BLOCK_SIZE); ctx.lineTo(canvas.width, y*BLOCK_SIZE); }
            ctx.stroke();

            drawMatrix(grid, {x:0, y:0});
            if (player.matrix) drawMatrix(player.matrix, player.pos, true);
        }

        function drawMatrix(matrix, offset, isPlayer = false) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        const px = (x + offset.x) * BLOCK_SIZE;
                        const py = (y + offset.y) * BLOCK_SIZE;
                        const size = BLOCK_SIZE - 2; // pixel gap
                        
                        // Solid inner block
                        ctx.fillStyle = THEME_COLOR;
                        ctx.fillRect(px + 1, py + 1, size, size);
                        
                        // Inner "pixel" detail for calculator look
                        ctx.fillStyle = '#caf0f8'; // White-ish center
                        ctx.fillRect(px + 4, py + 4, size - 8, size - 8);
                    }
                });
            });
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(grid, player)) {
                player.pos.y--;
                merge(grid, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(grid, player)) player.pos.x -= dir;
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(grid, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) { [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]]; }
            }
            if (dir > 0) matrix.forEach(row => row.reverse()); else matrix.reverse();
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => { if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value; });
            });
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = grid.length - 1; y > 0; --y) {
                for (let x = 0; x < grid[y].length; ++x) { if (grid[y][x] === 0) continue outer; }
                const row = grid.splice(y, 1)[0].fill(0); grid.unshift(row); ++y;
                player.score += rowCount * 10; player.lines++; rowCount *= 2;
            }
            player.level = Math.floor(player.lines / 10) + 1;
            dropInterval = Math.max(100, 1000 - (player.level - 1) * 80);
            updateStats();
        }
        
        function updateStats() {
            scoreEl.innerText = player.score;
            levelEl.innerText = player.level;
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (grid[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(grid, player)) {
                isGameOver = true;
                finalScoreEl.innerText = player.score;
                gameOverScreen.classList.remove('hidden');
            }
        }

        function update(time = 0) {
            if (isGameOver || isPaused) return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            requestAnimationFrame(update);
        }

        // --- Motion Logic ---
        function handleOrientation(event) {
            if (isCalibrating) {
                if (event.gamma !== null) centerTilt = event.gamma;
                if (event.alpha !== null) centerTwist = event.alpha;
                return;
            }
            if (isPaused || isGameOver) return;

            // 1. Tilt (Move)
            let tilt = (event.gamma || 0) - centerTilt;
            if (tilt > 180) tilt -= 360; if (tilt < -180) tilt += 360;
            
            // Visualizer Cursor
            const maxTilt = 45;
            const px = Math.max(-50, Math.min(50, (tilt / maxTilt) * 50));
            tiltCursor.style.left = `calc(50% + ${px}px)`;

            const now = Date.now();
            if (Math.abs(tilt) > tiltThreshold) {
                if (now - lastMotionTime > moveDelay) {
                    if (tilt < 0) playerMove(-1); else playerMove(1);
                    lastMotionTime = now;
                }
            }

            // 2. Twist (Rotate)
            let twist = (event.alpha || 0) - centerTwist;
            if (twist > 180) twist -= 360; if (twist < -180) twist += 360;

            if (!twisted) {
                if (twist > twistThreshold) { playerRotate(1); twisted = true; } // CW
                else if (twist < -twistThreshold) { playerRotate(-1); twisted = true; } // CCW
            } else {
                if (Math.abs(twist) < twistResetThreshold) twisted = false;
            }
        }

        // --- Init ---
        async function startGame() {
            grid = createGrid();
            player = { pos: {x:0,y:0}, matrix: null, score: 0, level: 1, lines: 0 };
            updateStats();
            playerReset();
            isGameOver = false;
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            resize(); // Ensure canvas matches layout
            
            // Calibration
            calibMsg.style.display = 'block';
            isCalibrating = true;
            
            // Perms
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
            }
            window.addEventListener('deviceorientation', handleOrientation);

            // End Calib
            setTimeout(() => {
                isCalibrating = false;
                calibMsg.style.display = 'none';
                lastTime = performance.now();
                update();
            }, 1000);
        }

        // Inputs
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('calc-display').addEventListener('touchstart', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.id === 'settings-trigger') return;
            e.preventDefault(); playerDrop(); playerDrop();
        }, {passive:false});
        
        // Settings
        function toggleSettings() {
            if (settingsScreen.classList.contains('hidden')) { isPaused = true; settingsScreen.classList.remove('hidden'); }
            else { settingsScreen.classList.add('hidden'); isPaused = false; lastTime = performance.now(); update(); }
        }
        document.getElementById('tiltRange').addEventListener('input', e => { tiltThreshold = e.target.value; document.getElementById('tiltVal').innerText = e.target.value; });
        document.getElementById('twistRange').addEventListener('input', e => { twistThreshold = e.target.value; document.getElementById('twistVal').innerText = e.target.value; });

        // Debug Keyboard
        document.addEventListener('keydown', e => {
            if(isPaused || isGameOver) return;
            if (e.keyCode === 37) playerMove(-1); else if (e.keyCode === 39) playerMove(1);
            else if (e.keyCode === 40) playerDrop(); else if (e.keyCode === 38) playerRotate(1);
        });

    </script>
</body>
</html>
