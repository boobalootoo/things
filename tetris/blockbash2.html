<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sandbox Physics Tetris</title>
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }

        /* HUD Layer */
        #ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .hud-top {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
        }

        #score-box {
            color: #fff;
            text-align: right;
        }
        
        #score-val { font-size: 2rem; font-weight: bold; color: #4ECDC4; }
        #lines-val { font-size: 1rem; color: #aaa; }
        #level-val { font-size: 1.2rem; font-weight: bold; color: #FF6B6B; margin-top: 5px; }

        .screen {
            pointer-events: auto;
            background: rgba(0,0,0,0.85);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.3s;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            z-index: 20;
            text-align: center;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            text-shadow: 0 4px 0 #000;
        }

        p { color: #ccc; margin: 10px 0; font-weight: bold; line-height: 1.4; }

        button {
            background: #4ECDC4;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }

        .hidden { 
            opacity: 0; 
            pointer-events: none !important; 
        }

        .controls-hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: 15px;
            border-top: 1px solid #444;
            padding-top: 10px;
            width: 100%;
        }

        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4ECDC4;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 100;
        }
        
        /* Flash Effect */
        @keyframes flash {
            0% { opacity: 0.4; background: white; }
            100% { opacity: 0; }
        }
        .flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            animation: flash 0.3s ease-out forwards;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="loader">Loading Physics...</div>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div id="score-box">
                <div id="score-val">0</div>
                <div id="level-val">LVL 1</div>
                <div id="lines-val">LINES: 0</div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1>SANDBOX</h1>
        <p>NO DAMAGE. NO DEATH.<br>13-BLOCK WIDTH.</p>
        <div class="controls-hint">
            <strong>SWIPE</strong> to Run & Jump<br>
            <strong>DRAG</strong> to Grapple Toss<br>
            <strong>TILT</strong> to move falling blocks<br>
            <strong>TAP</strong> to Rotate
        </div>
        <button id="start-btn">START GAME</button>
    </div>

    <script>
        // Use a more robust loading check
        const startApp = () => {
            if (typeof Matter === 'undefined') {
                document.getElementById('loader').textContent = "Error: Matter.js failed to load.";
                return;
            }
            const loader = document.getElementById('loader');
            if(loader) loader.style.display = 'none';
            init();
        };

        if (document.readyState === 'complete') {
            startApp();
        } else {
            window.addEventListener('load', startApp);
        }

        // Module aliases
        let Engine, Render, Runner, Bodies, Body, Composite, Events, Vector, Query;

        // Global State
        let engine, render, runner;
        let width, height;
        let isGameActive = false;
        
        let currentBlock = null;
        let stickman = null;
        let walls = [];
        
        let score = 0;
        let linesCleared = 0;
        let level = 1;

        // Dynamic Block Size
        let blockSize = 40; 
        const GRID_WIDTH = 13; 

        // Input State
        let tilt = { x: 0, y: 0 };
        const TILT_SENSITIVITY = 0.0006;
        
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;

        // GRAPPLE STATE
        let isGrappling = false;
        let grappleBody = null;
        let grappleTargetPos = { x: 0, y: 0 };

        // Config
        let stickmanW = 30;
        let stickmanH = 60;
        const STICKMAN_SPEED = 8;
        
        // Velocity Cap to prevent tunneling through walls
        const MAX_VELOCITY = 40;

        function init() {
            Engine = Matter.Engine;
            Render = Matter.Render;
            Runner = Matter.Runner;
            Bodies = Matter.Bodies;
            Body = Matter.Body;
            Composite = Matter.Composite;
            Events = Matter.Events;
            Vector = Matter.Vector;
            Query = Matter.Query;

            width = window.innerWidth;
            height = window.innerHeight;
            
            blockSize = width / GRID_WIDTH;
            
            stickmanW = blockSize * 0.7;
            stickmanH = blockSize * 1.5;

            // Use higher iteration counts for better collision stability
            engine = Engine.create({ 
                enableSleeping: false,
                positionIterations: 8,
                velocityIterations: 8
            });
            engine.world.gravity.y = 1;

            render = Render.create({
                element: document.getElementById('canvas-container'),
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false, 
                    background: '#1a1a1a',
                    pixelRatio: window.devicePixelRatio
                }
            });

            Events.on(render, 'afterRender', renderCustomGraphics);
            Events.on(engine, 'collisionStart', handleCollisions);
            Events.on(engine, 'beforeUpdate', gameLoop);

            setupInputs();

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);
            
            window.addEventListener('resize', handleResize);
            document.getElementById('start-btn').addEventListener('click', startAction);
        }

        // --- Core Game Logic ---

        function startGame() {
            Composite.clear(engine.world);
            
            score = 0;
            linesCleared = 0;
            level = 1;
            engine.world.gravity.y = 1; 
            
            updateHUD();
            isGameActive = true;
            isGrappling = false;
            grappleBody = null;

            createWalls();
            createStickman();
            
            document.getElementById('start-screen').classList.add('hidden');
            
            spawnBlock();
            
            if (window.rowInterval) clearInterval(window.rowInterval);
            window.rowInterval = setInterval(checkRows, 800);
        }

        function createWalls() {
            // "Bunker" Strategy: 1000px thick walls to prevent tunneling
            const thickness = 1000;
            const options = { isStatic: true, render: { fillStyle: '#333' }, friction: 0.5, label: 'wall' };

            walls = [
                // Floor (Center Y = height + half_thickness)
                Bodies.rectangle(width/2, height + thickness/2, width + thickness*2, thickness, options),
                
                // Ceiling (Center Y = -half_thickness) -> Prevents flying out top
                Bodies.rectangle(width/2, -thickness/2, width + thickness*2, thickness, options),

                // Left Wall (Center X = -half_thickness)
                Bodies.rectangle(-thickness/2, height/2, thickness, height * 4, options),
                
                // Right Wall (Center X = width + half_thickness)
                Bodies.rectangle(width + thickness/2, height/2, thickness, height * 4, options)
            ];
            Composite.add(engine.world, walls);
        }

        function createStickman() {
            if (stickman) Composite.remove(engine.world, stickman);
            stickman = Bodies.rectangle(width/2, height - 100, stickmanW, stickmanH, {
                label: 'stickman',
                inertia: Infinity,
                friction: 0.1,
                frictionAir: 0.02,
                restitution: 0,
                render: { visible: false }, 
                collisionFilter: { group: -1 } 
            });
            Composite.add(engine.world, stickman);
        }

        function spawnBlock() {
            if (!isGameActive) return;

            const startX = width / 2;
            const startY = 60; // Spawn slightly lower inside the box

            const types = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            let parts = [];
            let color = '';

            const sq = (x, y) => Bodies.rectangle(x * blockSize, y * blockSize, blockSize, blockSize);

            switch(type) {
                case 'I': color = '#4ECDC4'; parts = [sq(0,0), sq(1,0), sq(2,0), sq(3,0)]; break; 
                case 'O': color = '#FFE66D'; parts = [sq(0,0), sq(1,0), sq(0,1), sq(1,1)]; break;
                case 'T': color = '#FF6B6B'; parts = [sq(1,0), sq(0,1), sq(1,1), sq(2,1)]; break;
                case 'S': color = '#96c93d'; parts = [sq(1,0), sq(2,0), sq(0,1), sq(1,1)]; break;
                case 'Z': color = '#FF9F43'; parts = [sq(0,0), sq(1,0), sq(1,1), sq(2,1)]; break;
                case 'J': color = '#54A0FF'; parts = [sq(0,0), sq(0,1), sq(1,1), sq(2,1)]; break;
                case 'L': color = '#f368e0'; parts = [sq(2,0), sq(0,1), sq(1,1), sq(2,1)]; break;
            }

            const block = Body.create({
                parts: parts,
                label: 'activeBlock',
                friction: 0.8,
                restitution: 0.1,
                density: 0.002,
                collisionCounts: 0
            });

            Body.setPosition(block, { x: startX, y: startY });

            block.parts.forEach(p => {
                p.render.fillStyle = color;
                p.render.strokeStyle = '#222';
                p.render.lineWidth = 2;
                p.render.opacity = 1;
            });

            Composite.add(engine.world, block);
            currentBlock = block;
        }

        function gameLoop(event) {
            if (!isGameActive) return;

            // --- 1. Velocity Cap (Prevents tunneling) ---
            Composite.allBodies(engine.world).forEach(b => {
                if (!b.isStatic) {
                    const velocity = b.velocity;
                    const speed = Vector.magnitude(velocity);
                    if (speed > MAX_VELOCITY) {
                        const ratio = MAX_VELOCITY / speed;
                        Body.setVelocity(b, { x: velocity.x * ratio, y: velocity.y * ratio });
                    }
                }
            });

            // --- 2. Stickman Position Clamping (Hard Limit) ---
            if (stickman) {
                const pos = stickman.position;
                let reset = false;

                // If Stickman somehow gets OUTSIDE the 1000px walls
                if (pos.x < 0) { Body.setPosition(stickman, { x: 20, y: pos.y }); reset = true; }
                if (pos.x > width) { Body.setPosition(stickman, { x: width - 20, y: pos.y }); reset = true; }
                if (pos.y < 0) { Body.setPosition(stickman, { x: pos.x, y: 20 }); reset = true; }
                if (pos.y > height) { Body.setPosition(stickman, { x: width/2, y: height - 100 }); reset = true; }

                if (reset) {
                    Body.setVelocity(stickman, { x: 0, y: 0 }); // Stop momentum
                }
            }

            // --- 3. Block Control ---
            if (currentBlock && currentBlock.label === 'activeBlock') {
                const forceX = tilt.x * TILT_SENSITIVITY * currentBlock.mass;
                const forceY = tilt.y * TILT_SENSITIVITY * currentBlock.mass;
                Body.applyForce(currentBlock, currentBlock.position, { x: forceX, y: forceY });

                if (currentBlock.speed < 0.2 && currentBlock.angularSpeed < 0.02) {
                    currentBlock.lockTimer = (currentBlock.lockTimer || 0) + event.delta;
                    if (currentBlock.lockTimer > 500) lockBlock(currentBlock);
                } else {
                    currentBlock.lockTimer = 0;
                }
                
                const maxSpeed = 20 + (level * 2);
                if (currentBlock.velocity.y > maxSpeed) Body.setVelocity(currentBlock, { x: currentBlock.velocity.x, y: maxSpeed });
            }
        }

        function lockBlock(block) {
            block.label = 'stackedBlock';
            Body.setDensity(block, 0.01); 
            score += 10;
            updateHUD();
            currentBlock = null;
            setTimeout(spawnBlock, 200);
        }

        function handleCollisions(event) {
            event.pairs.forEach(pair => {
                const bodyA = pair.bodyA;
                const bodyB = pair.bodyB;

                let player = null;
                let other = null;

                if (bodyA.label === 'stickman') { player = bodyA; other = bodyB; }
                else if (bodyB.label === 'stickman') { player = bodyB; other = bodyA; }

                if (player) {
                    if (player.velocity.y < -2 && other.position.y < player.position.y - 10) {
                         const parent = other.parent;
                         if (parent && (parent.label === 'stackedBlock' || parent.label === 'activeBlock')) {
                             parent.collisionCounts = (parent.collisionCounts || 0) + 1;
                             parent.parts.forEach(p => p.render.opacity = 1 - (parent.collisionCounts * 0.3));
                             Body.setVelocity(player, { x: player.velocity.x, y: 5 });

                             if (parent.collisionCounts >= 3) {
                                 createExplosion(parent.position);
                                 Composite.remove(engine.world, parent);
                                 score += 50;
                                 updateHUD();
                             }
                         }
                    }
                }
            });
        }

        // --- Row Clearing (Sampling) ---
        function checkRows() {
            if (!isGameActive) return;
            
            const scanStart = height - 50;
            const scanEnd = 50;
            const scanStep = 25; 
            const samples = 20; 
            const threshold = 0.70; 
            
            let blocksToRemove = new Set();
            let rowsCleared = 0;

            for (let y = scanStart; y > scanEnd; y -= scanStep) {
                 let hitCount = 0;
                 
                 for(let i=0; i < samples; i++) {
                     const px = (width / samples) * i + (width / samples / 2);
                     const bodies = Query.point(Composite.allBodies(engine.world), { x: px, y: y });
                     
                     const hasBlock = bodies.some(b => 
                        b.label !== 'stickman' && 
                        b.label !== 'wall' && 
                        !b.isStatic &&
                        (b.label === 'stackedBlock' || (b.parent && b.parent.label === 'stackedBlock'))
                     );

                     if(hasBlock) hitCount++;
                 }

                 if ((hitCount / samples) >= threshold) {
                     const start = { x: 0, y: y };
                     const end = { x: width, y: y };
                     const collisions = Query.ray(Composite.allBodies(engine.world), start, end);
                     
                     collisions.forEach(c => {
                         if (c.body.parent && c.body.parent.label === 'stackedBlock') {
                             blocksToRemove.add(c.body.parent);
                         }
                     });
                     
                     rowsCleared++;
                     y -= 30; 
                 }
            }
            
            if (blocksToRemove.size > 0) {
                blocksToRemove.forEach(body => {
                    createExplosion(body.position);
                    Composite.remove(engine.world, body);
                });
                
                score += (blocksToRemove.size * 50) + (rowsCleared * 500);
                linesCleared += rowsCleared;
                
                // DIFFICULTY UPDATE
                const newLevel = 1 + Math.floor(linesCleared / 3);
                if (newLevel > level) {
                    level = newLevel;
                    engine.world.gravity.y = 1 + (level * 0.1);
                }

                updateHUD();
                
                const flash = document.createElement('div');
                flash.className = 'flash-overlay';
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 250);
            }
        }

        function createExplosion(pos) {
            for(let i=0; i<5; i++) {
                const p = Bodies.rectangle(pos.x, pos.y, blockSize/3, blockSize/3, { render: { fillStyle: '#fff' }});
                Body.applyForce(p, p.position, { x: (Math.random()-0.5)*0.02, y: (Math.random()-0.5)*0.02 });
                Composite.add(engine.world, p);
                setTimeout(() => Composite.remove(engine.world, p), 800);
            }
        }

        function renderCustomGraphics() {
            if (!stickman || !isGameActive) return;
            const ctx = render.context;
            const pos = stickman.position;
            
            c
