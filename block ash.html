<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gravity Box</title>
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling */
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none; /* Prevent browser zooming/swiping */
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Overlay UI for permissions and info */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let touches pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #start-btn {
            pointer-events: auto; /* Re-enable clicks for the button */
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, opacity 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        .hidden {
            opacity: 0;
            pointer-events: none !important;
        }

        #status-text {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
        
        /* Message for desktop users */
        #desktop-warning {
            display: none;
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ffcc00;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            font-size: 0.9rem;
        }

        @media (min-width: 1024px) {
            #desktop-warning {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="desktop-warning">
        For the best experience, open this on a mobile device to use tilt controls! <br>
        (You can still drag blocks with your mouse)
    </div>

    <div id="ui-layer">
        <button id="start-btn">Enable Physics</button>
        <div id="status-text">Tilt your device to move the blocks</div>
    </div>

    <script>
        // Module aliases for convenience
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Composites = Matter.Composites,
              Common = Matter.Common,
              MouseConstraint = Matter.MouseConstraint,
              Mouse = Matter.Mouse,
              Events = Matter.Events,
              World = Matter.World;

        // Global variables
        let engine, render, runner;
        let width, height;
        let walls = [];
        let isSensorActive = false;

        function init() {
            // Setup engine
            engine = Engine.create();
            width = window.innerWidth;
            height = window.innerHeight;

            // Create renderer
            render = Render.create({
                element: document.getElementById('canvas-container'),
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false,
                    background: '#1a1a1a',
                    pixelRatio: window.devicePixelRatio // Sharper rendering on mobile
                }
            });

            // Create boundaries
            createBoundaries();

            // Add random shapes
            addShapes();

            // Add mouse control (interaction)
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: {
                    stiffness: 0.2,
                    render: {
                        visible: false
                    }
                }
            });
            Composite.add(engine.world, mouseConstraint);

            // Keep the mouse in sync with rendering
            render.mouse = mouse;

            // Run the renderer
            Render.run(render);

            // Create runner
            runner = Runner.create();
            Runner.run(runner, engine);

            // Handle resize
            window.addEventListener('resize', handleResize);
        }

        function createBoundaries() {
            // Remove existing walls if any
            Composite.remove(engine.world, walls);
            walls = [];

            const wallThickness = 60; // Thick walls so fast objects don't clip through
            const options = { 
                isStatic: true, 
                render: { fillStyle: '#333' } 
            };

            // Floor
            walls.push(Bodies.rectangle(width / 2, height + wallThickness / 2 - 10, width, wallThickness, options));
            // Ceiling
            walls.push(Bodies.rectangle(width / 2, -wallThickness / 2, width, wallThickness, options));
            // Left Wall
            walls.push(Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height, options));
            // Right Wall
            walls.push(Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height, options));

            Composite.add(engine.world, walls);
        }

        function addShapes() {
            // Add a stack of mixed shapes
            const stack = Composites.stack(width/4, height/4, 5, 5, 0, 0, function(x, y) {
                let sides = Math.round(Common.random(1, 8));

                // Selection of colors
                const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F43', '#54A0FF'];
                const randomColor = Common.choose(colors);

                switch (Math.round(Common.random(0, 1))) {
                    case 0:
                        if (Common.random() < 0.8) {
                            return Bodies.rectangle(x, y, Common.random(40, 60), Common.random(40, 60), {
                                render: { fillStyle: randomColor },
                                friction: 0.1,
                                restitution: 0.5 // Bounciness
                            });
                        } else {
                            return Bodies.rectangle(x, y, Common.random(80, 120), Common.random(20, 30), {
                                render: { fillStyle: randomColor },
                                friction: 0.1,
                                restitution: 0.5
                            });
                        }
                    case 1:
                        return Bodies.polygon(x, y, sides, Common.random(25, 50), {
                            render: { fillStyle: randomColor },
                            friction: 0.1,
                            restitution: 0.6
                        });
                }
            });

            Composite.add(engine.world, stack);
        }

        function handleResize() {
            width = window.innerWidth;
            height = window.innerHeight;
            render.canvas.width = width;
            render.canvas.height = height;
            createBoundaries();
        }

        // --- Sensor Logic ---

        function handleOrientation(event) {
            if (!engine) return;

            const orientation = window.screen.orientation || {};
            let gravityX = 0;
            let gravityY = 0;

            // Get orientation data
            // Beta: Front to Back (-180 to 180)
            // Gamma: Left to Right (-90 to 90)
            const beta = event.beta; 
            const gamma = event.gamma;

            // Limit gravity strength
            const maxGravity = 1.5;

            // Adjust axes based on screen rotation (Portrait vs Landscape)
            // Note: This is a simplified check.
            const angle = orientation.angle || 0;

            if (angle === 0) {
                // Portrait
                gravityX = clamp(gamma / 45, -maxGravity, maxGravity);
                gravityY = clamp(beta / 45, -maxGravity, maxGravity);
            } else if (angle === 90) {
                // Landscape (Home button left)
                gravityX = clamp(beta / 45, -maxGravity, maxGravity);
                gravityY = clamp(-gamma / 45, -maxGravity, maxGravity);
            } else if (angle === -90 || angle === 270) {
                // Landscape (Home button right)
                gravityX = clamp(-beta / 45, -maxGravity, maxGravity);
                gravityY = clamp(gamma / 45, -maxGravity, maxGravity);
            } else if (angle === 180) {
                 // Upside down
                gravityX = clamp(-gamma / 45, -maxGravity, maxGravity);
                gravityY = clamp(-beta / 45, -maxGravity, maxGravity);
            }

            // Apply to engine
            engine.gravity.x = gravityX;
            engine.gravity.y = gravityY;
        }

        function clamp(val, min, max) {
            return Math.min(Math.max(val, min), max);
        }

        // --- Permission Handling for iOS 13+ ---

        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');

        startBtn.addEventListener('click', async () => {
            // Hide button
            startBtn.classList.add('hidden');
            
            // Check if DeviceOrientationEvent is defined
            if (typeof DeviceOrientationEvent !== 'undefined') {
                // Check if requestPermission is a function (iOS 13+)
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const permissionState = await DeviceOrientationEvent.requestPermission();
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            statusText.textContent = "Sensors Active! Tilt to play.";
                            isSensorActive = true;
                        } else {
                            statusText.textContent = "Permission denied. Reload to try again.";
                            startBtn.classList.remove('hidden');
                        }
                    } catch (error) {
                        console.error(error);
                        // Fallback for non-secure contexts or other errors
                        statusText.textContent = "Error accessing sensors. (HTTPS required?)";
                    }
                } else {
                    // Non-iOS 13+ devices (Android, older iOS)
                    window.addEventListener('deviceorientation', handleOrientation);
                    statusText.textContent = "Sensors Active! Tilt to play.";
                    isSensorActive = true;
                }
            } else {
                statusText.textContent = "Device orientation not supported on this device.";
            }

            // Add a few more shapes for fun on click
            if(engine) {
                const colors = ['#fff', '#ccc'];
                const b = Bodies.circle(width/2, height/2, 30, { 
                    render: { fillStyle: '#fff' },
                    restitution: 0.8 
                });
                Composite.add(engine.world, b);
            }
        });

        // Start the physics engine immediately
        init();

    </script>
</body>
</html>
