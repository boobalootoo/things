<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gravity Box</title>
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling */
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none; /* Prevent browser zooming/swiping */
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Overlay UI for permissions and info */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let touches pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            transition: opacity 0.5s;
        }
        
        #ui-layer.active-game {
            background: transparent;
            pointer-events: none;
        }

        #start-btn {
            pointer-events: auto; /* Re-enable clicks for the button */
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            border: none;
            border-radius: 50px;
            padding: 20px 50px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, opacity 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        .hidden {
            opacity: 0;
            pointer-events: none !important;
        }

        #status-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            text-align: center;
            width: 80%;
            max-width: 400px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.5;
        }
        
        .ios-hint {
            font-size: 0.8rem;
            color: #ffd700;
            margin-top: 10px;
            display: none;
        }

        /* Detect iOS to show hint */
        @supports (-webkit-touch-callout: none) {
            .ios-hint {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <button id="start-btn">Enable Gravity</button>
        <div id="status-text">
            Tap to start.<br>
            <span class="ios-hint">iPhone Users: Please enable <strong>Portrait Orientation Lock</strong> in Control Center for best results.</span>
        </div>
    </div>

    <script>
        // Module aliases
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Composites = Matter.Composites,
              Common = Matter.Common,
              MouseConstraint = Matter.MouseConstraint,
              Mouse = Matter.Mouse,
              World = Matter.World;

        // Global variables
        let engine, render, runner;
        let width, height;
        let walls = [];
        let isSensorActive = false;

        function init() {
            // Setup engine
            engine = Engine.create();
            width = window.innerWidth;
            height = window.innerHeight;

            // Create renderer
            render = Render.create({
                element: document.getElementById('canvas-container'),
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false,
                    background: '#1a1a1a',
                    pixelRatio: window.devicePixelRatio || 1
                }
            });

            createBoundaries();
            addShapes();

            // Add mouse control
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: {
                    stiffness: 0.2,
                    render: { visible: false }
                }
            });
            Composite.add(engine.world, mouseConstraint);
            render.mouse = mouse;

            // Start simulation
            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);

            // Listeners
            window.addEventListener('resize', handleResize);
        }

        function createBoundaries() {
            Composite.remove(engine.world, walls);
            walls = [];

            const wallThickness = 100; // Extra thick to prevent tunneling
            const options = { 
                isStatic: true, 
                render: { fillStyle: '#333' } 
            };

            // Floor
            walls.push(Bodies.rectangle(width / 2, height + wallThickness / 2, width, wallThickness, options));
            // Ceiling
            walls.push(Bodies.rectangle(width / 2, -wallThickness / 2, width, wallThickness, options));
            // Left Wall
            walls.push(Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height, options));
            // Right Wall
            walls.push(Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height, options));

            Composite.add(engine.world, walls);
        }

        function addShapes() {
            // Add a stack of mixed shapes
            const stack = Composites.stack(width/4, height/4, 4, 4, 0, 0, function(x, y) {
                let sides = Math.round(Common.random(1, 8));
                const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F43', '#54A0FF'];
                const randomColor = Common.choose(colors);
                
                // Randomly choose shape types
                const type = Math.random();

                if (type < 0.6) { // Rectangle/Square
                    return Bodies.rectangle(x, y, Common.random(40, 70), Common.random(40, 70), {
                        render: { fillStyle: randomColor },
                        friction: 0.1,
                        restitution: 0.6
                    });
                } else { // Polygon/Circle-ish
                    return Bodies.polygon(x, y, sides, Common.random(25, 40), {
                        render: { fillStyle: randomColor },
                        friction: 0.1,
                        restitution: 0.7
                    });
                }
            });

            Composite.add(engine.world, stack);
        }

        function handleResize() {
            width = window.innerWidth;
            height = window.innerHeight;
            render.canvas.width = width;
            render.canvas.height = height;
            
            createBoundaries();
            keepBodiesInBounds();
        }

        // SAFETY FUNCTION: Teleports lost bodies back into view
        function keepBodiesInBounds() {
            const bodies = Composite.allBodies(engine.world);
            const buffer = 50; 

            bodies.forEach(body => {
                if (body.isStatic) return;

                let newX = body.position.x;
                let newY = body.position.y;
                let shouldTeleport = false;

                // Check bounds with a buffer
                if (newX < buffer) { newX = buffer; shouldTeleport = true; }
                if (newX > width - buffer) { newX = width - buffer; shouldTeleport = true; }
                if (newY < buffer) { newY = buffer; shouldTeleport = true; }
                if (newY > height - buffer) { newY = height - buffer; shouldTeleport = true; }

                if (shouldTeleport) {
                    Matter.Body.setPosition(body, { x: newX, y: newY });
                    Matter.Body.setVelocity(body, { x: 0, y: 0 }); // Kill momentum
                }
            });
        }

        // --- Sensor Logic ---

        function handleOrientation(event) {
            if (!engine) return;

            // Get screen orientation angle (fallback for older APIs)
            let angle = 0;
            if (screen.orientation && screen.orientation.angle !== undefined) {
                angle = screen.orientation.angle;
            } else if (window.orientation !== undefined) {
                angle = window.orientation;
            }

            let gravityX = 0;
            let gravityY = 0;
            const maxGravity = 1.5;

            // Beta: Front/Back tilt (-180 to 180)
            // Gamma: Left/Right tilt (-90 to 90)
            const beta = event.beta; 
            const gamma = event.gamma;

            // Calculate Gravity Vector based on Screen Angle
            if (angle === 0) {
                // Portrait
                gravityX = clamp(gamma / 45, -maxGravity, maxGravity);
                gravityY = clamp(beta / 45, -maxGravity, maxGravity);
            } else if (angle === 90) {
                // Landscape (Home button left)
                gravityX = clamp(beta / 45, -maxGravity, maxGravity);
                gravityY = clamp(-gamma / 45, -maxGravity, maxGravity);
            } else if (angle === -90 || angle === 270) {
                // Landscape (Home button right)
                gravityX = clamp(-beta / 45, -maxGravity, maxGravity);
                gravityY = clamp(gamma / 45, -maxGravity, maxGravity);
            } else if (angle === 180) {
                // Upside down
                gravityX = clamp(-gamma / 45, -maxGravity, maxGravity);
                gravityY = clamp(-beta / 45, -maxGravity, maxGravity);
            }

            // Smooth updates
            engine.gravity.x += (gravityX - engine.gravity.x) * 0.1;
            engine.gravity.y += (gravityY - engine.gravity.y) * 0.1;
        }

        function clamp(val, min, max) {
            return Math.min(Math.max(val, min), max);
        }

        // --- Permissions & Locking ---

        const startBtn = document.getElementById('start-btn');
        const uiLayer = document.getElementById('ui-layer');
        const statusText = document.getElementById('status-text');

        startBtn.addEventListener('click', async () => {
            // UI Feedback
            startBtn.classList.add('hidden');
            uiLayer.classList.add('active-game');
            statusText.innerHTML = "Sensors Active!<br>Move your device.";

            // 1. Attempt Screen Lock (Android/Desktop)
            // We try to request fullscreen first, as locking often requires it
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    await document.documentElement.webkitRequestFullscreen();
                }
                
                if (screen.orientation && screen.orientation.lock) {
                    // Lock to whatever the current orientation is (usually portrait)
                    await screen.orientation.lock(screen.orientation.type);
                }
            } catch (err) {
                console.log("Screen lock/Fullscreen not supported or denied:", err);
                // This is expected on iOS, so we don't alert the user
            }

            // 2. Request Sensor Permissions (iOS 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    } else {
                        uiLayer.classList.remove('active-game');
                        startBtn.classList.remove('hidden');
                        statusText.textContent = "Permission denied.";
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                // Non-iOS 13+ devices
                window.addEventListener('deviceorientation', handleOrientation);
            }
        });

        init();

    </script>
</body>
</html>
