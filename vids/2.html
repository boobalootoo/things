<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Safe Playlist Player</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            min-height: 100vh;
            touch-action: manipulation;
        }

        /* Responsive 16:9 Aspect Ratio */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 0.75rem;
            background-color: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Waving hand animation */
        @keyframes wave {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(14deg); }
            40% { transform: rotate(-8deg); }
            60% { transform: rotate(14deg); }
            80% { transform: rotate(-4deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-wave {
            display: inline-block;
            transform-origin: 70% 70%;
            animation: wave 2s infinite;
        }

        /* Drag handle styling for floating widgets */
        .drag-handle {
            cursor: move;
            touch-action: none;
        }

        /* Pixelated aesthetic for Hourglass */
        .pixel-art {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-3 sm:p-6 min-h-screen">

    <!-- OVERLAY: Session Ended Screen -->
    <div id="sessionEndScreen" class="fixed inset-0 z-50 bg-indigo-900 text-white flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="text-7xl sm:text-9xl mb-6 animate-wave">👋</div>
        <h1 class="text-3xl sm:text-5xl font-extrabold mb-4">All done for now!</h1>
        <p class="text-indigo-200 text-lg sm:text-2xl max-w-md">Great job! You've used up your watching time for today.</p>
        <button id="parentUnlockBtn" class="mt-12 text-indigo-400 text-sm underline opacity-50 hover:opacity-100">Parent Access</button>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="appContainer" class="w-full max-w-4xl bg-white p-4 sm:p-6 rounded-2xl shadow-xl transition-all duration-300 relative">
        
        <!-- Header & Parent Toggle -->
        <div class="flex items-center justify-between mb-4 border-b border-gray-100 pb-3">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900">Kids Video Player</h1>
                <p class="text-xs sm:text-sm text-gray-500">Distraction-free YouTube viewer</p>
            </div>
            <button id="toggleParentModeBtn" type="button" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-xs sm:text-sm font-semibold px-3 py-2 rounded-xl transition flex items-center space-x-1 cursor-pointer">
                <span id="parentModeIcon">⚙️</span>
                <span id="parentModeText">Parent Controls</span>
            </button>
        </div>

        <!-- PARENT CONTROL PANEL (Hidden by default for child simplicity) -->
        <div id="parentPanel" class="hidden mb-6 p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-4">
            <h2 class="text-lg font-bold text-slate-800">Playlist & Session Settings</h2>
            
            <!-- Video Input Form -->
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                <input type="text" id="videoTitle" placeholder="Video Title (Optional - auto-fetches if blank)" class="sm:col-span-3 p-2 border rounded-lg text-sm">
                <input type="url" id="videoUrl" placeholder="YouTube Link" class="sm:col-span-4 p-2 border rounded-lg text-sm">
                <input type="text" id="startTime" placeholder="Start (0:00)" class="sm:col-span-1 p-2 border rounded-lg text-sm text-center">
                <input type="text" id="endTime" placeholder="End (0:00)" class="sm:col-span-1 p-2 border rounded-lg text-sm text-center">
                <button id="addItemBtn" type="button" class="sm:col-span-3 bg-green-500 hover:bg-green-600 text-white font-bold p-2 rounded-lg text-sm">Add Video</button>
            </div>

            <!-- Toggles & Limits -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t border-slate-200 text-sm">
                <!-- Thumbnail Toggle -->
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="showThumbnailsToggle" checked class="h-4 w-4 text-indigo-600 rounded">
                    <label for="showThumbnailsToggle" class="font-medium text-slate-700">Show Thumbnails</label>
                </div>

                <!-- Limit Type Selection -->
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Session Limit</label>
                    <select id="limitType" class="w-full p-2 border rounded-lg bg-white text-xs sm:text-sm">
                        <option value="none">No Limit</option>
                        <option value="time">Limit by Minutes</option>
                        <option value="videos">Limit by Video Count</option>
                    </select>
                </div>

                <!-- Limit Value Input -->
                <div id="limitValueContainer" class="hidden">
                    <label id="limitValueLabel" class="block font-medium text-slate-700 mb-1">Limit Value</label>
                    <input type="number" id="limitValue" min="1" value="5" class="w-full p-2 border rounded-lg text-xs sm:text-sm">
                </div>
            </div>

            <!-- Tracker Widget Settings -->
            <div class="pt-2 border-t border-slate-200 text-sm">
                <label class="block font-medium text-slate-700 mb-1">Visual Progress Tracker</label>
                <div class="flex flex-wrap gap-4">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="trackerType" value="none" checked class="text-indigo-600">
                        <span class="ml-2">None</span>
                    </label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="trackerType" value="train" class="text-indigo-600">
                        <span class="ml-2">Moving Train</span>
                    </label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="trackerType" value="hourglass" class="text-indigo-600">
                        <span class="ml-2">Pixel Hourglass</span>
                    </label>
                </div>
            </div>

            <!-- CSV Import/Export -->
            <div class="flex space-x-2 pt-2 border-t border-slate-200">
                <button id="exportCsvBtn" type="button" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold">Export CSV</button>
                <button id="importCsvBtn" type="button" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold">Import CSV</button>
                <input type="file" id="importCsvInput" accept=".csv" class="hidden">
            </div>
        </div>

        <!-- VISUAL TRACKER CONTAINERS -->
        <!-- 1. Train Tracker Bar -->
        <div id="trainTracker" class="hidden mb-4 p-3 bg-indigo-50 border border-indigo-100 rounded-xl relative overflow-hidden">
            <div class="flex items-center justify-between text-xs font-bold text-indigo-500 mb-1">
                <span>START</span>
                <span id="trainStatusLabel">DESTINATION</span>
            </div>
            <!-- Track Line -->
            <div class="relative w-full h-4 bg-slate-300 rounded-full overflow-visible border-b-2 border-slate-400">
                <!-- Stations (Dots) if by video count -->
                <div id="trainStations" class="absolute inset-0 flex justify-between items-center px-1 pointer-events-none"></div>
                <!-- Moving Train Emoji -->
                <div id="trainIcon" class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 text-2xl transition-all duration-500" style="left: 0%;">
                    🚂
                </div>
            </div>
        </div>

        <!-- Playlist Grid (Child Interface) -->
        <div id="playlistSection">
            <div id="playlistContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Videos rendered here dynamically -->
            </div>
            <div id="emptyMessage" class="text-center py-12 text-gray-400">
                No videos available. Click "Parent Controls" to add videos.
            </div>
        </div>

        <!-- Status & Error Box -->
        <div id="messageBox" class="mt-4 p-3 bg-amber-100 border border-amber-300 text-amber-800 rounded-xl hidden text-sm"></div>
    </div>

    <!-- FLOATING HOURGLASS TRACKER (Movable & Resizable) -->
    <div id="hourglassWidget" class="hidden fixed bottom-4 right-4 z-40 bg-slate-900/90 text-white p-3 rounded-2xl shadow-2xl border border-slate-700 select-none min-w-[120px]" style="touch-action: none;">
        <!-- Drag Header -->
        <div class="drag-handle flex items-center justify-between text-xs text-slate-400 mb-2 border-b border-slate-700 pb-1">
            <span class="font-bold cursor-move">⌛ Time Left</span>
            <div class="flex space-x-1">
                <button id="resizeWidgetBtn" type="button" class="hover:text-white px-1 text-xs">🔍</button>
            </div>
        </div>
        <!-- Canvas Hourglass -->
        <div class="flex flex-col items-center">
            <canvas id="hourglassCanvas" width="64" height="64" class="pixel-art mb-1"></canvas>
            <span id="hourglassLabel" class="text-xs font-mono text-indigo-300 font-bold">0m</span>
        </div>
    </div>

    <!-- VIDEO PLAYER MODAL -->
    <div id="videoModal" class="hidden fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-2 sm:p-6" onclick="closeModal(event)">
        <div class="w-full max-w-4xl flex flex-col h-full justify-center" onclick="event.stopPropagation()">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between text-white mb-2 px-2">
                <h3 id="modalVideoTitle" class="text-base sm:text-lg font-bold truncate max-w-[70%]"></h3>
                <button type="button" onclick="closeModal()" class="bg-white/20 hover:bg-white/40 text-white rounded-full p-2 transition">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Video Embed Container -->
            <div id="videoEmbedContainer" class="video-container shadow-2xl"></div>

            <!-- Minimal Child Navigation -->
            <div class="flex items-center justify-between mt-4 px-2">
                <button id="prevBtn" type="button" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl text-lg transition disabled:opacity-30">
                    &larr; Back
                </button>
                <span id="videoCounter" class="text-white text-sm font-semibold"></span>
                <button id="nextBtn" type="button" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl text-lg transition disabled:opacity-30">
                    Next &rarr;
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            playlist: [],
            storageKey: 'kids_safe_playlist_v1',
            showThumbnails: true,
            limitType: 'none',
            limitValue: 5,
            trackerType: 'none',
            
            videosWatched: 0,
            secondsElapsed: 0,
            timerInterval: null,
            currentVideoIndex: -1,
            isParentMode: false,
            widgetScale: 1
        };

        // --- Safe Storage Wrapper (Fixes GitHub Pages / iOS Lockdown issues) ---
        function safeSave() {
            try {
                const dataToSave = {
                    playlist: state.playlist,
                    showThumbnails: state.showThumbnails,
                    limitType: state.limitType,
                    limitValue: state.limitValue,
                    trackerType: state.trackerType
                };
                localStorage.setItem(state.storageKey, JSON.stringify(dataToSave));
            } catch (e) {
                console.warn("Storage write failed (possibly blocked by browser privacy settings):", e);
            }
        }

        function safeLoad() {
            try {
                const raw = localStorage.getItem(state.storageKey);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state.playlist = (parsed.playlist || []).map(item => ({
                        ...item,
                        hidden: item.hidden || false
                    }));
                    state.showThumbnails = parsed.showThumbnails !== undefined ? parsed.showThumbnails : true;
                    state.limitType = parsed.limitType || 'none';
                    state.limitValue = parsed.limitValue || 5;
                    state.trackerType = parsed.trackerType || 'none';
                }
            } catch (e) {
                console.warn("Storage read failed:", e);
                state.playlist = [];
            }
        }

        // --- Helper Utilities ---
        function showMessage(msg) {
            const box = document.getElementById('messageBox');
            if (!box) return;
            box.textContent = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        function parseTimeToSeconds(str) {
            if (!str) return null;
            str = str.trim();
            if (str.includes(':')) {
                const parts = str.split(':').map(Number);
                if (parts.length === 2) return parts[0] * 60 + parts[1];
                if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
            }
            const s = parseInt(str);
            return isNaN(s) ? null : s;
        }

        function extractYoutubeId(url) {
            const pattern = /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([^&\n?#]+)/i;
            const match = url.match(pattern);
            return (match && match[1] && match[1].length === 11) ? match[1] : null;
        }

        async function fetchYouTubeTitle(id) {
            try {
                const response = await fetch(`https://noembed.com/embed?dataType=json&url=https://www.youtube.com/watch?v=${id}`);
                const data = await response.json();
                return data.title || null;
            } catch (e) {
                console.warn("Could not fetch title automatically:", e);
                return null;
            }
        }

        // --- UI Rendering ---
        function renderPlaylist() {
            const playlistContainer = document.getElementById('playlistContainer');
            const emptyMessage = document.getElementById('emptyMessage');
            if (!playlistContainer) return;

            playlistContainer.innerHTML = '';
            
            // Filter videos for child view when not in parent mode
            const visibleVideos = state.playlist.filter((item, idx) => state.isParentMode || !item.hidden);

            if (visibleVideos.length === 0) {
                emptyMessage.classList.remove('hidden');
                emptyMessage.textContent = state.playlist.length > 0 && !state.isParentMode 
                    ? 'No videos available. (Some videos are hidden by parent).' 
                    : 'No videos available. Click "Parent Controls" to add videos.';
                return;
            }
            emptyMessage.classList.add('hidden');

            state.playlist.forEach((item, index) => {
                // Hide item from child view if hidden option is enabled
                if (!state.isParentMode && item.hidden) return;

                const card = document.createElement('div');
                card.className = `bg-white border-2 ${item.hidden && state.isParentMode ? 'border-amber-300 opacity-60' : 'border-slate-100'} rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between`;
                
                let thumbHtml = '';
                if (state.showThumbnails) {
                    const thumbUrl = `https://img.youtube.com/vi/${item.id}/hqdefault.jpg`;
                    thumbHtml = `
                        <div class="relative w-full pb-[56.25%] bg-slate-200">
                            <img src="${thumbUrl}" class="absolute inset-0 w-full h-full object-cover" alt="${item.title}" loading="lazy">
                            <div class="absolute inset-0 bg-black/10 flex items-center justify-center">
                                <div class="bg-red-600 text-white rounded-full p-3 shadow-lg transform group-hover:scale-110 transition">
                                    ▶
                                </div>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${thumbHtml}
                    <div class="p-4 flex flex-col justify-between flex-grow">
                        <div class="flex items-start justify-between">
                            <div class="flex-grow">
                                <h3 id="titleDisplay-${index}" class="font-bold text-gray-800 text-base line-clamp-2">${item.title}</h3>
                                ${item.startTime || item.endTime ? '<span class="text-xs text-indigo-500 font-semibold">Custom Clip</span>' : ''}
                                ${item.hidden && state.isParentMode ? '<span class="text-xs text-amber-600 font-bold ml-2">🙈 Hidden from Child</span>' : ''}
                            </div>
                        </div>

                        ${state.isParentMode ? `
                            <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-1 text-xs" onclick="event.stopPropagation()">
                                <div class="flex items-center space-x-1">
                                    <button type="button" onclick="moveVideo(event, ${index}, -1)" ${index === 0 ? 'disabled' : ''} class="bg-slate-100 hover:bg-slate-200 disabled:opacity-30 p-1.5 rounded-lg font-bold">⬆️</button>
                                    <button type="button" onclick="moveVideo(event, ${index}, 1)" ${index === state.playlist.length - 1 ? 'disabled' : ''} class="bg-slate-100 hover:bg-slate-200 disabled:opacity-30 p-1.5 rounded-lg font-bold">⬇️</button>
                                    <button type="button" onclick="toggleHideVideo(event, ${index})" class="bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded-lg font-semibold text-slate-700">
                                        ${item.hidden ? '👁️ Show' : '🙈 Hide'}
                                    </button>
                                    <button type="button" onclick="renameVideo(event, ${index})" class="bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded-lg font-semibold text-slate-700">✏️ Rename</button>
                                </div>
                                <button type="button" onclick="removeVideo(event, ${index})" class="text-red-500 hover:text-red-700 font-bold p-1">✕ Delete</button>
                            </div>
                        ` : ''}
                    </div>
                `;

                card.onclick = () => playVideo(index);
                playlistContainer.appendChild(card);
            });
        }

        // --- Parent Action Helpers ---
        window.moveVideo = function(e, index, direction) {
            e.stopPropagation();
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= state.playlist.length) return;
            const temp = state.playlist[index];
            state.playlist[index] = state.playlist[targetIndex];
            state.playlist[targetIndex] = temp;
            safeSave();
            renderPlaylist();
        };

        window.toggleHideVideo = function(e, index) {
            e.stopPropagation();
            state.playlist[index].hidden = !state.playlist[index].hidden;
            safeSave();
            renderPlaylist();
        };

        window.renameVideo = function(e, index) {
            e.stopPropagation();
            const newTitle = prompt("Enter new title for this video:", state.playlist[index].title);
            if (newTitle !== null && newTitle.trim() !== "") {
                state.playlist[index].title = newTitle.trim();
                safeSave();
                renderPlaylist();
            }
        };

        async function addVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            const id = extractYoutubeId(url);

            if (!id) {
                showMessage("Please enter a valid YouTube URL.");
                return;
            }

            let title = document.getElementById('videoTitle').value.trim();
            
            // Auto-fetch YouTube title if user didn't enter one
            if (!title) {
                showMessage("Fetching video title from YouTube...");
                const fetchedTitle = await fetchYouTubeTitle(id);
                title = fetchedTitle || `Video ${state.playlist.length + 1}`;
            }

            const startTime = parseTimeToSeconds(document.getElementById('startTime').value);
            const endTime = parseTimeToSeconds(document.getElementById('endTime').value);

            state.playlist.push({ id, title, startTime, endTime, hidden: false });
            safeSave();
            renderPlaylist();

            document.getElementById('videoTitle').value = '';
            document.getElementById('videoUrl').value = '';
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
        }

        window.removeVideo = function(e, index) {
            e.stopPropagation();
            state.playlist.splice(index, 1);
            safeSave();
            renderPlaylist();
        };

        function makeDraggable(el) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const handle = el.querySelector('.drag-handle') || el;
            
            handle.onmousedown = dragMouseDown;
            handle.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function dragTouchStart(e) {
                const touch = e.touches[0];
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementTouchMove;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                el.style.top = (el.offsetTop - pos2) + "px";
                el.style.left = (el.offsetLeft - pos1) + "px";
                el.style.bottom = 'auto';
                el.style.right = 'auto';
            }

            function elementTouchMove(e) {
                const touch = e.touches[0];
                pos1 = pos3 - touch.clientX;
                pos2 = pos4 - touch.clientY;
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                el.style.top = (el.offsetTop - pos2) + "px";
                el.style.left = (el.offsetLeft - touch.clientX) + "px";
                el.style.bottom = 'auto';
                el.style.right = 'auto';
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }

        function exportCSV() {
            if (!state.playlist.length) return showMessage("Playlist is empty.");
            let csv = "Title,VideoID,StartTime,EndTime,Hidden\n";
            state.playlist.forEach(i => {
                csv += `"${i.title.replace(/"/g, '""')}",${i.id},${i.startTime||''},${i.endTime||''},${i.hidden ? 'true' : 'false'}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'kids_playlist.csv';
            a.click();
        }

        function importCSV(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split('\n');
                const newPlaylist = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const parts = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
                    if (parts.length >= 2) {
                        const title = parts[0].replace(/^"|"$/g, '');
                        const id = parts[1];
                        const startTime = parts[2] ? parseInt(parts[2]) : null;
                        const endTime = parts[3] ? parseInt(parts[3]) : null;
                        const hidden = parts[4] ? parts[4].trim().toLowerCase() === 'true' : false;
                        newPlaylist.push({ title, id, startTime, endTime, hidden });
                    }
                }
                if (newPlaylist.length) {
                    state.playlist = newPlaylist;
                    safeSave();
                    renderPlaylist();
                    showMessage("Playlist imported successfully!");
                }
            };
            reader.readAsText(file);
        }

        // --- Direct Global Event Binding ---
        function initEvents() {
            safeLoad();

            const toggleParentBtn = document.getElementById('toggleParentModeBtn');
            const parentPanel = document.getElementById('parentPanel');
            const parentModeText = document.getElementById('parentModeText');

            // Robust click handling
            toggleParentBtn.addEventListener('click', (e) => {
                e.preventDefault();
                state.isParentMode = !state.isParentMode;
                if (state.isParentMode) {
                    parentPanel.classList.remove('hidden');
                    parentModeText.textContent = 'Done Editing';
                } else {
                    parentPanel.classList.add('hidden');
                    parentModeText.textContent = 'Parent Controls';
                }
                renderPlaylist();
            });

            document.getElementById('addItemBtn').onclick = addVideo;

            document.getElementById('showThumbnailsToggle').onchange = (e) => {
                state.showThumbnails = e.target.checked;
                safeSave();
                renderPlaylist();
            };

            const limitTypeSelect = document.getElementById('limitType');
            const limitValueContainer = document.getElementById('limitValueContainer');
            const limitValueLabel = document.getElementById('limitValueLabel');

            limitTypeSelect.onchange = (e) => {
                state.limitType = e.target.value;
                if (state.limitType === 'none') {
                    limitValueContainer.classList.add('hidden');
                } else {
                    limitValueContainer.classList.remove('hidden');
                    limitValueLabel.textContent = state.limitType === 'time' ? 'Limit (Minutes)' : 'Limit (Videos)';
                }
                safeSave();
                updateTrackers();
            };

            document.getElementById('limitValue').onchange = (e) => {
                state.limitValue = parseInt(e.target.value) || 1;
                safeSave();
                updateTrackers();
            };

            document.querySelectorAll('input[name="trackerType"]').forEach(radio => {
                radio.onchange = (e) => {
                    state.trackerType = e.target.value;
                    safeSave();
                    updateTrackers();
                };
            });

            document.getElementById('prevBtn').onclick = () => playVideo(state.currentVideoIndex - 1);
            document.getElementById('nextBtn').onclick = () => playVideo(state.currentVideoIndex + 1);

            document.getElementById('parentUnlockBtn').onclick = () => {
                document.getElementById('sessionEndScreen').classList.add('hidden');
                state.secondsElapsed = 0;
                state.videosWatched = 0;
                startSessionTimer();
                updateTrackers();
            };

            document.getElementById('exportCsvBtn').onclick = exportCSV;
            document.getElementById('importCsvBtn').onclick = () => document.getElementById('importCsvInput').click();
            document.getElementById('importCsvInput').onchange = importCSV;

            document.getElementById('resizeWidgetBtn').onclick = () => {
                state.widgetScale = state.widgetScale === 1 ? 1.5 : (state.widgetScale === 1.5 ? 2 : 1);
                const hourglassWidget = document.getElementById('hourglassWidget');
                hourglassWidget.style.transform = `scale(${state.widgetScale})`;
                hourglassWidget.style.transformOrigin = 'bottom right';
            };

            makeDraggable(document.getElementById('hourglassWidget'));
            
            // Set initial UI field states
            document.getElementById('showThumbnailsToggle').checked = state.showThumbnails;
            limitTypeSelect.value = state.limitType;
            document.getElementById('limitValue').value = state.limitValue;
            
            const radioToSelect = document.querySelector(`input[name="trackerType"][value="${state.trackerType}"]`);
            if (radioToSelect) radioToSelect.checked = true;

            if (state.limitType !== 'none') {
                limitValueContainer.classList.remove('hidden');
            }

            startSessionTimer();
            renderPlaylist();
            updateTrackers();
        }

        // Run setup once DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEvents);
        } else {
            initEvents();
        }
    </script>
</body>
</html>
