<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Doc Mirror Editor</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mammoth.js for .docx to HTML conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --divider-width: 4px;
        }

        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .split-container {
            display: flex;
            height: calc(100vh - 64px);
            width: 100%;
            position: relative;
        }

        .pane {
            height: 100%;
            overflow-y: auto;
            padding: 3rem 2rem;
            background: white;
            scroll-behavior: smooth;
        }

        .divider {
            width: var(--divider-width);
            cursor: col-resize;
            background-color: #e5e7eb;
            transition: background-color 0.2s;
            position: relative;
            z-index: 10;
        }

        .divider:hover, .divider.dragging {
            background-color: #3b82f6;
        }

        /* Editor specific styling */
        .prose-editor {
            outline: none;
            min-height: 100%;
        }

        /* Basic document styling */
        .doc-content h1 { font-size: 2.25em; font-weight: 800; margin-bottom: 1.5rem; color: #111827; }
        .doc-content h2 { font-size: 1.75em; font-weight: 700; margin-bottom: 1.25rem; color: #1f2937; margin-top: 1.5rem; }
        .doc-content h3 { font-size: 1.25em; font-weight: 600; margin-bottom: 1rem; color: #374151; }
        .doc-content p { margin-bottom: 1.25rem; line-height: 1.7; color: #4b5563; transition: background-color 0.3s ease; border-radius: 4px; padding: 2px 4px; }
        .doc-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.25rem; }
        .doc-content li { margin-bottom: 0.5rem; transition: background-color 0.3s ease; border-radius: 4px; padding: 2px 4px; }

        /* Sync Highlight Effect */
        .sync-highlight {
            background-color: #dbeafe !important; /* Soft blue highlight */
            box-shadow: 0 0 0 2px #bfdbfe;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
        }

        .pane::-webkit-scrollbar {
            width: 6px;
        }
        .pane::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Header / Toolbar -->
    <header class="h-16 bg-white border-b flex items-center justify-between px-6 shadow-sm relative z-20">
        <div class="flex items-center space-x-4">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <i data-lucide="file-text"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-900 leading-none">DocMirror</h1>
                <p class="text-xs text-gray-500">Sync-View Editor</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <label class="cursor-pointer bg-blue-50 text-blue-600 px-4 py-2 rounded-full text-sm font-semibold hover:bg-blue-100 transition flex items-center shadow-sm">
                <i data-lucide="upload" class="w-4 h-4 mr-2"></i>
                Upload .docx
                <input type="file" id="fileInput" accept=".docx" class="hidden">
            </label>
            <button onclick="exportContent()" class="bg-gray-900 text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-gray-800 transition flex items-center shadow-sm">
                <i data-lucide="download" class="w-4 h-4 mr-2"></i>
                Export HTML
            </button>
        </div>
    </header>

    <!-- Main Content Splitter -->
    <main class="split-container" id="mainContainer">
        <!-- Left Pane: View Only -->
        <section id="leftPane" class="pane doc-content border-r" style="width: 50%;">
            <div id="viewerPlaceholder" class="empty-state">
                <i data-lucide="eye" class="w-12 h-12 mb-2 opacity-20"></i>
                <p class="text-sm font-medium">Reader View</p>
            </div>
            <div id="viewerContent"></div>
        </section>

        <!-- Resizer Divider -->
        <div id="divider" class="divider"></div>

        <!-- Right Pane: Editable -->
        <section id="rightPane" class="pane doc-content" style="width: 50%;">
            <div id="editorPlaceholder" class="empty-state">
                <i data-lucide="edit-3" class="w-12 h-12 mb-2 opacity-20"></i>
                <p class="text-sm font-medium">Editor Canvas</p>
            </div>
            <div id="editorContent" class="prose-editor" contenteditable="true"></div>
        </section>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const fileInput = document.getElementById('fileInput');
        const viewerContent = document.getElementById('viewerContent');
        const editorContent = document.getElementById('editorContent');
        const viewerPlaceholder = document.getElementById('viewerPlaceholder');
        const editorPlaceholder = document.getElementById('editorPlaceholder');
        
        const mainContainer = document.getElementById('mainContainer');
        const leftPane = document.getElementById('leftPane');
        const rightPane = document.getElementById('rightPane');
        const divider = document.getElementById('divider');

        // --- File Handling Logic ---

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                
                mammoth.convertToHtml({arrayBuffer: arrayBuffer})
                    .then(function(result) {
                        const rawHtml = result.value;
                        
                        // Process the HTML to inject sync IDs into blocks (p, h1, h2, li, etc)
                        const processedHtml = injectSyncIds(rawHtml);
                        
                        viewerContent.innerHTML = processedHtml;
                        viewerPlaceholder.classList.add('hidden');
                        
                        editorContent.innerHTML = processedHtml;
                        editorPlaceholder.classList.add('hidden');
                    })
                    .catch(function(err) {
                        console.error(err);
                        showMessage("Error reading document.");
                    });
            };
            reader.readAsArrayBuffer(file);
        });

        function injectSyncIds(html) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            
            const blocks = tempDiv.querySelectorAll('p, h1, h2, h3, li');
            blocks.forEach((block, index) => {
                block.setAttribute('data-sync-id', `block-${index}`);
            });
            
            return tempDiv.innerHTML;
        }

        // --- Selection & Highlighting & Scrolling Logic ---

        function handleHighlightUpdate(e) {
            const target = e.target;
            const block = target.closest('[data-sync-id]');
            
            if (!block) {
                clearAllHighlights();
                return;
            }

            const syncId = block.getAttribute('data-sync-id');
            const sourcePane = block.closest('.pane');
            
            clearAllHighlights();
            
            // Highlight matching blocks on both sides
            const matches = document.querySelectorAll(`[data-sync-id="${syncId}"]`);
            matches.forEach(el => {
                el.classList.add('sync-highlight');
                
                // If this element is in the OTHER pane, scroll it into view
                if (el.closest('.pane') !== sourcePane) {
                    el.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'center' // Positions the element in the center of the pane
                    });
                }
            });
        }

        function clearAllHighlights() {
            document.querySelectorAll('.sync-highlight').forEach(el => {
                el.classList.remove('sync-highlight');
            });
        }

        // Listen for interactions in both panes
        viewerContent.addEventListener('click', handleHighlightUpdate);
        editorContent.addEventListener('click', handleHighlightUpdate);
        editorContent.addEventListener('keyup', handleHighlightUpdate);

        // --- Split Pane Resizing Logic ---

        let isDragging = false;

        divider.addEventListener('mousedown', (e) => {
            isDragging = true;
            divider.classList.add('dragging');
            document.body.style.cursor = 'col-resize';
            leftPane.style.pointerEvents = 'none';
            rightPane.style.pointerEvents = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const containerRect = mainContainer.getBoundingClientRect();
            const relativeX = e.clientX - containerRect.left;
            let percentage = (relativeX / containerRect.width) * 100;
            
            if (percentage < 10) percentage = 10;
            if (percentage > 90) percentage = 90;

            leftPane.style.width = `${percentage}%`;
            rightPane.style.width = `${100 - percentage}%`;
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                divider.classList.remove('dragging');
                document.body.style.cursor = 'default';
                leftPane.style.pointerEvents = 'auto';
                rightPane.style.pointerEvents = 'auto';
            }
        });

        // --- Helpers ---

        function showMessage(msg) {
            const msgBox = document.createElement('div');
            msgBox.className = "fixed bottom-5 left-1/2 -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full shadow-xl z-50 text-sm font-bold";
            msgBox.innerText = msg;
            document.body.appendChild(msgBox);
            setTimeout(() => msgBox.remove(), 3000);
        }

        function exportContent() {
            const content = editorContent.innerHTML;
            if (!content) {
                showMessage("Nothing to export!");
                return;
            }
            
            const temp = document.createElement('div');
            temp.innerHTML = content;
            temp.querySelectorAll('.sync-highlight').forEach(el => el.classList.remove('sync-highlight'));
            
            const blob = new Blob([temp.innerHTML], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "doc-mirror-edit.html";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

    </script>
</body>
</html>
