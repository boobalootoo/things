<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneSwipe Pro - Music Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            background: #020617;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .card-stack {
            perspective: 1000px;
        }
        .card-container {
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        .swipe-left { transform: translateX(-150%) rotate(-30deg) !important; opacity: 0; }
        .swipe-right { transform: translateX(150%) rotate(30deg) !important; opacity: 0; }
        
        .action-btn {
            @apply p-4 bg-slate-800/80 backdrop-blur-sm border border-slate-700 hover:scale-110 active:scale-95 transition-all shadow-xl rounded-full;
        }
        
        .playlist-drawer {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        iframe {
            pointer-events: none;
        }

        .video-overlay {
            background: linear-gradient(to top, #1e293b 0%, rgba(30, 41, 59, 0.4) 40%, transparent 100%);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen">

    <!-- Initialization Overlay -->
    <div id="start-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-xl">
        <div class="mb-8 text-center">
            <h1 class="text-5xl font-extrabold mb-2 bg-gradient-to-r from-red-500 via-purple-500 to-emerald-500 bg-clip-text text-transparent">TuneSwipe</h1>
            <p class="text-slate-400 text-sm tracking-widest uppercase">Music Discovery Engine</p>
        </div>
        <button id="init-btn" class="group relative px-10 py-5 bg-white text-black font-black rounded-full overflow-hidden transition-all hover:pr-14 active:scale-95">
            <span class="relative z-10">START DISCOVERING</span>
            <span class="absolute right-4 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-all">→</span>
        </button>
        <p class="mt-6 text-slate-600 text-[10px] uppercase tracking-tighter">Private Local Storage Mode</p>
    </div>

    <!-- Header UI -->
    <div class="text-center mb-6 z-10">
        <div class="flex items-center justify-center gap-2 mb-1">
             <div id="status-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
             <p id="status-text" class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Local Mode Active</p>
        </div>
        <h2 class="text-xl font-black text-white/40 select-none">TUNESWIPE</h2>
    </div>

    <!-- Main Card -->
    <div id="app" class="relative w-80 h-[450px] card-stack z-10">
        <div id="card-container" class="card-container absolute inset-0 bg-slate-800 rounded-[32px] overflow-hidden shadow-2xl border border-slate-700 flex flex-col">
            <div class="relative h-3/4 w-full bg-black">
                <div id="iframe-target" class="w-full h-full">
                    <div class="flex items-center justify-center h-full bg-slate-900 text-slate-500 text-xs italic">Awaiting Selection...</div>
                </div>
                <div class="absolute inset-0 z-10 cursor-grab active:cursor-grabbing"></div>
                <div class="absolute inset-0 video-overlay z-0 pointer-events-none"></div>
            </div>
            
            <div id="card-info" class="p-6 flex-grow flex flex-col justify-end bg-[#1e293b] relative">
                <div class="absolute top-0 left-6 right-6 h-[1px] bg-white/5"></div>
                <h2 id="song-title" class="text-2xl font-extrabold truncate leading-tight">TuneSwipe</h2>
                <p id="song-artist" class="text-slate-400 text-sm font-medium mb-3">Discovery Mode</p>
                <div class="flex gap-2">
                     <span id="badge" class="text-[9px] px-2 py-1 bg-white/5 rounded-md uppercase font-bold tracking-widest text-slate-400 border border-white/10">Snippet Playback</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="flex gap-8 mt-10 z-10">
        <button onclick="window.handleSwipe('left')" class="action-btn hover:bg-red-500/20 group" title="Dislike & Skip">
            <svg class="text-slate-400 group-hover:text-red-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <button onclick="window.handleSwipe('up')" class="action-btn hover:bg-blue-500/20 group" title="Like & Keep Playing">
            <svg class="text-slate-400 group-hover:text-blue-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7M12 19V5"/></svg>
        </button>
        <button onclick="window.handleSwipe('right')" class="action-btn hover:bg-emerald-500/20 group" title="Like & Skip">
            <svg class="text-slate-400 group-hover:text-emerald-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </button>
    </div>

    <!-- Playlist Interaction -->
    <button id="drawer-toggle" class="mt-8 mb-4 flex flex-col items-center text-slate-500 hover:text-white transition-all z-10">
        <span id="drawer-label" class="text-[10px] uppercase font-black tracking-[0.2em] mb-2 opacity-50">Manage Collections</span>
        <svg id="drawer-arrow" class="transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    </button>

    <div id="playlist-drawer" class="fixed bottom-0 left-0 right-0 h-80 bg-[#0f172a] border-t border-slate-800 rounded-t-[40px] playlist-drawer transform translate-y-full z-40 p-8 flex flex-col shadow-[0_-20px_50px_rgba(0,0,0,0.5)]">
        <div class="w-16 h-1.5 bg-slate-700/50 rounded-full mx-auto mb-8 cursor-pointer hover:bg-slate-600 transition-colors" id="drawer-handle"></div>
        
        <div class="flex justify-between items-center mb-6">
            <div>
                <h3 class="font-black text-xl text-white/90 uppercase tracking-tight">Playlists</h3>
                <p id="sync-info" class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">Local Storage Mode</p>
            </div>
            <div class="flex gap-3">
                <button onclick="window.exportData()" class="text-[10px] font-black px-4 py-2 bg-slate-800 rounded-xl hover:bg-slate-700 uppercase tracking-widest border border-white/5">Export CSV</button>
                <button onclick="window.addNewPlaylist()" class="text-[10px] font-black px-4 py-2 bg-emerald-600 rounded-xl hover:bg-emerald-500 uppercase tracking-widest shadow-lg shadow-emerald-900/20">+ Create</button>
            </div>
        </div>

        <div id="playlist-grid" class="flex gap-5 overflow-x-auto pb-6 scroll-smooth">
            <!-- Playlists added dynamically here -->
        </div>
    </div>

    <script>
        // --- DATA PERSISTENCE ---
        let userData = { likes: [], dislikes: [], playlists: { "Favorites": [] } };
        let currentIndex = 0;
        let isTransitioning = false;

        const playlist = [
            { id: "jfKfPfyJRdk", title: "Girlfriend", artist: "Lany", start: 45 },
            { id: "8X6m_15Y-bI", title: "Midnight City", artist: "M83", start: 60 },
            { id: "L_jWHffIx5E", title: "All Star", artist: "Smash Mouth", start: 30 },
            { id: "5dbEhBKGOtY", title: "Blinding Lights", artist: "The Weeknd", start: 45 },
            { id: "y6120QOlsfU", title: "Sandstorm", artist: "Darude", start: 20 },
            { id: "60ItHLz5WEA", title: "Faded", artist: "Alan Walker", start: 45 }
        ];

        const loadLocalData = () => {
            const local = localStorage.getItem('tuneswipe_local_data');
            if (local) {
                userData = JSON.parse(local);
            }
            renderPlaylistButtons();
        };

        const saveLocalData = () => {
            localStorage.setItem('tuneswipe_local_data', JSON.stringify(userData));
        };

        // --- Init App ---
        document.getElementById('init-btn').addEventListener('click', () => {
            document.getElementById('start-overlay').classList.add('hidden');
            updateCardDisplay();
        });

        // --- Core UI Logic ---
        function updateCardDisplay() {
            const container = document.getElementById('card-container');
            if (currentIndex >= playlist.length) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-500 p-10 text-center bg-slate-900">
                        <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M9 15c.5 1 1.5 1.5 3 1.5s2.5-.5 3-1.5"/></svg>
                        </div>
                        <h3 class="text-white text-xl font-black uppercase mb-2">Queue Empty</h3>
                        <p class="text-xs leading-relaxed mb-8 opacity-60">You've explored the entire deck. Ready for a rerun?</p>
                        <button onclick="location.reload()" class="w-full bg-white text-black font-black py-4 rounded-2xl hover:bg-slate-200 transition-all">RESTART SESSION</button>
                    </div>`;
                return;
            }

            const song = playlist[currentIndex];
            document.getElementById('song-title').innerText = song.title;
            document.getElementById('song-artist').innerText = song.artist;
            document.getElementById('badge').innerText = "Snippet Playback";
            document.getElementById('badge').className = "text-[9px] px-2 py-1 bg-white/5 rounded-md uppercase font-bold tracking-widest text-slate-400 border border-white/10";

            const iframeHTML = `<iframe 
                width="100%" 
                height="100%" 
                src="https://www.youtube.com/embed/${song.id}?autoplay=1&controls=0&modestbranding=1&rel=0&start=${song.start}" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen></iframe>`;
            document.getElementById('iframe-target').innerHTML = iframeHTML;
        }

        window.handleSwipe = function(direction, playlistName = null, keepPlaying = false) {
            if (isTransitioning) return;
            const container = document.getElementById('card-container');
            if (!container) return;

            const song = playlist[currentIndex];

            // Record data
            if (direction === 'left') userData.dislikes.push(song.id);
            else userData.likes.push(song.id);

            if (playlistName) {
                if (!userData.playlists[playlistName]) userData.playlists[playlistName] = [];
                userData.playlists[playlistName].push(song.id);
            }

            saveLocalData();

            // Logic for "Up" or "Keep Playing"
            if (direction === 'up' || keepPlaying) {
                document.getElementById('badge').innerText = "Loved & Saved Locally";
                document.getElementById('badge').className = "text-[9px] px-2 py-1 bg-emerald-500 text-white rounded-md uppercase font-bold tracking-widest border-none";
                return;
            }

            // Normal skip transition
            isTransitioning = true;
            const animationClass = direction === 'left' ? 'swipe-left' : 'swipe-right';
            container.classList.add(animationClass);

            setTimeout(() => {
                container.classList.remove('swipe-left', 'swipe-right');
                currentIndex++;
                updateCardDisplay();
                isTransitioning = false;
            }, 500);
        };

        function renderPlaylistButtons() {
            const grid = document.getElementById('playlist-grid');
            if (!grid) return;
            grid.innerHTML = '';
            Object.keys(userData.playlists).forEach(name => {
                const container = document.createElement('div');
                container.className = "flex flex-col items-center gap-2 flex-shrink-0 group";
                
                const btn = document.createElement('button');
                btn.className = "w-20 h-20 bg-slate-800 rounded-[24px] flex flex-col items-center justify-center border border-white/5 hover:bg-slate-700 hover:border-white/20 active:scale-90 transition-all text-[9px] text-center font-black px-2 overflow-hidden leading-tight uppercase tracking-tighter";
                btn.innerHTML = `<span class="opacity-40 mb-1">List</span><span class="truncate w-full text-white/90">${name}</span>`;

                let pressTimer;
                let isLongPress = false;
                const startPress = (e) => {
                    isLongPress = false;
                    pressTimer = setTimeout(() => { isLongPress = true; window.handleSwipe('right', name, true); }, 800);
                };
                const endPress = (e) => {
                    clearTimeout(pressTimer);
                    if (!isLongPress && pressTimer) window.handleSwipe('right', name, false);
                    pressTimer = null;
                };

                btn.addEventListener('mousedown', startPress);
                btn.addEventListener('mouseup', endPress);
                btn.addEventListener('touchstart', startPress, {passive: true});
                btn.addEventListener('touchend', endPress);

                container.appendChild(btn);
                grid.appendChild(container);
            });
        }

        window.addNewPlaylist = () => {
            const name = prompt("Name your new local collection:");
            if (name && name.trim()) {
                const trimmed = name.trim();
                if (!userData.playlists[trimmed]) {
                    userData.playlists[trimmed] = [];
                    saveLocalData();
                    renderPlaylistButtons();
                }
            }
        };

        window.exportData = () => {
            let csv = "Playlist,VideoIDs\n";
            csv += `All_Likes,"${userData.likes.join(',')}"\nDislikes,"${userData.dislikes.join(',')}"\n`;
            Object.keys(userData.playlists).forEach(p => csv += `${p},"${userData.playlists[p].join(',')}"\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'tuneswipe_local_backup.csv'; a.click();
        };

        // --- Drawer Logic ---
        const drawer = document.getElementById('playlist-drawer');
        const toggle = document.getElementById('drawer-toggle');
        const handle = document.getElementById('drawer-handle');
        const arrow = document.getElementById('drawer-arrow');
        let drawerOpen = false;

        function toggleDrawer() {
            drawerOpen = !drawerOpen;
            drawer.style.transform = drawerOpen ? 'translateY(0)' : 'translateY(100%)';
            arrow.style.transform = drawerOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        toggle.addEventListener('click', toggleDrawer);
        handle.addEventListener('click', toggleDrawer);

        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft") window.handleSwipe('left');
            if (e.key === "ArrowRight") window.handleSwipe('right');
            if (e.key === "ArrowUp") window.handleSwipe('up');
        });

        // Initialize from local memory
        loadLocalData();

    </script>
</body>
</html>
