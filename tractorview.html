<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motion AR Tractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #camera-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #sketchfab-iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; border: none; pointer-events: none; }
        .ui-layer { position: fixed; bottom: 30px; left: 0; width: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .glass-panel { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 20px; border-radius: 24px; color: white; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; text-align: center; }
        .btn-primary { background: #3b82f6; color: white; padding: 12px 24px; border-radius: 50px; font-weight: bold; width: 100%; transition: transform 0.1s; }
        .btn-primary:active { transform: scale(0.95); }
        #debug { font-size: 10px; color: #aaa; margin-top: 10px; font-family: monospace; }
        .shutter { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div id="shutter" class="shutter">
        <div class="text-white text-center">
            <h1 class="text-2xl font-bold mb-4">AR Tractor Experience</h1>
            <p class="mb-6 px-8 opacity-70">Requires camera and motion sensor access to track your movements.</p>
            <button onclick="initializeExperience()" class="bg-white text-black px-8 py-3 rounded-full font-bold">START</button>
        </div>
    </div>

    <video id="camera-bg" autoplay playsinline muted></video>
    <iframe id="sketchfab-iframe" allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>

    <div class="ui-layer">
        <div class="glass-panel">
            <div id="sensor-status" class="text-sm mb-3">Motion Sensors: Off</div>
            <button id="sensor-btn" onclick="requestPermissions()" class="btn-primary mb-2">Enable Motion Sensors</button>
            <button onclick="resetCamera()" class="bg-gray-700 text-white px-4 py-2 rounded-full text-xs">Recenter Model</button>
            <div id="debug">Ready. Move your phone to look around.</div>
        </div>
    </div>

    <script>
        const modelId = '327f872b2ffc4ad39f03f143f01d36db';
        const iframe = document.getElementById('sketchfab-iframe');
        const debug = document.getElementById('debug');
        const video = document.getElementById('camera-bg');
        let api = null;

        // AR Tracking State
        let state = {
            baseAlpha: 0,
            distance: 15,
            rotation: 0,
            pitch: 45,
            isCalibrated: false
        };

        // 1. Initialize Camera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Camera access denied", err);
            }
        }

        // 2. Initialize Sketchfab API
        function initSketchfab() {
            const client = new Sketchfab(iframe);
            client.init(modelId, {
                success: (instance) => {
                    api = instance;
                    api.start();
                    api.addEventListener('viewerready', () => {
                        document.getElementById('shutter').style.opacity = '0';
                        setTimeout(() => document.getElementById('shutter').style.display = 'none', 500);
                        updateCamera();
                    });
                },
                error: () => console.error('Sketchfab error'),
                transparent: 1,
                ui_controls: 0,
                ui_infos: 0,
                autostart: 1
            });
        }

        function initializeExperience() {
            startCamera();
            initSketchfab();
        }

        // 3. Sensor Handling
        async function requestPermissions() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS logic
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        activateSensors();
                    }
                } catch (e) {
                    debug.innerText = "Permission rejected.";
                }
            } else {
                // Android / Others
                activateSensors();
            }
        }

        function activateSensors() {
            window.addEventListener('deviceorientation', handleOrientation);
            window.addEventListener('devicemotion', handleMotion);
            document.getElementById('sensor-btn').style.display = 'none';
            document.getElementById('sensor-status').innerText = "Motion Sensors: ACTIVE";
            debug.innerText = "Sensors active. Calibrating...";
        }

        function handleOrientation(event) {
            if (!state.isCalibrated) {
                state.baseAlpha = event.alpha;
                state.isCalibrated = true;
            }

            // Alpha: Yaw (Left/Right)
            // Beta: Pitch (Tilt down/up)
            // Gamma: Roll
            
            // Normalize yaw based on initial calibration
            let yaw = event.alpha - state.baseAlpha;
            
            // Map tilt (beta) to camera pitch (0 is vertical, 90 is top down)
            // Phone usually held at ~70-90 degrees for upright. 
            // If user tilts forward (looking at ground), Beta increases.
            let pitch = event.beta; 
            
            state.rotation = yaw;
            state.pitch = pitch;

            updateCamera();
            
            debug.innerText = `Rot: ${Math.round(yaw)}° | Tilt: ${Math.round(pitch)}° | Zoom: ${state.distance.toFixed(1)}`;
        }

        // Forward/Backward movement detection via simple accelerometer delta
        let lastAccelZ = 0;
        function handleMotion(event) {
            const accel = event.acceleration; // Movement excluding gravity
            if (!accel) return;

            // Detect a surge in Z-axis (forward/backward)
            const threshold = 1.5;
            if (Math.abs(accel.z) > threshold) {
                // If moving forward (negative Z in many coordinate systems)
                // We'll adjust the distance
                state.distance += accel.z * 0.1;
                // Clamp distance
                state.distance = Math.max(5, Math.min(50, state.distance));
                updateCamera();
            }
        }

        function updateCamera() {
            if (!api) return;

            // Convert spherical coordinates to Cartesian for the "eye" position
            const r = state.distance;
            const phi = (state.pitch) * (Math.PI / 180); // vertical angle
            const theta = (-state.rotation) * (Math.PI / 180); // horizontal angle

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            // Sketchfab camera uses [x, y, z] for eye and target
            // We keep target at center [0,0,0]
            api.setCameraLookAt([x, y, z], [0, 0, 0], 0);
        }

        function resetCamera() {
            state.isCalibrated = false;
            state.distance = 15;
            updateCamera();
        }

    </script>
</body>
</html>
