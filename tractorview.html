<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Tractor Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect for front camera */
        }
        #overlay-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 60%;
            z-index: 2;
            pointer-events: auto;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            resize: both;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }
        .status-msg {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: white;
            background: rgba(220, 38, 38, 0.8);
            padding: 8px 16px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="status" class="status-msg">Camera access denied or unavailable.</div>

    <div id="camera-container">
        <video id="video-feed" autoplay playsinline muted></video>
    </div>

    <div id="overlay-container">
        <iframe 
            title="Farm Tractor" 
            src="https://sketchfab.com/models/327f872b2ffc4ad39f03f143f01d36db/embed?autostart=1&transparent=1&ui_infos=0&ui_watermark=0" 
            allow="autoplay; fullscreen; xr-spatial-tracking" 
            xr-spatial-tracking>
        </iframe>
    </div>

    <div class="controls">
        <button onclick="toggleCamera()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full text-sm font-bold flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Switch Camera
        </button>
        <button onclick="adjustSize('smaller')" class="bg-gray-700 hover:bg-gray-600 text-white p-2 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
            </svg>
        </button>
        <button onclick="adjustSize('larger')" class="bg-gray-700 hover:bg-gray-600 text-white p-2 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </button>
    </div>

    <script>
        const video = document.getElementById('video-feed');
        const overlay = document.getElementById('overlay-container');
        const statusMsg = document.getElementById('status');
        let currentStream = null;
        let useFrontCamera = true;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment"
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                statusMsg.style.display = 'none';
                
                // Mirror the video only if it's the front camera
                video.style.transform = useFrontCamera ? 'scaleX(-1)' : 'scaleX(1)';
            } catch (err) {
                console.error("Error accessing camera: ", err);
                statusMsg.textContent = "Camera error: Please ensure permissions are granted.";
                statusMsg.style.display = 'block';
            }
        }

        function toggleCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        function adjustSize(direction) {
            const currentWidth = overlay.offsetWidth;
            const currentHeight = overlay.offsetHeight;
            const factor = direction === 'larger' ? 1.1 : 0.9;
            
            overlay.style.width = (currentWidth * factor) + 'px';
            overlay.style.height = (currentHeight * factor) + 'px';
        }

        // Initialize camera on load
        window.onload = () => {
            startCamera();
        };

        // Simple drag functionality for the tractor container
        let isDragging = false;
        let offset = { x: 0, y: 0 };

        overlay.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'IFRAME') return; // Allow iframe interaction
            isDragging = true;
            offset.x = e.clientX - overlay.offsetLeft;
            offset.y = e.clientY - overlay.offsetTop;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            overlay.style.left = (e.clientX - offset.x) + 'px';
            overlay.style.top = (e.clientY - offset.y) + 'px';
            overlay.style.transform = 'none'; // Remove centering transform once moved
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch support for dragging
        overlay.addEventListener('touchstart', (e) => {
            if (e.target.tagName === 'IFRAME') return;
            isDragging = true;
            const touch = e.touches[0];
            offset.x = touch.clientX - overlay.offsetLeft;
            offset.y = touch.clientY - overlay.offsetTop;
        });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const touch = e.touches[0];
            overlay.style.left = (touch.clientX - offset.x) + 'px';
            overlay.style.top = (touch.clientY - offset.y) + 'px';
            overlay.style.transform = 'none';
        });

        document.addEventListener('touchend', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
