<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist CSV Porter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fdfdfd; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #edf2f7;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12 text-slate-800 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-black tracking-tight text-red-600 mb-2 uppercase">Playlist CSV Porter</h1>
            <p class="text-slate-500 font-medium italic">Manual Source Parser</p>
        </header>

        <!-- Step 1: Generate Source Link -->
        <div class="glass-card rounded-3xl shadow-xl p-8 mb-8 border-2 border-slate-100">
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="bg-slate-200 text-slate-600 w-6 h-6 rounded-full flex items-center justify-center text-[10px]">1</span>
                Get Source Code
            </h2>
            <div class="flex flex-col gap-4">
                <input 
                    type="url" 
                    id="urlInput" 
                    oninput="updateSourceLink()"
                    placeholder="Paste YouTube Playlist URL here..." 
                    class="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 outline-none text-lg font-medium focus:border-red-500 transition-all"
                >
                <div id="sourceHelper" class="hidden animate-in fade-in slide-in-from-top-2">
                    <p class="text-sm text-slate-600 mb-2">Most browsers block "view-source" links for security. Please <b>Copy</b> and paste it into your address bar:</p>
                    <div class="flex items-center gap-2">
                        <div id="viewSourceDisplay" class="flex-1 bg-slate-100 px-4 py-3 rounded-xl font-mono text-sm text-blue-600 break-all border border-slate-200 select-all">
                            view-source:https://...
                        </div>
                        <button onclick="copySourceUrl()" class="bg-slate-900 text-white px-6 py-3 rounded-xl text-xs font-bold hover:bg-black transition-all">
                            COPY LINK
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: Paste and Parse -->
        <div class="glass-card rounded-3xl shadow-xl p-8 mb-10 border-2 border-slate-100">
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="bg-slate-200 text-slate-600 w-6 h-6 rounded-full flex items-center justify-center text-[10px]">2</span>
                Paste Content
            </h2>
            <textarea 
                id="manualSource" 
                rows="6" 
                class="w-full p-6 rounded-2xl border-2 border-slate-100 outline-none font-mono text-xs bg-slate-50 focus:border-red-500 transition-all mb-4" 
                placeholder="Ctrl+A and Ctrl+C the source code from the other tab, then paste it here..."
            ></textarea>
            <button 
                onclick="parseSource()" 
                class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-red-100 transition-all active:scale-[0.98] uppercase tracking-widest"
            >
                Extract Data
            </button>
        </div>

        <!-- Step 3: Results -->
        <div id="resultsArea" class="hidden">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-slate-100 pb-6 mb-6">
                <div>
                    <h2 id="playlistTitle" class="text-2xl font-bold text-slate-900 leading-tight mb-1 truncate max-w-md">Playlist Name</h2>
                    <p class="text-sm text-slate-500 font-bold uppercase tracking-widest">
                        <span id="videoCount">0</span> Videos Found
                    </p>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="toggleAll(true)" class="text-[10px] font-black text-slate-400 hover:text-slate-600 uppercase">Select All</button>
                    <button onclick="toggleAll(false)" class="text-[10px] font-black text-slate-400 hover:text-slate-600 uppercase">Deselect</button>
                    <button 
                        onclick="copyAsCSV()" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-black text-sm shadow-lg shadow-indigo-100 flex items-center gap-2 uppercase tracking-tight"
                    >
                        Copy as CSV
                    </button>
                </div>
            </div>

            <div id="resultsList" class="space-y-3 pb-20"></div>
        </div>
    </div>

    <!-- Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl hidden z-50">
        <span id="toastMsg">Copied!</span>
    </div>

    <script>
        let currentPlaylistName = "";
        let videoData = [];

        function updateSourceLink() {
            const url = document.getElementById('urlInput').value.trim();
            const helper = document.getElementById('sourceHelper');
            const display = document.getElementById('viewSourceDisplay');
            
            if (url && (url.includes('youtube.com') || url.includes('youtu.be'))) {
                const sourceUrl = `view-source:${url}`;
                display.innerText = sourceUrl;
                helper.classList.remove('hidden');
            } else {
                helper.classList.add('hidden');
            }
        }

        function copySourceUrl() {
            const link = document.getElementById('viewSourceDisplay').innerText;
            copyToClipboard(link);
            showToast("Source URL copied! Paste it into a new tab's address bar.");
        }

        function parseSource() {
            const html = document.getElementById('manualSource').value.trim();
            if (!html) return alert("Please paste the source code first.");

            // Extract Playlist Title
            const titleMatch = html.match(/<title>(.*?) - YouTube<\/title>/i) || 
                               html.match(/"title":"(.*?)"/);
            currentPlaylistName = (titleMatch ? titleMatch[1] : "Extracted Playlist").replace(/&amp;/g, '&');

            // Extract Video Titles and IDs
            const videoRegex = /"playlistVideoRenderer":\{"videoId":"([a-zA-Z0-9_-]{11})".*?"title":\{"runs":\[\{"text":"(.*?)"\}\]/g;
            
            const results = [];
            const seenIds = new Set();
            let match;

            while ((match = videoRegex.exec(html)) !== null) {
                const id = match[1];
                const title = match[2].replace(/\\u0026/g, '&').replace(/\\"/g, '"');
                
                if (!seenIds.has(id)) {
                    seenIds.add(id);
                    results.push({
                        title: title,
                        url: `https://www.youtube.com/watch?v=${id}`
                    });
                }
            }

            if (results.length === 0) {
                alert("No videos found. Ensure you are copying the source from a YouTube Playlist page.");
                return;
            }

            videoData = results;
            renderResults();
        }

        function renderResults() {
            const list = document.getElementById('resultsList');
            const area = document.getElementById('resultsArea');
            document.getElementById('playlistTitle').innerText = currentPlaylistName;
            document.getElementById('videoCount').innerText = videoData.length;

            list.innerHTML = videoData.map((v, i) => `
                <div class="glass-card rounded-2xl p-4 flex items-center gap-4 hover:border-red-200 transition-all group">
                    <input type="checkbox" checked data-index="${i}" class="video-check w-6 h-6 rounded-lg accent-red-600 cursor-pointer">
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-slate-800 truncate">${escapeHtml(v.title)}</h3>
                        <p class="text-[10px] text-slate-400 font-mono truncate">${v.url}</p>
                    </div>
                </div>
            `).join('');

            area.classList.remove('hidden');
            area.scrollIntoView({ behavior: 'smooth' });
        }

        function toggleAll(checked) {
            document.querySelectorAll('.video-check').forEach(cb => cb.checked = checked);
        }

        function copyAsCSV() {
            const selectedIndices = Array.from(document.querySelectorAll('.video-check:checked'))
                .map(cb => parseInt(cb.getAttribute('data-index')));

            if (selectedIndices.length === 0) return alert("Select at least one video.");

            const selectedVideos = selectedIndices.map(i => videoData[i]);
            
            // CSV Construction
            let csvContent = "Playlist Name,Video Title,URL\n";
            
            selectedVideos.forEach(v => {
                const pName = currentPlaylistName.replace(/"/g, '""');
                const vTitle = v.title.replace(/"/g, '""');
                csvContent += `"${pName}","${vTitle}","${v.url}"\n`;
            });

            copyToClipboard(csvContent);
            showToast("CSV data copied to clipboard!");
        }

        function copyToClipboard(text) {
            const el = document.createElement('textarea');
            el.value = text;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
