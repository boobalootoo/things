<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Playlist Export (Static)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center p-4 md:p-12">
    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 border border-gray-100">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Playlist Exporter</h1>
            <p class="mt-3 text-gray-500 font-medium">No API Key needed. Hostable on GitHub Pages.</p>
        </header>

        <div class="space-y-6">
            <!-- Input Area -->
            <div>
                <label for="url" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Playlist URL</label>
                <input 
                    type="text" 
                    id="url" 
                    placeholder="https://www.youtube.com/playlist?list=..." 
                    class="w-full px-5 py-4 rounded-2xl border-2 border-gray-100 focus:border-red-500 focus:ring-0 outline-none transition-all text-gray-800"
                />
            </div>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row gap-4">
                <button 
                    onclick="processPlaylist()" 
                    id="fetchBtn"
                    class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-8 rounded-2xl transition-all shadow-lg shadow-red-100 flex items-center justify-center gap-3"
                >
                    <span id="btnText">Extract Videos</span>
                    <div id="loader" class="hidden w-5 h-5 border-3 border-white border-t-transparent rounded-full animate-spin"></div>
                </button>
                
                <button 
                    onclick="downloadCSV()" 
                    id="downloadBtn"
                    disabled
                    class="flex-1 bg-gray-900 hover:bg-black disabled:bg-gray-200 disabled:shadow-none text-white font-bold py-4 px-8 rounded-2xl transition-all shadow-lg shadow-gray-200"
                >
                    Download CSV
                </button>
            </div>

            <!-- Progress/Error -->
            <div id="status" class="hidden p-4 rounded-xl text-sm font-medium text-center"></div>

            <!-- Preview -->
            <div id="preview" class="hidden">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-gray-800">Video List (<span id="count">0</span>)</h3>
                    <button onclick="reset()" class="text-xs font-bold text-red-500 hover:underline uppercase">Clear</button>
                </div>
                <div class="max-h-72 overflow-y-auto border border-gray-100 rounded-2xl bg-gray-50">
                    <table class="w-full text-left text-xs sm:text-sm">
                        <thead class="bg-white sticky top-0 border-b border-gray-100">
                            <tr>
                                <th class="p-4 font-bold text-gray-400 uppercase tracking-widest">Title</th>
                                <th class="p-4 font-bold text-gray-400 uppercase tracking-widest text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTable" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer class="mt-12 pt-8 border-t border-gray-50 text-center text-xs text-gray-400 leading-relaxed">
            Note: This tool uses a CORS proxy to read public playlist data.<br>
            Private playlists or those with restricted access cannot be fetched.
        </footer>
    </div>

    <script>
        let videoData = [];

        function setStatus(msg, type = 'info') {
            const el = document.getElementById('status');
            el.className = `p-4 rounded-xl text-sm font-medium text-center ${
                type === 'error' ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-blue-50 text-blue-600 border border-blue-100'
            }`;
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        function reset() {
            videoData = [];
            document.getElementById('url').value = '';
            document.getElementById('preview').classList.add('hidden');
            document.getElementById('status').classList.add('hidden');
            document.getElementById('downloadBtn').disabled = true;
        }

        async function processPlaylist() {
            const urlInput = document.getElementById('url').value.trim();
            if (!urlInput.includes('list=')) {
                setStatus('Please enter a valid YouTube Playlist URL.', 'error');
                return;
            }

            const btn = document.getElementById('fetchBtn');
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btnText');

            // UI State
            btn.disabled = true;
            loader.classList.remove('hidden');
            btnText.innerText = 'Extracting...';
            document.getElementById('status').classList.add('hidden');
            document.getElementById('preview').classList.add('hidden');

            try {
                // Use AllOrigins as a CORS proxy to bypass cross-origin restrictions
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(urlInput)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (!data.contents) throw new Error('Could not fetch page content.');

                // Extract the JSON data from the page source
                // YouTube embeds data in a global variable called ytInitialData
                const jsonMatch = data.contents.match(/var ytInitialData = ({.*?});/);
                if (!jsonMatch) throw new Error('Failed to find playlist data. Is the playlist public?');

                const rawJson = JSON.parse(jsonMatch[1]);
                
                // Navigate the nested YouTube object structure
                // This path is for standard playlist views
                const contents = rawJson.contents?.twoColumnBrowseResultsRenderer?.tabs?.[0]?.tabRenderer?.content?.sectionListRenderer?.contents?.[0]?.itemSectionRenderer?.contents?.[0]?.playlistVideoListRenderer?.contents;

                if (!contents) {
                    throw new Error('Playlist format not recognized or empty.');
                }

                videoData = contents
                    .filter(item => item.playlistVideoRenderer)
                    .map(item => {
                        const v = item.playlistVideoRenderer;
                        return {
                            title: v.title?.runs?.[0]?.text || 'Unknown Title',
                            link: `https://www.youtube.com/watch?v=${v.videoId}`
                        };
                    });

                if (videoData.length === 0) throw new Error('No videos found in this playlist.');

                renderTable();
                document.getElementById('downloadBtn').disabled = false;
                setStatus(`Successfully found ${videoData.length} videos.`, 'success');

            } catch (err) {
                console.error(err);
                setStatus(err.message || 'An unexpected error occurred.', 'error');
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
                btnText.innerText = 'Extract Videos';
            }
        }

        function renderTable() {
            const table = document.getElementById('resultsTable');
            const count = document.getElementById('count');
            table.innerHTML = '';
            
            videoData.forEach(v => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="p-4 text-gray-700 font-medium truncate max-w-[200px] sm:max-w-md">${v.title}</td>
                    <td class="p-4 text-right">
                        <a href="${v.link}" target="_blank" class="text-red-500 hover:text-red-700 font-bold">Watch</a>
                    </td>
                `;
                table.appendChild(row);
            });

            count.innerText = videoData.length;
            document.getElementById('preview').classList.remove('hidden');
        }

        function downloadCSV() {
            const headers = "Video Title,URL\n";
            const rows = videoData.map(v => {
                const escapedTitle = `"${v.title.replace(/"/g, '""')}"`;
                return `${escapedTitle},${v.link}`;
            }).join("\n");

            const csvContent = headers + rows;
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `playlist_export_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
