<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Vision Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons and Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@600&family=Indie+Flower&family=Pacifico&display=swap" rel="stylesheet">
    <!-- HTML to Canvas for saving images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Corkboard background effect */
        .board-bg {
            background-color: #e5e5f7;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* Draggable Item Styles */
        .vision-item {
            position: absolute;
            cursor: grab;
            user-select: none;
            touch-action: none;
            will-change: transform, left, top;
            transition: box-shadow 0.2s;
        }
        .vision-item:active {
            cursor: grabbing;
        }

        /* Polaroid / Photo Style */
        .style-photo {
            background: white;
            /* Padding is set dynamically via JS now to support custom borders */
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .style-photo:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* Sticker Style (Applied after BG removal) */
        .style-sticker {
            background: transparent !important;
            padding: 0 !important;
            box-shadow: none !important;
        }
        
        .style-sticker img {
            filter: 
                drop-shadow(0px 3px 0px white) 
                drop-shadow(0px -3px 0px white) 
                drop-shadow(3px 0px 0px white) 
                drop-shadow(-3px 0px 0px white) 
                drop-shadow(2px 2px 0px white)
                drop-shadow(-2px -2px 0px white)
                drop-shadow(2px -2px 0px white)
                drop-shadow(-2px 2px 0px white)
                drop-shadow(0px 8px 10px rgba(0,0,0,0.4));
        }

        .item-label {
            font-size: 1.5rem;
            line-height: 1.1;
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid #ffffff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Range Sliders */
        input[type=range] {
            accent-color: #4f46e5;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col md:flex-row bg-slate-50 text-slate-800">

    <!-- Global Show Sidebar Button (Visible when sidebar is collapsed) -->
    <button id="showSidebarBtn" onclick="toggleSidebar()" class="fixed left-0 top-1/2 -translate-y-1/2 bg-white w-10 h-14 rounded-r-xl shadow-lg flex items-center justify-center text-slate-400 hover:text-indigo-600 border border-slate-200 border-l-0 z-40 hidden transition-colors">
        <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Sidebar Controls -->
    <aside id="sidebar" class="w-full md:w-96 bg-white shadow-xl z-50 flex flex-col h-[50vh] md:h-full shrink-0 transition-transform duration-300 relative">
        <button onclick="toggleSidebar()" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 z-10 hidden md:flex" title="Collapse Sidebar">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button onclick="toggleSidebar()" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 z-10 md:hidden" title="Collapse Sidebar">
            <i class="fas fa-times"></i>
        </button>

        <div class="p-6 flex-1 flex flex-col overflow-y-auto pt-12 md:pt-6">
            <h1 class="text-3xl font-bold mb-2 text-indigo-600 flex items-center gap-2">
                <i class="fas fa-sparkles"></i> Vision Board
            </h1>
            <p class="text-sm text-slate-500 mb-6">Enter your favorite things (comma-separated or one per line) to instantly generate a collage.</p>

            <label class="block text-sm font-semibold mb-2" for="csvInput">Your Favorite Things</label>
            <textarea id="csvInput" class="w-full h-24 md:h-40 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none mb-4" placeholder="E.g.&#10;Golden Retriever&#10;Matcha Latte&#10;Vintage Porsche&#10;Cherry Blossoms">Golden Retriever, Matcha Latte, Vintage Porsche, Cherry Blossoms, Cozy Cabin</textarea>

            <button id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 mb-4 shadow-md">
                <i class="fas fa-magic"></i> Generate Board
            </button>

            <div class="relative flex items-center py-2 mb-4">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-bold uppercase tracking-wider">Magic Tools</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <button id="stickerifyBtn" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-md relative group mb-2">
                <i class="fas fa-cut"></i> Make them Stickers!
            </button>
            <p class="text-xs text-slate-400 text-center mb-6">Removes backgrounds using local AI.</p>
            
            <div id="statusMessage" class="mb-4 text-sm text-center font-medium text-indigo-600 hidden"></div>

            <!-- Export / Import Section -->
            <div class="mt-auto pt-4 border-t border-slate-200">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 block text-center">Save & Load</span>
                <div class="grid grid-cols-3 gap-2">
                    <button id="btnSaveImage" onclick="downloadImage()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-sm font-medium transition-colors flex flex-col items-center justify-center gap-1" title="Download Image">
                        <i class="fas fa-image text-lg"></i>
                        <span class="text-[10px]">PNG</span>
                    </button>
                    <button onclick="downloadProject()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-sm font-medium transition-colors flex flex-col items-center justify-center gap-1" title="Save Project File">
                        <i class="fas fa-save text-lg"></i>
                        <span class="text-[10px]">Project</span>
                    </button>
                    <label class="bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-sm font-medium transition-colors cursor-pointer flex flex-col items-center justify-center gap-1" title="Load Project File">
                        <i class="fas fa-upload text-lg"></i>
                        <span class="text-[10px]">Load</span>
                        <input type="file" class="hidden" accept=".json" onchange="loadProject(event)">
                    </label>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Canvas Area -->
    <main class="flex-1 relative board-bg overflow-hidden shadow-inner" id="boardArea">
        <!-- Floating items will be injected here -->
        <div class="absolute inset-0 flex items-center justify-center text-slate-400 opacity-50 pointer-events-none" id="emptyState">
            <div class="text-center">
                <i class="fas fa-images text-6xl mb-4"></i>
                <h2 class="text-2xl font-bold">Your board is empty</h2>
                <p>Click "Generate Board" to start the magic.</p>
            </div>
        </div>
        
        <!-- Floating Edit Toolbar -->
        <div id="editToolbar" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-3 z-[100] border border-slate-200 hidden items-center gap-4 transition-all" onpointerdown="event.stopPropagation()">
            
            <div class="flex flex-col items-center gap-1">
                <span class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Alt Image</span>
                <button id="btnAltImage" class="p-1.5 hover:bg-indigo-50 rounded text-indigo-600 transition-colors" title="Find different image"><i class="fas fa-sync-alt text-lg"></i></button>
            </div>
            
            <div class="w-px h-8 bg-slate-200"></div>
            
            <div class="flex flex-col items-center gap-1">
                <span class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Size</span>
                <input type="range" id="inpScale" min="0.5" max="3" step="0.1" class="w-16 md:w-20 cursor-pointer">
            </div>

            <div class="w-px h-8 bg-slate-200"></div>
            
            <div class="flex flex-col items-center gap-1">
                <span class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Rotate</span>
                <input type="range" id="inpRotate" min="-180" max="180" step="1" class="w-16 md:w-20 cursor-pointer">
            </div>

            <div class="w-px h-8 bg-slate-200"></div>
            
            <div class="flex flex-col items-center gap-1">
                <span class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Font</span>
                <select id="selFont" class="text-xs border border-slate-300 rounded p-1 max-w-[80px] md:max-w-none bg-transparent cursor-pointer outline-none focus:border-indigo-500">
                    <option value="'Caveat', cursive">Caveat</option>
                    <option value="'Pacifico', cursive">Pacifico</option>
                    <option value="'Indie Flower', cursive">Indie Flower</option>
                    <option value="'Amatic SC', cursive">Amatic SC</option>
                    <option value="Arial, sans-serif">Arial</option>
                </select>
            </div>

            <div class="w-px h-8 bg-slate-200"></div>
            
            <div class="flex flex-col items-center gap-1">
                <span class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Border</span>
                <div class="flex gap-2 items-center">
                    <input type="color" id="inpBorderColor" class="w-6 h-6 p-0 border-0 rounded cursor-pointer" title="Border Color">
                    <input type="range" id="inpBorderWidth" min="0" max="30" step="2" class="w-12 md:w-16 cursor-pointer" title="Border Thickness">
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        // Provide explicit paths for the AI models so they load properly over CDN
        const imglyConfig = {
            publicPath: "https://unpkg.com/@imgly/background-removal@1.4.3/dist/"
        };

        let zIndexCounter = 10;
        let selectedItemEl = null;
        const board = document.getElementById('boardArea');
        const emptyState = document.getElementById('emptyState');
        const statusMsg = document.getElementById('statusMessage');

        // Define global functions inside module
        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const showBtn = document.getElementById('showSidebarBtn');
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                showBtn.classList.add('hidden');
            } else {
                sidebar.classList.add('hidden');
                showBtn.classList.remove('hidden');
            }
        };

        function showStatus(text, isError = false) {
            statusMsg.textContent = text;
            statusMsg.className = `mb-4 text-sm text-center font-medium ${isError ? 'text-red-500' : 'text-indigo-600'} block`;
            setTimeout(() => { statusMsg.classList.add('hidden'); }, 4000);
        }

        // --- Selection & Toolbar Logic ---
        function selectItem(el) {
            if (selectedItemEl) {
                selectedItemEl.classList.remove('outline', 'outline-4', 'outline-indigo-500', 'z-50');
            }
            selectedItemEl = el;
            if (el) {
                el.classList.add('outline', 'outline-4', 'outline-indigo-500', 'z-50');
                showToolbar();
            } else {
                hideToolbar();
            }
        }

        board.addEventListener('pointerdown', (e) => {
            if (e.target === board || e.target === emptyState) {
                selectItem(null);
            }
        });

        function showToolbar() {
            const tb = document.getElementById('editToolbar');
            tb.classList.remove('hidden');
            tb.classList.add('flex');
            
            // Sync UI values to selected item
            document.getElementById('inpScale').value = selectedItemEl.dataset.scale || "1";
            document.getElementById('inpRotate').value = selectedItemEl.dataset.rotation || "0";
            document.getElementById('selFont').value = selectedItemEl.dataset.font || "'Caveat', cursive";
            document.getElementById('inpBorderColor').value = selectedItemEl.dataset.borderColor || "#ffffff";
            document.getElementById('inpBorderWidth').value = selectedItemEl.dataset.borderWidth || "12";
        }
        
        function hideToolbar() {
            const tb = document.getElementById('editToolbar');
            tb.classList.add('hidden');
            tb.classList.remove('flex');
        }

        // Toolbar Event Listeners
        document.getElementById('inpScale').addEventListener('input', (e) => {
            if(!selectedItemEl) return;
            selectedItemEl.dataset.scale = e.target.value;
            updateItemVisuals(selectedItemEl);
        });
        document.getElementById('inpRotate').addEventListener('input', (e) => {
            if(!selectedItemEl) return;
            selectedItemEl.dataset.rotation = e.target.value;
            updateItemVisuals(selectedItemEl);
        });
        document.getElementById('selFont').addEventListener('change', (e) => {
            if(!selectedItemEl) return;
            selectedItemEl.dataset.font = e.target.value;
            updateItemVisuals(selectedItemEl);
        });
        document.getElementById('inpBorderColor').addEventListener('input', (e) => {
            if(!selectedItemEl) return;
            selectedItemEl.dataset.borderColor = e.target.value;
            updateItemVisuals(selectedItemEl);
        });
        document.getElementById('inpBorderWidth').addEventListener('input', (e) => {
            if(!selectedItemEl) return;
            selectedItemEl.dataset.borderWidth = e.target.value;
            updateItemVisuals(selectedItemEl);
        });
        document.getElementById('btnAltImage').addEventListener('click', async () => {
            if(!selectedItemEl) return;
            const term = selectedItemEl.dataset.term;
            let offset = parseInt(selectedItemEl.dataset.altOffset || "0") + 1;
            selectedItemEl.dataset.altOffset = offset.toString();
            
            const img = selectedItemEl.querySelector('img');
            const oldSrc = img.src;
            img.style.opacity = '0.5';
            
            try {
                const newUrl = await fetchImageForTerm(term, offset);
                img.src = newUrl;
                img.onload = () => img.style.opacity = '1';
            } catch(err) {
                img.src = oldSrc;
                img.style.opacity = '1';
                showStatus("No alternative images found.", true);
            }
        });


        // --- Wikipedia Image Fetcher ---
        async function fetchImageForTerm(term, offset = 0) {
            const endpoint = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=filetype:bitmap ${encodeURIComponent(term)}&gsrnamespace=6&gsrlimit=1&gsroffset=${offset}&prop=imageinfo&iiprop=url&format=json&origin=*`;
            
            try {
                const response = await fetch(endpoint);
                const data = await response.json();
                
                if (data.query && data.query.pages) {
                    const pages = data.query.pages;
                    const pageId = Object.keys(pages)[0];
                    const imageUrl = pages[pageId].imageinfo[0].url;
                    return imageUrl;
                }
            } catch (error) {
                console.error("Error fetching image for", term, error);
            }
            return `https://placehold.co/400x400/eeeeee/999999.png?text=${encodeURIComponent(term)}&font=Montserrat`;
        }

        // --- Board Generation ---
        async function generateBoard() {
            const input = document.getElementById('csvInput').value;
            if (!input.trim()) {
                showStatus("Please enter some items first!", true);
                return;
            }

            const terms = input.split(/,|\n/).map(t => t.trim()).filter(t => t.length > 0);
            if (terms.length === 0) return;

            const btn = document.getElementById('generateBtn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Finding Images...';
            btn.disabled = true;

            // Clear board
            document.querySelectorAll('.vision-item').forEach(item => item.remove());
            emptyState.style.display = 'none';
            selectItem(null);

            for (let i = 0; i < terms.length; i++) {
                const term = terms[i];
                const imageUrl = await fetchImageForTerm(term);
                createBoardElement(term, imageUrl);
            }

            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }

        // --- Create Elements ---
        function createBoardElement(term, imageUrl, existingData = null) {
            const container = document.createElement('div');
            
            // Initial Properties
            container.dataset.term = term;
            container.dataset.rotation = existingData ? existingData.rotation : ((Math.random() * 30) - 15);
            container.dataset.scale = existingData ? existingData.scale : "1";
            container.dataset.font = existingData ? existingData.font : "'Caveat', cursive";
            container.dataset.borderColor = existingData ? existingData.borderColor : '#ffffff';
            container.dataset.borderWidth = existingData ? existingData.borderWidth : '12';
            container.dataset.isSticker = existingData ? existingData.isSticker : "false";
            container.dataset.altOffset = existingData ? existingData.altOffset : "0";
            
            container.className = `vision-item style-photo group`;
            
            // Positioning
            if (existingData) {
                container.style.left = existingData.left;
                container.style.top = existingData.top;
                container.style.zIndex = existingData.zIndex || ++zIndexCounter;
            } else {
                const boardRect = board.getBoundingClientRect();
                const maxLeft = Math.max(0, boardRect.width - 250);
                const maxTop = Math.max(0, boardRect.height - 250);
                
                const left = (boardRect.width * 0.1) + (Math.random() * maxLeft * 0.8);
                const top = (boardRect.height * 0.1) + (Math.random() * maxTop * 0.8);
                
                container.style.left = `${left}px`;
                container.style.top = `${top}px`;
                container.style.zIndex = ++zIndexCounter;
            }

            // Delete button
            const delBtn = document.createElement('button');
            delBtn.className = 'absolute -top-3 -right-3 bg-red-500 hover:bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center hidden group-hover:flex shadow-lg z-20 transition-colors';
            delBtn.innerHTML = '<i class="fas fa-times"></i>';
            delBtn.onclick = (e) => {
                e.stopPropagation(); 
                if (selectedItemEl === container) selectItem(null);
                container.remove();
                if(document.querySelectorAll('.vision-item').length === 0) emptyState.style.display = 'flex';
            };

            // Image container
            const imgContainer = document.createElement('div');
            imgContainer.className = 'relative w-48 h-48 sm:w-56 sm:h-56 flex items-center justify-center overflow-hidden rounded';
            
            const img = document.createElement('img');
            img.crossOrigin = "anonymous";
            img.src = imageUrl;
            img.className = 'max-w-full max-h-full rounded pointer-events-none w-full h-full object-cover'; 
            
            const loader = document.createElement('div');
            loader.className = 'loader-overlay absolute inset-0 bg-slate-900/60 hidden items-center justify-center rounded z-10';
            loader.innerHTML = '<div class="spinner"></div>';

            const label = document.createElement('div');
            label.className = 'absolute bottom-2 left-0 w-full text-center item-label text-slate-800 pointer-events-none capitalize px-2';
            label.innerText = term;

            imgContainer.appendChild(img);
            imgContainer.appendChild(loader);
            container.appendChild(delBtn);
            container.appendChild(imgContainer);
            container.appendChild(label);
            board.appendChild(container);

            updateItemVisuals(container);
            makeDraggable(container);
        }

        // Standardizes applying inline properties to element visuals
        function updateItemVisuals(el) {
            el.style.transform = `rotate(${el.dataset.rotation}deg) scale(${el.dataset.scale})`;
            
            const label = el.querySelector('.item-label');
            if(label) label.style.fontFamily = el.dataset.font;
            
            const img = el.querySelector('img');

            if (el.dataset.isSticker !== "true") {
                el.classList.remove('style-sticker');
                el.classList.add('style-photo');
                if(label) label.style.display = 'block';
                img.classList.remove('object-contain');
                img.classList.add('object-cover');

                el.style.backgroundColor = el.dataset.borderColor;
                const bw = el.dataset.borderWidth;
                el.style.padding = `${bw}px ${bw}px ${parseFloat(bw) + 28}px ${bw}px`;
            } else {
                el.classList.remove('style-photo');
                el.classList.add('style-sticker');
                if(label) label.style.display = 'none';
                img.classList.remove('object-cover');
                img.classList.add('object-contain');
                
                el.style.backgroundColor = 'transparent';
                el.style.padding = '0';
            }
        }

        // --- Drag & Drop Logic ---
        function makeDraggable(el) {
            let isDragging = false;
            let startCursorX, startCursorY, startLeft, startTop;

            el.addEventListener('pointerdown', (e) => {
                if(e.target.closest('button')) return; 
                e.stopPropagation(); // Prevent board click
                
                isDragging = true;
                el.style.zIndex = ++zIndexCounter;
                selectItem(el);
                
                startCursorX = e.clientX;
                startCursorY = e.clientY;
                startLeft = parseFloat(el.style.left) || 0;
                startTop = parseFloat(el.style.top) || 0;
                el.setPointerCapture(e.pointerId);
            });

            el.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startCursorX;
                const dy = e.clientY - startCursorY;
                el.style.left = `${startLeft + dx}px`;
                el.style.top = `${startTop + dy}px`;
            });

            const stopDrag = (e) => {
                if (!isDragging) return;
                isDragging = false;
                el.releasePointerCapture(e.pointerId);
            };

            el.addEventListener('pointerup', stopDrag);
            el.addEventListener('pointercancel', stopDrag);
        }

        // --- Save & Load Functionality ---
        window.downloadProject = function() {
            selectItem(null); // Deselect to hide outlines
            const items = Array.from(document.querySelectorAll('.vision-item')).map(el => {
                return {
                    term: el.dataset.term,
                    imageUrl: el.querySelector('img').src,
                    left: el.style.left,
                    top: el.style.top,
                    rotation: el.dataset.rotation,
                    scale: el.dataset.scale,
                    font: el.dataset.font,
                    borderColor: el.dataset.borderColor,
                    borderWidth: el.dataset.borderWidth,
                    isSticker: el.dataset.isSticker,
                    altOffset: el.dataset.altOffset,
                    zIndex: el.style.zIndex
                };
            });
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ version: 1, items }));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", "my_vision_board.json");
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        };

        window.loadProject = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data && data.items) {
                        document.querySelectorAll('.vision-item').forEach(el => el.remove());
                        emptyState.style.display = 'none';
                        selectItem(null);
                        
                        const terms = [];
                        data.items.forEach(itemData => {
                            terms.push(itemData.term);
                            createBoardElement(itemData.term, itemData.imageUrl, itemData);
                        });
                        
                        document.getElementById('csvInput').value = terms.join(', ');
                        showStatus("Project loaded successfully!");
                    }
                } catch (err) {
                    showStatus("Error loading project file.", true);
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset input
        };

        window.downloadImage = async function() {
            selectItem(null); // Remove blue outline
            const btn = document.getElementById('btnSaveImage');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-lg"></i>';
            
            try {
                const canvas = await html2canvas(board, { useCORS: true, backgroundColor: '#e5e5f7' });
                const dataUrl = canvas.toDataURL("image/png");
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = "my_vision_board.png";
                a.click();
                showStatus("Image saved!");
            } catch (e) {
                console.error("Canvas export failed:", e);
                showStatus("Export failed. Some image sources may block downloading.", true);
            }
            btn.innerHTML = originalHtml;
        };


        // --- AI Background Removal (Stickerify) ---
        async function stickerifyAll() {
            const items = document.querySelectorAll('.vision-item');
            if (items.length === 0) {
                showStatus("Generate a board first to make stickers!", true);
                return;
            }

            selectItem(null);
            const btn = document.getElementById('stickerifyBtn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-cog fa-spin"></i> Loading AI...';
            btn.disabled = true;

            let imglyRemoveBackground;
            try {
                const module = await import("https://esm.sh/@imgly/background-removal@1.4.3?bundle");
                imglyRemoveBackground = module.default || module.removeBackground;
                if (!imglyRemoveBackground) throw new Error("Could not find the exported function");
            } catch (err) {
                showStatus("Error loading AI background removal.", true);
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                return;
            }

            btn.innerHTML = '<i class="fas fa-cog fa-spin"></i> Processing AI...';
            let successCount = 0;

            for (let item of items) {
                if (item.dataset.isSticker === "true") continue;

                const img = item.querySelector('img');
                const loader = item.querySelector('.loader-overlay');
                loader.classList.remove('hidden');
                loader.classList.add('flex');

                try {
                    const imageBlob = await imglyRemoveBackground(img.src, imglyConfig);
                    const transparentUrl = URL.createObjectURL(imageBlob);
                    
                    img.src = transparentUrl;
                    item.dataset.isSticker = "true";
                    updateItemVisuals(item);
                    successCount++;
                } catch (error) {
                    console.error("Failed to remove background", error);
                } finally {
                    loader.classList.add('hidden');
                    loader.classList.remove('flex');
                }
            }

            btn.innerHTML = originalHtml;
            btn.disabled = false;
            if(successCount > 0) showStatus(`Converted ${successCount} items into stickers!`);
        }

        // Event bindings
        document.getElementById('generateBtn').addEventListener('click', generateBoard);
        document.getElementById('stickerifyBtn').addEventListener('click', stickerifyAll);
    </script>
</body>
</html>
