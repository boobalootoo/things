<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger Tool</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF-Lib for manipulating PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- SortableJS for drag-and-drop reordering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- Download helper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/downloadjs/1.4.8/download.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .file-item {
            transition: all 0.2s ease;
        }
        .file-item.sortable-ghost {
            opacity: 0.5;
            background: #e5e7eb;
            border: 2px dashed #9ca3af;
        }
        
        /* Custom Scrollbar for list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db; 
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-indigo-600 p-8 text-white text-center">
            <h1 class="text-3xl font-bold mb-2"><i class="fas fa-layer-group mr-3"></i>PDF Merger</h1>
            <p class="text-indigo-100">Combine multiple PDF files into one document. Drag to reorder.</p>
        </div>

        <div class="p-8 space-y-6">
            
            <!-- Upload Area -->
            <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-10 text-center hover:bg-indigo-50 hover:border-indigo-400 transition-all cursor-pointer relative group">
                <input type="file" id="file-input" accept=".pdf" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <div class="pointer-events-none group-hover:scale-105 transition-transform duration-200">
                    <div class="w-16 h-16 bg-indigo-100 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-cloud-upload-alt text-3xl"></i>
                    </div>
                    <p class="text-gray-700 font-semibold text-lg">Click or Drag & Drop PDFs here</p>
                    <p class="text-sm text-gray-400 mt-2">Supports multiple files</p>
                </div>
            </div>

            <!-- File List Area -->
            <div id="file-list-container" class="hidden animate-fade-in-up">
                <div class="flex justify-between items-end mb-3 border-b border-gray-100 pb-2">
                    <h3 class="text-gray-700 font-bold text-sm uppercase tracking-wide">Files to Merge <span id="file-count" class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full text-xs ml-2">0</span></h3>
                    <button id="clear-all" class="text-xs text-red-500 hover:text-red-700 font-semibold hover:underline">Clear All</button>
                </div>
                
                <ul id="sortable-list" class="space-y-3 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar p-1">
                    <!-- Dynamic Items go here -->
                </ul>
                <p class="text-xs text-gray-400 mt-3 text-center flex items-center justify-center gap-1">
                    <i class="fas fa-arrows-alt-v"></i> Drag items to change order
                </p>
            </div>

            <!-- Action Area -->
            <div class="pt-2 flex justify-end">
                <button id="merge-btn" class="w-full sm:w-auto bg-gray-300 text-gray-500 font-bold py-3.5 px-8 rounded-xl cursor-not-allowed flex items-center justify-center shadow-sm transition-all" disabled>
                    <i class="fas fa-file-export mr-2"></i> Merge Files
                </button>
            </div>

            <!-- Progress Overlay -->
            <div id="progress-overlay" class="hidden absolute inset-0 bg-white/90 z-20 flex flex-col items-center justify-center rounded-2xl">
                <div class="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
                <h3 class="text-xl font-bold text-gray-800">Merging PDFs...</h3>
                <p id="progress-text" class="text-gray-500 mt-2">Processing files</p>
            </div>
        </div>
    </div>

    <script>
        const { PDFDocument } = PDFLib;

        // State
        let filesData = []; // Array of { id, name, fileObj, arrayBuffer }

        // DOM Elements
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const fileListContainer = document.getElementById('file-list-container');
        const sortableList = document.getElementById('sortable-list');
        const mergeBtn = document.getElementById('merge-btn');
        const fileCount = document.getElementById('file-count');
        const clearAllBtn = document.getElementById('clear-all');
        const progressOverlay = document.getElementById('progress-overlay');
        const progressText = document.getElementById('progress-text');

        // Initialize Sortable
        new Sortable(sortableList, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function (evt) {
                // Reorder array based on new DOM order
                const itemEl = evt.item;
                const newIndex = evt.newIndex;
                const oldIndex = evt.oldIndex;
                
                const movedItem = filesData.splice(oldIndex, 1)[0];
                filesData.splice(newIndex, 0, movedItem);
            }
        });

        // Event Listeners
        fileInput.addEventListener('change', handleFileSelect);
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-indigo-50', 'border-indigo-400');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-indigo-50', 'border-indigo-400');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-indigo-50', 'border-indigo-400');
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        clearAllBtn.addEventListener('click', () => {
            filesData = [];
            renderList();
            updateUI();
        });

        mergeBtn.addEventListener('click', mergePDFs);

        function handleFileSelect(e) {
            handleFiles(e.target.files);
            fileInput.value = ''; 
        }

        async function handleFiles(files) {
            const newFiles = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
            
            if (newFiles.length === 0) {
                alert("Please select PDF files.");
                return;
            }

            // Read files
            for (const file of newFiles) {
                try {
                    const arrayBuffer = await readFileAsArrayBuffer(file);
                    
                    filesData.push({
                        id: Date.now() + Math.random().toString(36).substr(2, 9),
                        name: file.name,
                        fileObj: file,
                        arrayBuffer: arrayBuffer
                    });
                } catch (error) {
                    console.error("Error reading file:", file.name, error);
                    alert(`Could not read ${file.name}.`);
                }
            }
            
            renderList();
            updateUI();
        }

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        function renderList() {
            sortableList.innerHTML = '';
            filesData.forEach((file) => {
                const li = document.createElement('li');
                li.className = 'file-item bg-white border border-gray-200 rounded-lg p-3 flex items-center justify-between shadow-sm cursor-move hover:shadow-md select-none';
                li.innerHTML = `
                    <div class="flex items-center overflow-hidden w-full">
                        <div class="bg-red-100 text-red-500 h-10 w-10 min-w-[2.5rem] rounded-lg flex items-center justify-center mr-3">
                            <i class="fas fa-file-pdf"></i>
                        </div>
                        <div class="truncate flex-1">
                            <p class="text-sm font-medium text-gray-700 truncate" title="${file.name}">${file.name}</p>
                            <p class="text-xs text-gray-400">${formatBytes(file.fileObj.size)}</p>
                        </div>
                    </div>
                    <button class="ml-2 text-gray-300 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-red-50" onclick="removeFile('${file.id}')">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `;
                sortableList.appendChild(li);
            });
        }

        window.removeFile = function(id) {
            filesData = filesData.filter(f => f.id !== id);
            renderList();
            updateUI();
        };

        function updateUI() {
            fileCount.textContent = filesData.length;
            if (filesData.length > 0) {
                fileListContainer.classList.remove('hidden');
                mergeBtn.disabled = false;
                mergeBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                mergeBtn.classList.add('bg-indigo-600', 'text-white', 'hover:bg-indigo-700', 'hover:shadow-lg', 'cursor-pointer', 'transform', 'hover:-translate-y-0.5');
            } else {
                fileListContainer.classList.add('hidden');
                mergeBtn.disabled = true;
                mergeBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                mergeBtn.classList.remove('bg-indigo-600', 'text-white', 'hover:bg-indigo-700', 'hover:shadow-lg', 'cursor-pointer', 'transform', 'hover:-translate-y-0.5');
            }
        }

        async function mergePDFs() {
            if (filesData.length === 0) return;

            // Show loading
            progressOverlay.classList.remove('hidden');
            progressText.textContent = "Initializing PDF engine...";

            try {
                // Create a new PDFDocument
                const mergedPdf = await PDFDocument.create(); 
                
                for (let i = 0; i < filesData.length; i++) {
                    const fileData = filesData[i];
                    progressText.textContent = `Processing file ${i + 1} of ${filesData.length}: ${fileData.name}`;
                    
                    // Load the PDF from buffer
                    const pdf = await PDFDocument.load(fileData.arrayBuffer);
                    
                    // Copy all pages
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    
                    // Add pages to the merged PDF
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }

                progressText.textContent = "Finalizing document...";
                
                // Serialize the PDFDocument to bytes (a Uint8Array)
                const pdfBytes = await mergedPdf.save();

                // Trigger the browser to download the PDF document
                download(pdfBytes, "merged-document.pdf", "application/pdf");

            } catch (err) {
                console.error(err);
                alert("An error occurred during merging. Some encrypted or corrupted PDFs may not be supported.");
            } finally {
                setTimeout(() => {
                    progressOverlay.classList.add('hidden');
                }, 1000);
            }
        }

        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }
    </script>
</body>
</html>
