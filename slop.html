
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gummy Bear Soccer Slasher</title>
    <!-- Using the rock-solid r128 version -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: #87CEEB; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            touch-action: none; 
        }
        
        #game-container { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        /* Settings Button */
        #settings-btn {
            position: absolute; top: 20px; right: 20px; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.9); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 28px;
            cursor: pointer; pointer-events: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        #settings-btn:active { transform: scale(0.9); }

        /* Floating Joystick */
        #joystick-base {
            position: absolute; width: 100px; height: 100px;
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: auto;
            backdrop-filter: blur(3px); z-index: 1000;
        }
        
        #message-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none;
            flex-direction: column; justify-content: center; align-items: center; pointer-events: none;
            background: rgba(0,0,0,0.4); z-index: 500; font-size: 50px; font-weight: 900;
            color: white; text-shadow: 3px 3px 6px rgba(0,0,0,0.8); text-align: center;
        }

        .card {
            background: white; padding: 30px 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 90%; width: 400px;
            max-height: 85vh; overflow-y: auto;
        }
        
        h1 { margin: 0 0 10px 0; color: #333; font-size: 32px; }
        p { margin: 0 0 20px 0; color: #666; font-size: 16px; line-height: 1.4; }
        .highlight-red { color: #d32f2f; font-weight: bold; }
        .highlight-blue { color: #1976d2; font-weight: bold; }
        
        button {
            background: #FF9800; color: white; border: none; padding: 15px 50px; font-size: 20px;
            font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(255, 152, 0, 0.4); margin-top: 15px; width: 100%;
        }
        button:active { transform: scale(0.95); }
        button.close-btn { background: #4CAF50; box-shadow: 0 4px 6px rgba(76, 175, 80, 0.4); }

        #score-display {
            position: absolute; top: 25px; width: 100%; text-align: center; font-size: 44px;
            font-weight: 900; color: white; text-shadow: 2px 2px 5px rgba(0,0,0,0.6);
        }

        /* Settings Sliders */
        .setting-group { margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .setting-group h3 { margin: 0 0 10px 0; font-size: 18px; color: #FF9800; text-align: left; }
        .setting-row { margin-bottom: 15px; text-align: left; }
        .setting-row label { display: flex; justify-content: space-between; font-weight: bold; color: #444; margin-bottom: 8px; font-size: 14px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #FF9800; }
        
        /* Custom scrollbar for settings */
        .card::-webkit-scrollbar { width: 8px; }
        .card::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div id="game-container"></div>

<div id="ui-layer">
    <div id="score-display">0</div>
    <div id="settings-btn" onclick="openSettings()">⚙️</div>
    <div id="joystick-base"><div id="joystick-knob"></div></div>
</div>

<div id="message-overlay">GOAL!</div>

<!-- Start Screen -->
<div id="start-screen" class="overlay">
    <div class="card">
        <h1>Gummy Slasher</h1>
        <p>Score in the <span class="highlight-red">Red Net</span>.<br>Defend your <span class="highlight-blue">Blue Net</span>!</p>
        <button onclick="startGame()">PLAY</button>
    </div>
</div>

<!-- Settings Screen -->
<div id="settings-screen" class="overlay" style="display: none;">
    <div class="card">
        <h1>Settings</h1>
        
        <div class="setting-group">
            <h3>Player (You)</h3>
            <div class="setting-row"><label>Speed: <span id="val-p-speed">11</span></label><input type="range" id="in-p-speed" min="5" max="25" step="1" value="11" oninput="updateVal('p-speed')"></div>
            <div class="setting-row"><label>Size: <span id="val-p-size">1.0</span></label><input type="range" id="in-p-size" min="0.5" max="3.0" step="0.1" value="1.0" oninput="updateVal('p-size')"></div>
            <div class="setting-row"><label><span class="highlight-blue">Goal Width:</span> <span id="val-p-goal">8</span></label><input type="range" id="in-p-goal" min="4" max="20" value="8" oninput="updateVal('p-goal')"></div>
        </div>

        <div class="setting-group">
            <h3>NPCs (Enemies)</h3>
            <div class="setting-row"><label>Count: <span id="val-npc-count">5</span></label><input type="range" id="in-npc-count" min="1" max="15" value="5" oninput="updateVal('npc-count')"></div>
            <div class="setting-row"><label>Speed: <span id="val-npc-speed">4.5</span></label><input type="range" id="in-npc-speed" min="2.0" max="15.0" step="0.5" value="4.5" oninput="updateVal('npc-speed')"></div>
            <div class="setting-row"><label>Size: <span id="val-npc-size">1.0</span></label><input type="range" id="in-npc-size" min="0.5" max="3.0" step="0.1" value="1.0" oninput="updateVal('npc-size')"></div>
            <div class="setting-row"><label><span class="highlight-red">Goal Width:</span> <span id="val-e-goal">8</span></label><input type="range" id="in-e-goal" min="4" max="20" value="8" oninput="updateVal('e-goal')"></div>
        </div>

        <div class="setting-group">
            <h3>The Ball</h3>
            <div class="setting-row"><label>Size: <span id="val-b-size">0.6</span></label><input type="range" id="in-b-size" min="0.3" max="2.0" step="0.1" value="0.6" oninput="updateVal('b-size')"></div>
            <div class="setting-row"><label>Bounciness: <span id="val-b-bounce">0.6</span></label><input type="range" id="in-b-bounce" min="0.1" max="1.2" step="0.1" value="0.6" oninput="updateVal('b-bounce')"></div>
            <div class="setting-row"><label>Kick Sensitivity: <span id="val-b-sens">1.0</span></label><input type="range" id="in-b-sens" min="0.2" max="3.0" step="0.1" value="1.0" oninput="updateVal('b-sens')"></div>
        </div>

        <button class="close-btn" onclick="closeSettings()">APPLY & RESUME</button>
    </div>
</div>

<script>
    // --- Audio Synthesizer (No external files needed) ---
    const AudioEngine = {
        ctx: null,
        init: function() {
            if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if(this.ctx.state === 'suspended') this.ctx.resume();
        },
        playKick: function() {
            if(!this.ctx) return;
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start(); osc.stop(this.ctx.currentTime + 0.1);
        },
        playBounce: function(intensity) {
            if(!this.ctx) return;
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(300, this.ctx.currentTime);
            gain.gain.setValueAtTime(Math.min(intensity * 0.5, 0.8), this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
            osc.start(); osc.stop(this.ctx.currentTime + 0.05);
        },
        playSlash: function() {
            if(!this.ctx) return;
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
            osc.start(); osc.stop(this.ctx.currentTime + 0.15);
        },
        playGoal: function() {
            if(!this.ctx) return;
            const notes = [261.63, 329.63, 392.00, 523.25]; // Triumphant chord
            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'square'; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.1);
                gain.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime + i * 0.1 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 0.3);
                osc.start(this.ctx.currentTime + i * 0.1); osc.stop(this.ctx.currentTime + i * 0.1 + 0.3);
            });
        }
    };

    // --- Global Variables ---
    let scene, camera, renderer, clock;
    let player, ball, npcGoal, playerGoal;
    let enemies = [], particles = [], splatters = [];
    
    let isRunning = false;
    let score = 0;
    
    // Controls State
    let moveDir = { x: 0, y: 0 };
    let isDragging = false;
    let joystickOrigin = { x: 0, y: 0 };
    
    // Game Settings Configuration
    let settings = {
        playerSpeed: 11.0, playerSize: 1.0, playerGoalWidth: 8,
        npcCount: 5, npcSpeed: 4.5, npcSize: 1.0, npcGoalWidth: 8,
        ballSize: 0.6, ballBounce: 0.6, ballSens: 1.0
    };

    const config = { fieldW: 30, fieldL: 50, ballFriction: 0.97, baseKickForce: 16.0 };

    // --- Initialization (Bulletproofed) ---
    function boot() {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEngine);
        } else {
            initEngine();
        }
    }
    window.onload = boot;

    function startGame() {
        AudioEngine.init(); 
        document.getElementById('start-screen').style.display = 'none';
        isRunning = true;
        if(!clock) clock = new THREE.Clock();
        clock.start();
        animate();
    }

    function initEngine() {
        const container = document.getElementById('game-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        
        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 15, 20);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 30, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -30; dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30; dirLight.shadow.camera.bottom = -30;
        dirLight.shadow.mapSize.width = 1024; dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        buildField();
        buildGoals();
        spawnPlayer();
        spawnBall();
        spawnEnemies(settings.npcCount);

        window.addEventListener('resize', onResize);
        setupControls();
        renderer.render(scene, camera);
    }

    // --- Settings UI ---
    function updateVal(id) { document.getElementById('val-' + id).innerText = document.getElementById('in-' + id).value; }

    function openSettings() {
        if (!isRunning) return; 
        isRunning = false; 
        isDragging = false; moveDir = {x: 0, y: 0};
        document.getElementById('joystick-base').style.display = 'none';
        document.getElementById('settings-screen').style.display = 'flex';
        
        document.getElementById('in-p-speed').value = settings.playerSpeed;
        document.getElementById('in-p-size').value = settings.playerSize;
        document.getElementById('in-p-goal').value = settings.playerGoalWidth;
        document.getElementById('in-npc-count').value = settings.npcCount;
        document.getElementById('in-npc-speed').value = settings.npcSpeed;
        document.getElementById('in-npc-size').value = settings.npcSize;
        document.getElementById('in-e-goal').value = settings.npcGoalWidth;
        document.getElementById('in-b-size').value = settings.ballSize;
        document.getElementById('in-b-bounce').value = settings.ballBounce;
        document.getElementById('in-b-sens').value = settings.ballSens;
        
        ['p-speed', 'p-size', 'p-goal', 'npc-count', 'npc-speed', 'npc-size', 'e-goal', 'b-size', 'b-bounce', 'b-sens'].forEach(updateVal);
    }

    function closeSettings() {
        document.getElementById('settings-screen').style.display = 'none';
        
        settings.playerSpeed = parseFloat(document.getElementById('in-p-speed').value);
        settings.playerSize = parseFloat(document.getElementById('in-p-size').value);
        settings.playerGoalWidth = parseFloat(document.getElementById('in-p-goal').value);
        const newNpcCount = parseInt(document.getElementById('in-npc-count').value);
        settings.npcSpeed = parseFloat(document.getElementById('in-npc-speed').value);
        settings.npcSize = parseFloat(document.getElementById('in-npc-size').value);
        settings.npcGoalWidth = parseFloat(document.getElementById('in-e-goal').value);
        settings.ballSize = parseFloat(document.getElementById('in-b-size').value);
        settings.ballBounce = parseFloat(document.getElementById('in-b-bounce').value);
        settings.ballSens = parseFloat(document.getElementById('in-b-sens').value);

        player.scale.setScalar(settings.playerSize);
        ball.scale.setScalar(settings.ballSize / 0.6); 
        ball.position.y = Math.max(ball.position.y, settings.ballSize); 

        if (settings.npcCount !== newNpcCount) {
            settings.npcCount = newNpcCount;
            enemies.forEach(e => scene.remove(e)); enemies = [];
            spawnEnemies(settings.npcCount);
        } else {
            enemies.forEach(e => { 
                e.userData.speed = settings.npcSpeed + (Math.random() * 1.5); 
                e.scale.setScalar(settings.npcSize);
            });
        }
        buildGoals();
        clock.start(); isRunning = true;
    }

    // --- World Building ---
    function buildField() {
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(config.fieldW * 2, config.fieldL * 2), new THREE.MeshLambertMaterial({ color: 0x64DD17 }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const midLine = new THREE.Mesh(new THREE.PlaneGeometry(config.fieldW, 0.3), lineMat);
        midLine.rotation.x = -Math.PI / 2; midLine.position.y = 0.02; scene.add(midLine);

        const circle = new THREE.Mesh(new THREE.RingGeometry(4.7, 5, 32), lineMat);
        circle.rotation.x = -Math.PI / 2; circle.position.y = 0.02; scene.add(circle);
    }

    function buildGoals() {
        if (npcGoal) scene.remove(npcGoal);
        if (playerGoal) scene.remove(playerGoal);

        npcGoal = createGoal(0xFF0000, settings.npcGoalWidth); 
        npcGoal.position.set(0, 0, -24); scene.add(npcGoal);

        playerGoal = createGoal(0x0000FF, settings.playerGoalWidth);
        playerGoal.position.set(0, 0, 24); playerGoal.rotation.y = Math.PI; scene.add(playerGoal);
    }

    function createGoal(netColorHex, width) {
        const group = new THREE.Group();
        const postMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 5), postMat);
        leftPost.position.set(-width/2, 2.5, 0); leftPost.castShadow = true;
        const rightPost = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 5), postMat);
        rightPost.position.set(width/2, 2.5, 0); rightPost.castShadow = true;
        const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, width + 0.4), postMat);
        crossbar.rotation.z = Math.PI / 2; crossbar.position.set(0, 5, 0); crossbar.castShadow = true;

        const net = new THREE.Mesh(new THREE.BoxGeometry(width, 5, 3), new THREE.MeshBasicMaterial({ color: netColorHex, transparent: true, opacity: 0.3, wireframe: true }));
        net.position.set(0, 2.5, -1.5);
        group.add(leftPost, rightPost, crossbar, net); return group;
    }

    // GUMMY BEAR MODEL (COMPATIBLE WITH ALL VERSIONS)
    function createGummyBear(colorHex) {
        const group = new THREE.Group();
        const gummyMat = new THREE.MeshPhongMaterial({ 
            color: colorHex, shininess: 150, specular: 0xffffff, transparent: true, opacity: 0.85 
        });
        
        // Body (Squishy pill shape created by scaling a sphere up on the Y axis)
        const bodyGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const body = new THREE.Mesh(bodyGeo, gummyMat);
        body.scale.y = 1.6;
        body.position.y = 0.65; body.castShadow = true;
        
        // Head
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), gummyMat);
        head.position.y = 1.35; head.castShadow = true;

        // Ears
        const earGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const ear1 = new THREE.Mesh(earGeo, gummyMat); ear1.position.set(-0.25, 1.65, 0);
        const ear2 = new THREE.Mesh(earGeo, gummyMat); ear2.position.set(0.25, 1.65, 0);

        // Arms (Scaled spheres)
        const armGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const armL = new THREE.Mesh(armGeo, gummyMat);
        armL.scale.y = 2.5; armL.position.set(-0.45, 0.8, 0); armL.rotation.z = Math.PI / 4;
        const armR = new THREE.Mesh(armGeo, gummyMat);
        armR.scale.y = 2.5; armR.position.set(0.45, 0.8, 0); armR.rotation.z = -Math.PI / 4;

        // Eyes
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.06), eyeMat); eye1.position.set(-0.15, 1.45, 0.35);
        const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.06), eyeMat); eye2.position.set(0.15, 1.45, 0.35);

        group.add(body, head, ear1, ear2, armL, armR, eye1, eye2);
        
        const wrapper = new THREE.Group();
        wrapper.add(group);
        wrapper.gummyBody = group; 
        return wrapper;
    }

    function spawnPlayer() {
        player = createGummyBear(0x00FF00); // Green Gummy
        player.position.set(0, 0, 10);
        player.scale.setScalar(settings.playerSize);
        
        const swordGroup = new THREE.Group();
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.2), new THREE.MeshPhongMaterial({ color: 0xeeeeee, shininess: 100 }));
        blade.position.y = 0.9;
        const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.3), new THREE.MeshLambertMaterial({ color: 0x333333 }));
        
        swordGroup.add(blade, hilt);
        swordGroup.position.set(0.6, 0.8, 0.3);
        swordGroup.rotation.x = Math.PI / 3;
        player.sword = swordGroup;
        player.gummyBody.add(swordGroup); 
        
        player.attackTimer = 0; player.isAttacking = false;
        scene.add(player);
    }

    function spawnBall() {
        const geo = new THREE.IcosahedronGeometry(0.6, 1);
        const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
        ball = new THREE.Mesh(geo, mat);
        ball.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true })));
        ball.position.set(0, settings.ballSize, 0);
        ball.castShadow = true; ball.velocity = new THREE.Vector3(0, 0, 0);
        scene.add(ball);
    }

    function spawnEnemies(count) {
        for(let i=0; i<count; i++) {
            const enemy = createGummyBear(0xFF0000); // Red Gummy
            enemy.position.set((Math.random() - 0.5) * 20, 0, (Math.random() - 0.5) * 20);
            enemy.scale.setScalar(settings.npcSize);
            enemy.userData = { speed: settings.npcSpeed + (Math.random() * 1.5), offset: Math.random() * Math.PI * 2 };
            enemies.push(enemy); scene.add(enemy);
        }
    }

    // --- Controls ---
    function setupControls() {
        const joyBase = document.getElementById('joystick-base'), joyKnob = document.getElementById('joystick-knob'), maxRadius = 50;
        const startDrag = (x, y) => {
            if(!isRunning) return;
            isDragging = true; joystickOrigin = { x, y };
            joyBase.style.display = 'block'; joyBase.style.left = x + 'px'; joyBase.style.top = y + 'px';
            joyKnob.style.transform = `translate(-50%, -50%)`; moveDir = { x: 0, y: 0 };
        };
        const moveDrag = (x, y) => {
            if(!isDragging) return;
            let dx = x - joystickOrigin.x, dy = y - joystickOrigin.y, dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
            joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            moveDir.x = dx / maxRadius; moveDir.y = dy / maxRadius;
        };
        const endDrag = () => { isDragging = false; joyBase.style.display = 'none'; moveDir = { x: 0, y: 0 }; };

        document.addEventListener('touchstart', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.id === 'settings-btn') return;
            startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        document.addEventListener('touchmove', (e) => { if(isDragging) e.preventDefault(); moveDrag(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        document.addEventListener('touchend', endDrag);

        document.addEventListener('mousedown', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.id === 'settings-btn') return;
            startDrag(e.clientX, e.clientY);
        });
        document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        document.addEventListener('mouseup', endDrag);
    }

    // --- Game Logic ---
    function handleGoal(message, scoreChange) {
        isRunning = false; isDragging = false; moveDir = {x: 0, y: 0};
        document.getElementById('joystick-base').style.display = 'none';
        
        score += scoreChange; document.getElementById('score-display').innerText = score;
        
        AudioEngine.playGoal();
        if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);

        const overlay = document.getElementById('message-overlay');
        overlay.innerHTML = message; overlay.style.display = 'flex';

        setTimeout(() => {
            overlay.style.display = 'none';
            player.position.set(0, 0, 10); player.rotation.set(0, 0, 0);
            ball.position.set(0, settings.ballSize, 0); ball.velocity.set(0, 0, 0);
            
            enemies.forEach(e => scene.remove(e)); enemies = [];
            splatters.forEach(s => scene.remove(s)); splatters = [];
            spawnEnemies(settings.npcCount);
            
            clock.start(); isRunning = true; 
        }, 2000);
    }

    function killEnemy(enemy) {
        const index = enemies.indexOf(enemy);
        if(index === -1) return; // Prevent rare double-kill array bugs

        score += 10; document.getElementById('score-display').innerText = score;
        AudioEngine.playSlash();
        if(navigator.vibrate) navigator.vibrate(50); 

        const splatGeo = new THREE.PlaneGeometry(3 + Math.random()*2, 3 + Math.random()*2);
        const splatMat = new THREE.MeshBasicMaterial({ color: 0xFF0000, transparent: true, opacity: 0.6, depthWrite: false }); // Red splat
        const splat = new THREE.Mesh(splatGeo, splatMat);
        splat.rotation.x = -Math.PI / 2; splat.rotation.z = Math.random() * Math.PI;
        splat.position.set(enemy.position.x, 0.05, enemy.position.z);
        scene.add(splat); splatters.push(splat);

        for(let i=0; i<8; i++) {
            const part = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshPhongMaterial({ color: 0xFF0000, transparent: true, opacity: 0.8 }));
            part.position.copy(enemy.position); part.position.y += 1;
            part.velocity = new THREE.Vector3((Math.random()-0.5)*10, Math.random()*10+5, (Math.random()-0.5)*10);
            part.life = 1.0; scene.add(part); particles.push(part);
        }

        scene.remove(enemy); enemies.splice(index, 1);
        if(enemies.length === 0) spawnEnemies(settings.npcCount);
    }

    function updatePlayer(dt) {
        if(moveDir.x !== 0 || moveDir.y !== 0) {
            player.position.x += moveDir.x * settings.playerSpeed * dt;
            player.position.z += moveDir.y * settings.playerSpeed * dt;
            
            const targetQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(moveDir.x, moveDir.y));
            player.quaternion.slerp(targetQ, 0.15);
            
            // Squish Animation
            const wobble = Math.sin(clock.elapsedTime * 20);
            player.gummyBody.scale.y = 1 + wobble * 0.1;
            player.gummyBody.scale.x = 1 - wobble * 0.05;
            player.gummyBody.scale.z = 1 - wobble * 0.05;
            
            let nearestEnemy = null, minDist = 3.0 * ((settings.playerSize + settings.npcSize)/2); 
            for(let i=0; i<enemies.length; i++) {
                let dist = player.position.distanceTo(enemies[i].position);
                if(dist < minDist) { minDist = dist; nearestEnemy = enemies[i]; }
            }

            if(nearestEnemy) {
                player.isAttacking = true;
                if(minDist < 1.8 * ((settings.playerSize + settings.npcSize)/2)) killEnemy(nearestEnemy);
            }
        } else {
            player.gummyBody.scale.y = 1 + Math.sin(clock.elapsedTime * 3) * 0.03;
            player.gummyBody.scale.x = 1; player.gummyBody.scale.z = 1;
        }

        if(player.isAttacking) {
            player.attackTimer += dt * 15;
            player.sword.rotation.z = Math.sin(player.attackTimer) * 1.5;
            if(player.attackTimer > Math.PI * 2) { player.isAttacking = false; player.attackTimer = 0; }
        } else {
            player.sword.rotation.z = THREE.MathUtils.lerp(player.sword.rotation.z, 0, 0.1);
        }

        player.position.x = THREE.MathUtils.clamp(player.position.x, -config.fieldW/2, config.fieldW/2);
        player.position.z = THREE.MathUtils.clamp(player.position.z, -config.fieldL/2, config.fieldL/2);

        camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x, 0.05);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, player.position.z + 15, 0.05);
    }

    function updateEnemies(dt) {
        for(let i = enemies.length - 1; i >= 0; i--) {
            let enemy = enemies[i];
            let dir = new THREE.Vector3().subVectors(ball.position, enemy.position);
            dir.y = 0; let distToTarget = dir.length();
            
            const interactionDist = 1.2 * ((settings.npcSize + settings.ballSize)/1.6);

            if(distToTarget > interactionDist) {
                dir.normalize();
                enemy.position.addScaledVector(dir, enemy.userData.speed * dt);
                enemy.rotation.y = Math.atan2(dir.x, dir.z);
                
                const wobble = Math.sin(clock.elapsedTime * 15 + enemy.userData.offset);
                enemy.gummyBody.scale.y = 1 + wobble * 0.1;
                enemy.gummyBody.scale.x = 1 - wobble * 0.05;
                enemy.gummyBody.scale.z = 1 - wobble * 0.05;
            }

            if(distToTarget <= interactionDist + 0.3) {
                let goalDir = new THREE.Vector3(0, 0, 24).sub(ball.position);
                goalDir.y = 0; goalDir.normalize();
                goalDir.x += (Math.random() - 0.5) * 0.4; goalDir.normalize(); goalDir.y = 0.3; 
                
                ball.velocity.add(goalDir.multiplyScalar(config.baseKickForce * settings.ballSens * 0.8));
                AudioEngine.playKick();
                
                dir.normalize(); enemy.position.addScaledVector(dir, -1 * settings.npcSize);
            }
        }
    }

    function updateBall(dt) {
        ball.position.addScaledVector(ball.velocity, dt);
        ball.velocity.multiplyScalar(config.ballFriction);
        
        if(ball.position.y > settings.ballSize) ball.velocity.y -= 25 * dt; 
        if(ball.position.y < settings.ballSize) {
            ball.position.y = settings.ballSize;
            if(Math.abs(ball.velocity.y) > 2) {
                AudioEngine.playBounce(Math.abs(ball.velocity.y) / 10);
                if(navigator.vibrate) navigator.vibrate(10); 
            }
            ball.velocity.y *= -settings.ballBounce; 
        }

        if(ball.position.y <= settings.ballSize + 0.1) { 
            ball.rotation.x += ball.velocity.z * dt * (2 / settings.ballSize);
            ball.rotation.z -= ball.velocity.x * dt * (2 / settings.ballSize);
        }

        const pDist = player.position.distanceTo(ball.position);
        if(pDist < 1.5 * ((settings.playerSize + settings.ballSize)/1.6)) {
            const kickDir = new THREE.Vector3().subVectors(ball.position, player.position);
            kickDir.y = 0; kickDir.normalize(); kickDir.y = 0.5; 
            ball.velocity.copy(kickDir.multiplyScalar(config.baseKickForce * settings.ballSens));
            
            AudioEngine.playKick();
            if(navigator.vibrate) navigator.vibrate(30); 
        }

        const bRad = settings.ballSize;
        if(Math.abs(ball.position.x) > config.fieldW/2 - bRad) {
            ball.position.x = Math.sign(ball.position.x) * (config.fieldW/2 - bRad);
            ball.velocity.x *= -0.8;
            AudioEngine.playBounce(Math.abs(ball.velocity.x) / 10);
        }

        if(ball.position.z < -23.5) {
            if(Math.abs(ball.position.x) < settings.npcGoalWidth / 2 && ball.position.y < 5) {
                if(isRunning) handleGoal("YOU SCORED!<br><span style='font-size:30px'>+100 Points</span>", 100);
            } else { ball.position.z = -23.5; ball.velocity.z *= -0.8; }
        }
        
        if(ball.position.z > 23.5) {
            if(Math.abs(ball.position.x) < settings.playerGoalWidth / 2 && ball.position.y < 5) {
                if(isRunning) handleGoal("<span style='color:#FF5252'>ENEMY SCORED!</span><br><span style='font-size:30px'>-50 Points</span>", -50);
            } else { ball.position.z = 23.5; ball.velocity.z *= -0.8; }
        }
    }

    function updateParticles(dt) {
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.position.addScaledVector(p.velocity, dt);
            p.velocity.y -= 20 * dt; 
            if(p.position.y < 0.2) { p.position.y = 0.2; p.velocity.y *= -0.5; p.velocity.x *= 0.8; p.velocity.z *= 0.8; }
            p.life -= dt;
            if(p.life <= 0) {
                p.scale.multiplyScalar(0.9);
                if(p.scale.x < 0.01) { scene.remove(p); particles.splice(i, 1); }
            }
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        if (isRunning) {
            const dt = Math.min(clock.getDelta(), 0.1);
            updatePlayer(dt); updateEnemies(dt); updateBall(dt); updateParticles(dt);
        }
        renderer.render(scene, camera);
    }

    function onResize() {
        if(!camera || !renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
</script>
