<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkyBound Pro: Flight POV</title>
  
  <!-- CesiumJS -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  
  <!-- LeafletJS (Minimap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; color: white; touch-action: none; }
    #cesiumContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; cursor: crosshair; }
    
    .glass {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Throttle Control Style */
    .throttle-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 80px;
      height: 220px;
      background: rgba(0,0,0,0.7);
      border-radius: 40px;
      border: 2px solid #444;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 25px;
      touch-action: none;
    }
    .throttle-track {
      position: absolute;
      top: 30px;
      bottom: 30px;
      width: 6px;
      background: #111;
      border-radius: 3px;
    }
    .stick-handle {
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at center, #ff4444 0%, #aa0000 100%);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,0,0,0.6);
      z-index: 51;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: white;
    }

    /* Vintage Compass */
    .vintage-compass {
      width: 64px;
      height: 64px;
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: #d4af37;
      border-radius: 50%;
      padding: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .compass-face {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .compass-card {
      width: 100%;
      height: 100%;
      transition: transform 0.1s linear;
    }

    /* Map Module Collapsible & Resizable */
    .map-module {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 320px;
      height: 220px;
      min-width: 150px;
      min-height: 120px;
      z-index: 40;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 50px rgba(0,0,0,0.9);
      transition: opacity 0.3s ease, border-radius 0.3s ease;
    }
    .map-module.collapsed {
      width: 64px !important;
      height: 64px !important;
      border-radius: 50%;
      border: none;
      pointer-events: none;
    }
    .map-resize-handle {
      position: absolute;
      top: 0;
      left: 0;
      width: 30px;
      height: 30px;
      cursor: nw-resize;
      z-index: 90;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
    }
    .map-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 91;
      width: 28px;
      height: 28px;
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      pointer-events: auto;
    }
    .map-expand-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 64px;
      height: 64px;
      z-index: 110;
      cursor: pointer;
      border-radius: 50%;
    }

    #minimap { width: 100%; height: 100%; background: #eee; }
    .hud-font { font-family: 'Courier New', Courier, monospace; }
    
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(2, 6, 23, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    @media (max-width: 768px) {
      .bottom-panel { transform: scale(0.8) translateX(-62%); bottom: 10px !important; }
      .throttle-container { left: 10px; bottom: 10px; height: 180px; width: 60px; }
    }

    .plane-map-icon {
        transition: transform 0.1s linear;
        filter: drop-shadow(0 0 3px #000);
    }
  </style>
</head>
<body>

  <!-- Overlays -->
  <div id="loading-overlay">
    <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-cyan-400 font-bold tracking-widest uppercase text-xs">Calibrating POV...</p>
  </div>

  <!-- 1. Selection Screen -->
  <div id="selection-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950 px-4 transition-all duration-700">
    <div class="max-w-4xl w-full text-center">
      <h1 class="text-4xl md:text-6xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600">SKYBOUND PRO</h1>
      <p class="text-slate-500 mb-12 uppercase tracking-[0.2em] text-[10px]">Hypersonic Flight Simulator</p>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-8">
        <button onclick="launch('sf')" class="group p-6 rounded-2xl bg-slate-900 border border-slate-800 hover:border-cyan-500 transition-all">
          <div class="text-3xl mb-2">🌁</div>
          <h2 class="text-sm font-bold uppercase tracking-widest">San Francisco</h2>
        </button>
        <button onclick="launch('alps')" class="group p-6 rounded-2xl bg-slate-900 border border-slate-800 hover:border-emerald-500 transition-all">
          <div class="text-3xl mb-2">🏔️</div>
          <h2 class="text-sm font-bold uppercase tracking-widest">Alps Pass</h2>
        </button>
        <button onclick="launch('canyon')" class="group p-6 rounded-2xl bg-slate-900 border border-slate-800 hover:border-orange-500 transition-all">
          <div class="text-3xl mb-2">🏜️</div>
          <h2 class="text-sm font-bold uppercase tracking-widest">Grand Canyon</h2>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. Main Flight HUD -->
  <div id="hud" class="hidden fixed inset-0 z-20 pointer-events-none">
    
    <!-- Bottom HUD Bar -->
    <div class="hud-element bottom-panel absolute bottom-6 left-1/2 -translate-x-1/2 flex items-end gap-0.5 pointer-events-auto">
        <button onclick="location.reload()" class="bg-red-600/20 hover:bg-red-600/40 px-4 py-2 rounded-l-lg text-red-500 text-[9px] font-black tracking-widest border border-red-500/20 transition-colors uppercase">ABORT</button>
        
        <div class="bg-slate-950/90 px-4 py-2 flex gap-6 border-y border-white/10">
            <div>
                <p class="text-[7px] text-slate-500 font-bold uppercase">Alt</p>
                <p class="text-xs font-bold text-cyan-400 hud-font" id="val-alt">00000</p>
            </div>
            <div>
                <p class="text-[7px] text-slate-500 font-bold uppercase">Speed</p>
                <p class="text-xs font-bold text-white hud-font" id="val-speed">000</p>
            </div>
            <div>
                <p class="text-[7px] text-slate-500 font-bold uppercase">Dist</p>
                <p class="text-xs font-bold text-emerald-400 hud-font" id="val-dist">0.00</p>
            </div>
            <div>
                <p class="text-[7px] text-slate-500 font-bold uppercase">Fuel</p>
                <p class="text-xs font-bold text-orange-500 hud-font" id="val-fuel">00.0</p>
            </div>
        </div>

        <div class="bg-slate-950/90 px-4 py-2 rounded-r-lg border border-white/10 border-l-0 min-w-[120px]">
            <p class="text-[7px] text-slate-500 font-bold uppercase mb-1">GPS</p>
            <div class="text-[9px] hud-font flex flex-col">
                <span id="val-lat" class="text-white">0.00000</span>
                <span id="val-lon" class="text-white">-0.00000</span>
            </div>
        </div>
    </div>

    <!-- Throttle Stick -->
    <div class="hud-element throttle-container pointer-events-auto">
        <div class="text-[8px] text-slate-500 font-bold absolute top-2">THRUST</div>
        <div class="throttle-track"></div>
        <div id="throttle-stick" class="stick-handle" style="bottom: 30px;">
          <span id="throttle-val">0%</span>
        </div>
    </div>

    <!-- Map Module -->
    <div id="map-module" class="hud-element map-module pointer-events-auto">
        <div class="map-resize-handle" id="map-resizer"></div>
        <div class="map-close-btn" onclick="toggleMap()">×</div>
        <div id="minimap"></div>
    </div>

    <!-- Map Expand Button (Visible when collapsed) -->
    <div id="map-expand-btn" class="map-expand-btn hidden pointer-events-auto" onclick="toggleMap()"></div>

    <!-- Compass -->
    <div id="compass-ui" class="hud-element vintage-compass pointer-events-none">
        <div class="compass-face">
            <div id="compass-card" class="compass-card">
                <svg width="100%" height="100%" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="white" stroke="#333" stroke-width="1"/>
                    <text x="50" y="22" text-anchor="middle" font-weight="900" fill="black" font-size="14">N</text>
                    <text x="78" y="50" text-anchor="middle" dominant-baseline="middle" font-weight="900" fill="black" font-size="14">E</text>
                    <text x="50" y="78" text-anchor="middle" font-weight="900" fill="black" font-size="14">S</text>
                    <text x="22" y="50" text-anchor="middle" dominant-baseline="middle" font-weight="900" fill="black" font-size="14">W</text>
                    <polygon points="50,22 46,50 54,50" fill="#ef4444" />
                    <polygon points="50,78 46,50 54,50" fill="black" />
                </svg>
            </div>
        </div>
    </div>

  </div>

  <div id="cesiumContainer"></div>

  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIzMGZkNWQ0ZS01M2JjLTQ3ZTAtOWE5OC1mNzJjMTlkNTViZjciLCJpZCI6Mjg3OTEzLCJpYXQiOjE3NDI5OTIyNzd9.FNwe_7JWOqcsO854hg_Kokvw8KR-Af5B8qSAz7v-kSM';

    let viewer, minimap, planeMarker, startMarker, trailPath;
    let flightActive = false;
    let isMapCollapsed = false;
    let throttleValue = 0; 
    let metrics = { dist: 0, fuel: 0, lastPos: null, currentSpeed: 0 };
    let pathHistory = [];

    // Flight Orientation
    let currentPosition; 
    let heading = 0;
    let pitch = -5;
    let isLooking = false;
    let lastMouseX, lastMouseY;

    const STARTS = {
      sf: { lon: -122.3748, lat: 37.6188, alt: 300 },
      alps: { lon: 7.6000, lat: 45.9000, alt: 3500 },
      canyon: { lon: -112.1130, lat: 36.0544, alt: 2200 }
    };

    function initMaps() {
      viewer = new Cesium.Viewer('cesiumContainer', {
        terrainProvider: Cesium.createWorldTerrain(),
        animation: false, timeline: false, infoBox: false, selectionIndicator: false, baseLayerPicker: false,
        shouldAnimate: true
      });

      viewer.scene.screenSpaceCameraController.enableRotate = false;
      viewer.scene.screenSpaceCameraController.enableTranslate = false;
      viewer.scene.screenSpaceCameraController.enableZoom = false;
      viewer.scene.screenSpaceCameraController.enableTilt = false;
      viewer.scene.screenSpaceCameraController.enableLook = false;
      
      minimap = L.map('minimap', { zoomControl: false, attributionControl: false }).setView([0,0], 12);
      
      // COLOR MAP: Standard OpenStreetMap
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(minimap);
      
      const planeIcon = L.divIcon({
          className: 'plane-map-icon',
          html: `<div style="font-size: 24px; color: #ff0000; transform: rotate(0deg);">✈</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
      });

      startMarker = L.circleMarker([0, 0], { color: '#ef4444', radius: 6, fillOpacity: 1, weight: 2 }).addTo(minimap);
      planeMarker = L.marker([0, 0], { icon: planeIcon }).addTo(minimap);
      trailPath = L.polyline([], { color: '#ff0000', weight: 3, dashArray: '5, 8', opacity: 0.8 }).addTo(minimap);

      initControls();
      window.onload = () => { document.getElementById('loading-overlay').style.display = 'none'; };
    }

    function initControls() {
      // Throttle Stick
      const stick = document.getElementById('throttle-stick');
      const container = document.querySelector('.throttle-container');
      const valText = document.getElementById('throttle-val');
      let isDraggingThrottle = false;

      const updateThrottle = (clientY) => {
        const rect = container.getBoundingClientRect();
        const topLimit = rect.top + 30;
        const bottomLimit = rect.bottom - 30;
        let y = Math.max(topLimit, Math.min(clientY, bottomLimit));
        throttleValue = 1 - (y - topLimit) / (bottomLimit - topLimit); 
        stick.style.top = (y - rect.top - 30) + 'px';
        valText.textContent = Math.round(throttleValue * 100) + '%';
      };

      const tStart = () => isDraggingThrottle = true;
      const tEnd = () => isDraggingThrottle = false;
      const tMove = (e) => {
        if (!isDraggingThrottle) return;
        updateThrottle(e.touches ? e.touches[0].clientY : e.clientY);
      };

      stick.addEventListener('mousedown', tStart);
      window.addEventListener('mouseup', tEnd);
      window.addEventListener('mousemove', tMove);
      stick.addEventListener('touchstart', (e) => { tStart(); e.preventDefault(); });
      window.addEventListener('touchend', tEnd);
      window.addEventListener('touchmove', tMove);

      // Map Resizer
      const resizer = document.getElementById('map-resizer');
      const mapMod = document.getElementById('map-module');
      let isResizing = false;

      resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        e.preventDefault();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const newWidth = viewportWidth - e.clientX - 20;
        const newHeight = viewportHeight - e.clientY - 20;
        
        if (newWidth > 150 && newWidth < viewportWidth * 0.8) mapMod.style.width = newWidth + 'px';
        if (newHeight > 120 && newHeight < viewportHeight * 0.8) mapMod.style.height = newHeight + 'px';
        minimap.invalidateSize();
      });

      window.addEventListener('mouseup', () => isResizing = false);

      // Steering
      const cesiumEl = document.getElementById('cesiumContainer');
      const startLook = (x, y) => { isLooking = true; lastMouseX = x; lastMouseY = y; };
      const moveLook = (x, y) => {
        if (!isLooking) return;
        heading += (x - lastMouseX) * 0.15;
        pitch -= (y - lastMouseY) * 0.15;
        pitch = Math.max(-88, Math.min(88, pitch));
        lastMouseX = x; lastMouseY = y;
      };

      cesiumEl.addEventListener('mousedown', (e) => startLook(e.clientX, e.clientY));
      window.addEventListener('mousemove', (e) => moveLook(e.clientX, e.clientY));
      window.addEventListener('mouseup', () => isLooking = false);
      cesiumEl.addEventListener('touchstart', (e) => startLook(e.touches[0].clientX, e.touches[0].clientY));
      window.addEventListener('touchmove', (e) => moveLook(e.touches[0].clientX, e.touches[0].clientY));
      window.addEventListener('touchend', () => isLooking = false);
    }

    async function launch(key) {
      const startData = STARTS[key];
      document.getElementById('selection-screen').classList.add('hidden');
      if (!viewer) initMaps();

      currentPosition = Cesium.Cartesian3.fromDegrees(startData.lon, startData.lat, startData.alt);
      heading = 0; pitch = -5;
      pathHistory = [];
      trailPath.setLatLngs([]);
      startMarker.setLatLng([startData.lat, startData.lon]);

      viewer.camera.setView({
        destination: currentPosition,
        orientation: { heading: 0, pitch: Cesium.Math.toRadians(pitch), roll: 0 }
      });

      document.getElementById('hud').classList.remove('hidden');
      flightActive = true;
      minimap.setView([startData.lat, startData.lon], 13);
      viewer.clock.onTick.addEventListener(onTick);
    }

    function onTick(clock) {
      if (!flightActive || !currentPosition) return;

      const dir = viewer.camera.direction;
      // HYPERSONIC SPEED: 5,000 m/s (~18,000 KPH)
      const maxSpeed = 5000; 
      const speed = throttleValue * maxSpeed;
      const dt = 0.016; 
      const movement = Cesium.Cartesian3.multiplyByScalar(dir, speed * dt, new Cesium.Cartesian3());
      let nextPosition = Cesium.Cartesian3.add(currentPosition, movement, new Cesium.Cartesian3());

      // BOUNCE LOGIC (Clamping altitude to terrain)
      const carto = Cesium.Cartographic.fromCartesian(nextPosition);
      const terrainHeight = viewer.scene.globe.getHeight(carto) || 0;
      
      if (carto.height < terrainHeight + 10) {
        carto.height = terrainHeight + 10;
        nextPosition = Cesium.Cartographic.toCartesian(carto);
      }

      currentPosition = nextPosition;

      viewer.camera.setView({
        destination: currentPosition,
        orientation: { heading: Cesium.Math.toRadians(heading), pitch: Cesium.Math.toRadians(pitch), roll: 0 }
      });

      updateTelemetry(currentPosition, speed);
    }

    function updateTelemetry(pos, speed) {
      const carto = Cesium.Cartographic.fromCartesian(pos);
      const lat = Cesium.Math.toDegrees(carto.latitude);
      const lon = Cesium.Math.toDegrees(carto.longitude);
      const alt = carto.height * 3.28084;

      if (metrics.lastPos) {
        const d = Cesium.Cartesian3.distance(pos, metrics.lastPos);
        metrics.dist += (d / 1000);
        metrics.fuel += (d * 0.001); // Optimized fuel burn for speed
      }
      metrics.lastPos = pos.clone();

      document.getElementById('val-alt').textContent = Math.round(alt).toString().padStart(5, '0');
      document.getElementById('val-dist').textContent = metrics.dist.toFixed(2);
      document.getElementById('val-fuel').textContent = metrics.fuel.toFixed(1);
      document.getElementById('val-lat').textContent = lat.toFixed(5);
      document.getElementById('val-lon').textContent = lon.toFixed(5);
      document.getElementById('val-speed').textContent = Math.round(speed * 3.6).toString().padStart(3, '0');
      
      const visualHeading = ((heading % 360) + 360) % 360;
      document.getElementById('compass-card').style.transform = `rotate(${-visualHeading}deg)`;

      if (!isMapCollapsed) {
          planeMarker.setLatLng([lat, lon]);
          const planeEl = planeMarker.getElement();
          if (planeEl) {
              const inner = planeEl.querySelector('div');
              if (inner) inner.style.transform = `rotate(${visualHeading}deg)`;
          }
          if (speed > 5) {
              pathHistory.push([lat, lon]);
              // Sample less frequently at hypersonic speeds to save memory
              if (pathHistory.length % 15 === 0) trailPath.setLatLngs(pathHistory);
          }
          minimap.panTo([lat, lon], { animate: false });
      }
    }

    function toggleMap() {
      isMapCollapsed = !isMapCollapsed;
      const mod = document.getElementById('map-module');
      const expand = document.getElementById('map-expand-btn');
      
      if (isMapCollapsed) {
        mod.classList.add('collapsed');
        mod.style.opacity = "0";
        expand.classList.remove('hidden');
      } else {
        mod.classList.remove('collapsed');
        mod.style.opacity = "1";
        expand.classList.add('hidden');
        setTimeout(() => minimap.invalidateSize(), 400);
      }
    }

    initMaps();
    window.addEventListener('resize', () => {
      if(viewer) viewer.forceResize();
      if(minimap) minimap.invalidateSize();
    });
  </script>
</body>
</html>
