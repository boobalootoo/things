<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkyBound Pro: Flight POV</title>
  
  <!-- CesiumJS -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  
  <!-- LeafletJS (Minimap & Selector) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; color: white; touch-action: none; }
    #cesiumContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; cursor: crosshair; }
    #cesiumContainer:active { cursor: grabbing; }
    
    .glass {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Selector Map UI */
    #selector-map { width: 100%; height: 100%; background: #222; z-index: 1; }

    /* Throttle Control Style */
    .throttle-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 80px;
      height: 220px;
      background: rgba(0,0,0,0.7);
      border-radius: 40px;
      border: 2px solid #444;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 25px;
      touch-action: none;
    }
    .throttle-track {
      position: absolute;
      top: 30px;
      bottom: 30px;
      width: 6px;
      background: #111;
      border-radius: 3px;
    }
    .stick-handle {
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at center, #ff4444 0%, #aa0000 100%);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,0,0,0.6);
      z-index: 51;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: white;
    }

    /* Vintage Compass */
    .vintage-compass {
      width: 64px;
      height: 64px;
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: #d4af37;
      border-radius: 50%;
      padding: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .compass-face {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .compass-card {
      width: 100%;
      height: 100%;
      transition: transform 0.1s linear;
    }

    /* Map Module Collapsible & Resizable */
    .map-module {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 320px;
      height: 220px;
      min-width: 150px;
      min-height: 120px;
      z-index: 40;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 50px rgba(0,0,0,0.9);
      transition: opacity 0.3s ease, border-radius 0.3s ease;
      background: #222; /* Clean fallback before tiles load */
    }
    .map-module.collapsed {
      width: 64px !important;
      height: 64px !important;
      border-radius: 50%;
      border: none;
      pointer-events: none;
    }
    .map-resize-handle {
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      cursor: nw-resize;
      z-index: 400; 
      background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
    }
    .map-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 400; 
      width: 28px;
      height: 28px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.2s;
    }
    .map-close-btn:hover { background: rgba(34, 211, 238, 0.8); }
    
    .map-expand-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 64px;
      height: 64px;
      z-index: 110;
      cursor: pointer;
      border-radius: 50%;
    }

    #minimap { width: 100%; height: 100%; }
    .hud-font { font-family: 'Courier New', Courier, monospace; }
    
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(2, 6, 23, 1);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    @media (max-width: 768px) {
      .bottom-panel { transform: scale(0.8) translateX(-62%); bottom: 10px !important; }
      .throttle-container { left: 10px; bottom: 10px; height: 180px; width: 60px; }
      #takeoff-btn { padding: 16px 32px; font-size: 14px; }
    }

    .plane-map-icon {
        transition: transform 0.1s linear;
        filter: drop-shadow(0 0 3px #000);
    }
    
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 1px solid rgba(34, 211, 238, 0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }
    .crosshair::after, .crosshair::before {
      content: '';
      position: absolute;
      background: rgba(34, 211, 238, 0.6);
    }
    .crosshair::before { top: 50%; left: -10px; width: 60px; height: 1px; transform: translateY(-50%); }
    .crosshair::after { left: 50%; top: -10px; height: 60px; width: 1px; transform: translateX(-50%); }
  </style>
</head>
<body>

  <!-- Overlays -->
  <div id="loading-overlay">
    <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-cyan-400 font-bold tracking-widest uppercase text-xs">Calibrating POV...</p>
  </div>

  <!-- 1. Selection Screen (World Map Selector) -->
  <div id="selection-screen" class="fixed inset-0 z-[100] flex flex-col bg-slate-950 transition-all duration-700">
    <div class="absolute top-0 left-0 right-0 z-[110] p-6 bg-gradient-to-b from-slate-950 to-transparent pointer-events-none">
        <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600">SKYBOUND MISSION PLANNER</h1>
        <p class="text-slate-400 text-[10px] md:text-xs uppercase tracking-widest mt-1">Click the map to select your takeoff point</p>
    </div>
    
    <div id="selector-map" class="flex-grow"></div>

    <div class="absolute bottom-10 left-0 right-0 z-[110] flex flex-col items-center gap-4 w-full px-4 pointer-events-none">
        <div id="selection-status" class="bg-slate-900/95 border border-white/10 px-6 py-3 rounded-full text-[10px] md:text-xs font-bold text-slate-400 backdrop-blur-md shadow-2xl">
            Awaiting selection...
        </div>
        <button id="takeoff-btn" onclick="startSelectedFlight()" class="hidden bg-cyan-600 hover:bg-cyan-500 text-white px-10 py-4 rounded-full font-black text-sm tracking-widest shadow-[0_0_30px_rgba(8,145,178,0.5)] transition-all uppercase pointer-events-auto">
            Initiate Takeoff
        </button>
    </div>
  </div>

  <!-- 2. Main Flight HUD -->
  <div id="hud" class="hidden fixed inset-0 z-20 pointer-events-none">
    
    <div class="crosshair hud-element"></div>

    <!-- Bottom HUD Bar -->
    <div class="hud-element bottom-panel absolute bottom-6 left-1/2 -translate-x-1/2 flex items-end gap-0.5 pointer-events-auto">
        <button onclick="location.reload()" class="bg-red-600/20 hover:bg-red-600/40 px-4 py-2 rounded-l-lg text-red-500 text-[9px] font-black tracking-widest border border-red-500/20 transition-colors uppercase">ABORT</button>
        
        <div class="bg-slate-950/90 px-4 py-2 flex gap-6 border-y border-white/10">
            <div>
                <p class="text-[7px] text-slate-500 font-bold uppercase">Alt</p>
                <p class="text-xs font-bold text-cyan-400 hud-font" id="val-alt">00000</p>
            </div>
            <div>
                <p class="text-[7px] text-slate-500 font-bold uppercase">Speed</p>
                <p class="text-xs font-bold text-white hud-font" id="val-speed">000</p>
            </div>
            <div>
                <p class="text-[7px] text-slate-500 font-bold uppercase">Dist</p>
                <p class="text-xs font-bold text-emerald-400 hud-font" id="val-dist">0.00</p>
            </div>
            <div>
                <p class="text-[7px] text-slate-500 font-bold uppercase">Fuel</p>
                <p class="text-xs font-bold text-orange-500 hud-font" id="val-fuel">00.0</p>
            </div>
        </div>

        <div class="bg-slate-950/90 px-4 py-2 rounded-r-lg border border-white/10 border-l-0 min-w-[120px]">
            <p class="text-[7px] text-slate-500 font-bold uppercase mb-1">GPS</p>
            <div class="text-[9px] hud-font flex flex-col">
                <span id="val-lat" class="text-white">0.00000</span>
                <span id="val-lon" class="text-white">-0.00000</span>
            </div>
        </div>
    </div>

    <!-- Throttle Stick -->
    <div class="hud-element throttle-container pointer-events-auto">
        <div class="text-[8px] text-slate-500 font-bold absolute top-2 text-center">THRUST</div>
        <div class="throttle-track"></div>
        <div id="throttle-stick" class="stick-handle" style="bottom: 30px;">
          <span id="throttle-val">0%</span>
        </div>
    </div>

    <!-- Map Module -->
    <div id="map-module" class="hud-element map-module pointer-events-auto">
        <div class="map-resize-handle" id="map-resizer"></div>
        <div class="map-close-btn" onclick="toggleMap()">×</div>
        <div id="minimap"></div>
    </div>

    <!-- Map Expand Button -->
    <div id="map-expand-btn" class="map-expand-btn hidden pointer-events-auto" onclick="toggleMap()"></div>

    <!-- Compass -->
    <div id="compass-ui" class="hud-element vintage-compass pointer-events-none">
        <div class="compass-face">
            <div id="compass-card" class="compass-card">
                <svg width="100%" height="100%" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="white" stroke="#333" stroke-width="1"/>
                    <text x="50" y="22" text-anchor="middle" font-weight="900" fill="black" font-size="14">N</text>
                    <text x="78" y="50" text-anchor="middle" dominant-baseline="middle" font-weight="900" fill="black" font-size="14">E</text>
                    <text x="50" y="78" text-anchor="middle" font-weight="900" fill="black" font-size="14">S</text>
                    <text x="22" y="50" text-anchor="middle" dominant-baseline="middle" font-weight="900" fill="black" font-size="14">W</text>
                    <polygon points="50,22 46,50 54,50" fill="#ef4444" />
                    <polygon points="50,78 46,50 54,50" fill="black" />
                </svg>
            </div>
        </div>
    </div>

  </div>

  <div id="cesiumContainer"></div>

  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIzMGZkNWQ0ZS01M2JjLTQ3ZTAtOWE5OC1mNzJjMTlkNTViZjciLCJpZCI6Mjg3OTEzLCJpYXQiOjE3NDI5OTIyNzd9.FNwe_7JWOqcsO854hg_Kokvw8KR-Af5B8qSAz7v-kSM';

    let viewer, minimap, planeMarker, startMarker, trailPath;
    let selectorMap, selectorMarker;
    let selectedCoords = null;
    
    let flightActive = false;
    let isMapCollapsed = false;
    let throttleValue = 0; 
    let metrics = { dist: 0, fuel: 0, lastPos: null };
    let pathHistory = [];

    // Core Camera State (Driven by Mouse, Applied to Cesium)
    let cameraHeading = 0; // Degrees
    let cameraPitch = -5;  // Degrees

    function initSelectorMap() {
        selectorMap = L.map('selector-map', {
            attributionControl: false,
            worldCopyJump: true,
            zoomControl: false
        }).setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(selectorMap);

        selectorMap.on('click', (e) => {
            const { lat, lng } = e.latlng;
            selectedCoords = { lat, lon: lng };
            
            if (selectorMarker) {
                selectorMarker.setLatLng(e.latlng);
            } else {
                selectorMarker = L.marker(e.latlng).addTo(selectorMap);
            }

            document.getElementById('selection-status').innerHTML = `LOCKED: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            document.getElementById('selection-status').classList.add('text-cyan-400');
            document.getElementById('takeoff-btn').classList.remove('hidden');
        });
    }

    function initMaps() {
      viewer = new Cesium.Viewer('cesiumContainer', {
        terrainProvider: Cesium.createWorldTerrain(),
        animation: false, 
        timeline: false, 
        infoBox: false, 
        selectionIndicator: false, 
        baseLayerPicker: false,
        shouldAnimate: true, 
        skyBox: undefined
      });

      // DISABLING NATIVE CESIUM CONTROLS (To prevent it fighting our custom physics)
      viewer.scene.screenSpaceCameraController.enableInputs = false;
      
      minimap = L.map('minimap', { zoomControl: false, attributionControl: false }).setView([0,0], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(minimap);
      
      const planeIcon = L.divIcon({
          className: 'plane-map-icon',
          html: `<div style="font-size: 24px; color: #ff0000; transform: rotate(0deg); line-height: 1;">✈</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
      });

      startMarker = L.circleMarker([0, 0], { color: '#ef4444', radius: 6, fillOpacity: 1, weight: 2 }).addTo(minimap);
      planeMarker = L.marker([0, 0], { icon: planeIcon }).addTo(minimap);
      trailPath = L.polyline([], { color: '#ff0000', weight: 3, dashArray: '5, 8', opacity: 0.8 }).addTo(minimap);

      initUIControls();
    }

    function initUIControls() {
      // --- THROTTLE CONTROLS ---
      const stick = document.getElementById('throttle-stick');
      const container = document.querySelector('.throttle-container');
      const valText = document.getElementById('throttle-val');
      let isDraggingThrottle = false;

      const updateThrottle = (clientY) => {
        const rect = container.getBoundingClientRect();
        const trackHeight = rect.height - 60; 
        let distanceFromBottom = (rect.bottom - 30) - clientY;
        throttleValue = Math.max(0, Math.min(1, distanceFromBottom / trackHeight));
        
        stick.style.bottom = (throttleValue * trackHeight + 30) + 'px';
        stick.style.top = 'auto'; 
        valText.textContent = Math.round(throttleValue * 100) + '%';
      };

      const tStart = (e) => { 
          isDraggingThrottle = true; 
          e.stopPropagation(); 
          if(e.cancelable) e.preventDefault(); 
      };
      const tEnd = () => isDraggingThrottle = false;
      const tMove = (e) => {
        if (!isDraggingThrottle) return;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        updateThrottle(clientY);
        if(e.touches && e.cancelable) e.preventDefault();
      };

      stick.addEventListener('mousedown', tStart);
      window.addEventListener('mouseup', tEnd);
      window.addEventListener('mousemove', tMove);
      stick.addEventListener('touchstart', tStart, { passive: false });
      window.addEventListener('touchend', tEnd);
      window.addEventListener('touchmove', tMove, { passive: false });

      // --- MAP RESIZER LOGIC ---
      const resizer = document.getElementById('map-resizer');
      const mapMod = document.getElementById('map-module');
      let isResizing = false;

      resizer.addEventListener('mousedown', (e) => { isResizing = true; e.preventDefault(); e.stopPropagation(); });
      resizer.addEventListener('touchstart', (e) => { isResizing = true; e.preventDefault(); e.stopPropagation(); }, { passive: false });

      const handleResize = (clientX, clientY) => {
        if (!isResizing) return;
        const newWidth = window.innerWidth - clientX - 20;
        const newHeight = window.innerHeight - clientY - 20;
        if (newWidth > 150) mapMod.style.width = newWidth + 'px';
        if (newHeight > 120) mapMod.style.height = newHeight + 'px';
        minimap.invalidateSize();
      };

      window.addEventListener('mousemove', (e) => handleResize(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => handleResize(e.touches[0].clientX, e.touches[0].clientY), { passive: false });
      window.addEventListener('mouseup', () => isResizing = false);
      window.addEventListener('touchend', () => isResizing = false);

      // --- CUSTOM STEERING ENGINE (1st Person Look) ---
      let isLooking = false;
      let lastMouseX, lastMouseY;

      const startLook = (x, y) => { isLooking = true; lastMouseX = x; lastMouseY = y; };
      const moveLook = (x, y, e) => {
        if (!isLooking) return;
        const dx = x - lastMouseX;
        const dy = y - lastMouseY;
        
        cameraHeading += dx * 0.15; // Pan left/right
        cameraPitch -= dy * 0.15;   // Tilt up/down
        
        // Constrain pitch from flipping upside down
        cameraPitch = Math.max(-89, Math.min(89, cameraPitch));
        
        // Keep heading modular (0 to 360)
        cameraHeading = (cameraHeading % 360 + 360) % 360;

        lastMouseX = x;
        lastMouseY = y;
        if(e && e.touches && e.cancelable) e.preventDefault();
      };

      const cesiumEl = document.getElementById('cesiumContainer');

      // Bind directly to the Cesium Canvas and Window to fix PC controls
      cesiumEl.addEventListener('mousedown', (e) => {
          startLook(e.clientX, e.clientY);
      });
      window.addEventListener('mousemove', (e) => {
          if (isLooking) moveLook(e.clientX, e.clientY, e);
      });
      window.addEventListener('mouseup', () => isLooking = false);
      
      // Touch bindings for mobile
      cesiumEl.addEventListener('touchstart', (e) => {
          startLook(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });
      window.addEventListener('touchmove', (e) => {
          if (isLooking) moveLook(e.touches[0].clientX, e.touches[0].clientY, e);
      }, { passive: false });
      window.addEventListener('touchend', () => isLooking = false);
    }

    async function startSelectedFlight() {
      if (!selectedCoords) return;
      
      const loader = document.getElementById('loading-overlay');
      loader.style.display = 'flex';
      document.getElementById('selection-screen').classList.add('hidden');
      
      if (!viewer) initMaps();

      const startPosition = Cesium.Cartesian3.fromDegrees(selectedCoords.lon, selectedCoords.lat, 800);
      pathHistory = [];
      trailPath.setLatLngs([]);
      startMarker.setLatLng([selectedCoords.lat, selectedCoords.lon]);

      // Initialize Camera Look Variables
      cameraHeading = 0; 
      cameraPitch = -5;

      viewer.camera.setView({
        destination: startPosition,
        orientation: { 
            heading: Cesium.Math.toRadians(cameraHeading), 
            pitch: Cesium.Math.toRadians(cameraPitch), 
            roll: 0 
        }
      });

      setTimeout(() => {
        loader.style.display = 'none';
        document.getElementById('hud').classList.remove('hidden');
        
        // FIX: The Grey Box Map Bug. Force leaflet to recalculate layout multiple times as it becomes visible.
        minimap.setView([selectedCoords.lat, selectedCoords.lon], 13);
        const mapFixInterval = setInterval(() => minimap.invalidateSize(true), 100);
        setTimeout(() => clearInterval(mapFixInterval), 1500);

        flightActive = true;
        viewer.clock.onTick.addEventListener(onTick);
      }, 1500);
    }

    function onTick(clock) {
      if (!flightActive) return;

      // 1. Apply user's steering manually to the camera orientation
      viewer.camera.setView({
        orientation: {
          heading: Cesium.Math.toRadians(cameraHeading),
          pitch: Cesium.Math.toRadians(cameraPitch),
          roll: 0
        }
      });

      // 2. Fetch the forward direction vector we are now pointing at
      const dir = viewer.camera.direction;
      
      const maxSpeed = 10000; 
      const speed = throttleValue * maxSpeed;
      const dt = 0.016; 

      if (speed > 0) {
          // 3. Push the camera forward along the vector
          const movement = Cesium.Cartesian3.multiplyByScalar(dir, speed * dt, new Cesium.Cartesian3());
          let nextPosition = Cesium.Cartesian3.add(viewer.camera.position, movement, new Cesium.Cartesian3());

          // Terrain collision check (Solid Ground Bounce Logic)
          const carto = Cesium.Cartographic.fromCartesian(nextPosition);
          const terrainHeight = viewer.scene.globe.getHeight(carto) || 0;
          
          // Increased buffer to 50 meters for a solid feel at hypersonic speeds
          if (carto.height < terrainHeight + 50) {
            carto.height = terrainHeight + 50;
            nextPosition = Cesium.Cartographic.toCartesian(carto);
            
            // "Bounce" effect - smoothly push the nose of the plane up if digging down
            if (cameraPitch < 0) {
                cameraPitch += (0 - cameraPitch) * 0.05; 
            }
          }

          // 4. Finalize position (re-apply orientation so it doesn't reset)
          viewer.camera.setView({
            destination: nextPosition,
            orientation: {
                heading: Cesium.Math.toRadians(cameraHeading),
                pitch: Cesium.Math.toRadians(cameraPitch),
                roll: 0
            }
          });
      }

      updateTelemetry(viewer.camera.position, speed);
    }

    function updateTelemetry(pos, speed) {
      const carto = Cesium.Cartographic.fromCartesian(pos);
      const lat = Cesium.Math.toDegrees(carto.latitude);
      const lon = Cesium.Math.toDegrees(carto.longitude);
      const alt = carto.height * 3.28084;

      if (metrics.lastPos) {
        const d = Cesium.Cartesian3.distance(pos, metrics.lastPos);
        metrics.dist += (d / 1000);
        metrics.fuel += (d * 0.0005);
      }
      metrics.lastPos = pos.clone();

      document.getElementById('val-alt').textContent = Math.round(alt).toString().padStart(5, '0');
      document.getElementById('val-dist').textContent = metrics.dist.toFixed(2);
      document.getElementById('val-fuel').textContent = metrics.fuel.toFixed(1);
      document.getElementById('val-lat').textContent = lat.toFixed(5);
      document.getElementById('val-lon').textContent = lon.toFixed(5);
      document.getElementById('val-speed').textContent = Math.round(speed * 3.6).toString().padStart(3, '0');
      
      const visualHeading = ((cameraHeading % 360) + 360) % 360;
      document.getElementById('compass-card').style.transform = `rotate(${-visualHeading}deg)`;

      // Map Dynamic Zoom & UI Updates
      const targetZoom = Math.max(3, Math.min(17, 16 - Math.log10(Math.max(10, alt) / 100) * 3));
      
      if (!isMapCollapsed) {
          if (Math.abs(minimap.getZoom() - targetZoom) > 0.8) {
              minimap.setZoom(Math.round(targetZoom));
          }

          planeMarker.setLatLng([lat, lon]);
          const planeEl = planeMarker.getElement();
          if (planeEl) {
              const inner = planeEl.querySelector('div');
              if (inner) inner.style.transform = `rotate(${visualHeading}deg)`;
          }
          if (speed > 5) {
              pathHistory.push([lat, lon]);
              if (pathHistory.length % 20 === 0) trailPath.setLatLngs(pathHistory);
          }
          minimap.panTo([lat, lon], { animate: false });
      }
    }

    function toggleMap() {
      isMapCollapsed = !isMapCollapsed;
      const mod = document.getElementById('map-module');
      const expand = document.getElementById('map-expand-btn');
      if (isMapCollapsed) {
        mod.classList.add('collapsed');
        mod.style.opacity = "0";
        expand.classList.remove('hidden');
      } else {
        mod.classList.remove('collapsed');
        mod.style.opacity = "1";
        expand.classList.add('hidden');
        setTimeout(() => minimap.invalidateSize(true), 400);
      }
    }

    initSelectorMap();
    window.addEventListener('resize', () => {
      if(viewer) viewer.forceResize();
      if(minimap) minimap.invalidateSize(true);
      if(selectorMap) selectorMap.invalidateSize(true);
    });
  </script>
</body>
</html>
