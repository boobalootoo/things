<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate List Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --primary-bg: #f8fafc;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--primary-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior-y: contain;
        }

        .list-item-wrapper {
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
            user-select: none;
        }

        .list-item-content {
            position: relative;
            background: white;
            z-index: 2;
            transition: transform 0.2s ease-out;
            cursor: grab;
        }

        .delete-action {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 80px;
            background: #ef4444;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .swiped-left .list-item-content {
            transform: translateX(-80px);
        }

        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6;
            font-weight: 700;
        }

        #tabBar::-webkit-scrollbar {
            display: none;
        }

        .modal-overlay {
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .sortable-ghost {
            opacity: 0.3;
            background: #e2e8f0;
        }
        
        .tab-btn {
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header / Nav -->
    <header class="bg-white border-b pt-4 shrink-0 shadow-sm">
        <div class="flex items-center justify-between px-4 mb-3">
            <h1 class="font-black text-xl text-slate-800 tracking-tight">My Collections</h1>
            <div class="flex gap-4">
                <button onclick="exportData()" class="text-slate-500 hover:text-blue-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                </button>
                <button onclick="document.getElementById('fileInput').click()" class="text-slate-500 hover:text-blue-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l4-4m0 0l4 4m-4-4v12" /></svg>
                </button>
                <input type="file" id="fileInput" class="hidden" accept=".json" onchange="handleFileImport(event)">
            </div>
        </div>

        <!-- Dynamic Tab Bar -->
        <div class="flex items-center border-t">
            <div id="tabBar" class="flex flex-1 overflow-x-auto text-slate-500 font-medium scroll-smooth">
                <!-- Tabs go here -->
            </div>
            <button onclick="openNewListModal()" class="px-5 py-3 text-blue-600 font-bold border-l bg-slate-50 hover:bg-slate-100 active:bg-slate-200 transition-colors">
                +
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="listContainer" class="flex-1 overflow-y-auto p-4 space-y-2 pb-24">
        <!-- Items go here -->
    </main>

    <!-- Bottom Input -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t flex gap-2 items-center z-40">
        <input type="text" id="itemInput" placeholder="Add to list..." 
               class="flex-1 bg-slate-100 border-none rounded-2xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
        <button onclick="addItem()" class="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
        </button>
    </div>

    <!-- Generic Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay fixed inset-0 flex">
        <div class="bg-white p-6 rounded-3xl w-80 shadow-2xl scale-in transform transition-transform">
            <h2 id="confirmTitle" class="text-xl font-bold mb-2 text-slate-800">Are you sure?</h2>
            <p id="confirmText" class="text-slate-500 text-sm mb-6 leading-relaxed">This action cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 rounded-xl bg-slate-100 font-semibold text-slate-600 active:bg-slate-200">Cancel</button>
                <button id="confirmActionBtn" class="flex-1 py-3 rounded-xl bg-red-500 text-white font-semibold active:bg-red-600">Delete</button>
            </div>
        </div>
    </div>

    <!-- New List Modal -->
    <div id="newListModal" class="modal-overlay fixed inset-0 flex">
        <div class="bg-white p-6 rounded-3xl w-80 shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-slate-800">New List</h2>
            <input type="text" id="newListInput" placeholder="Enter list name..." 
                   class="w-full bg-slate-100 border-none rounded-xl px-4 py-3 mb-6 focus:ring-2 focus:ring-blue-500 outline-none">
            <div class="flex gap-3">
                <button onclick="closeNewListModal()" class="flex-1 py-3 rounded-xl bg-slate-100 font-semibold text-slate-600">Cancel</button>
                <button onclick="confirmCreateList()" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-semibold">Create</button>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div id="importModal" class="modal-overlay fixed inset-0 flex">
        <div class="bg-white p-6 rounded-3xl w-80 shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Import Options</h2>
            <p class="text-slate-500 text-sm mb-6">How should we handle the imported data?</p>
            
            <div class="space-y-4">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="radio" name="importType" value="replace" checked class="w-4 h-4 text-blue-600">
                    <span class="text-slate-700">Replace current lists</span>
                </label>
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="radio" name="importType" value="merge" class="w-4 h-4 text-blue-600">
                    <span class="text-slate-700">Merge with current</span>
                </label>
                <hr>
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" id="removeDuplicates" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-slate-700">Remove duplicates</span>
                </label>
            </div>

            <div class="mt-8 flex gap-2">
                <button onclick="closeModal('importModal')" class="flex-1 py-3 rounded-xl bg-slate-100 font-medium">Cancel</button>
                <button onclick="confirmImport()" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-medium">Import</button>
            </div>
        </div>
    </div>

    <script>
        let lists = {
            "To-Do": [],
            "Watchlist": [],
            "Favourites": []
        };
        let currentTab = "To-Do";
        let importedDataTemp = null;
        let pendingDeleteTab = null;

        const container = document.getElementById('listContainer');
        const input = document.getElementById('itemInput');
        const tabBar = document.getElementById('tabBar');
        
        // Modals
        const importModal = document.getElementById('importModal');
        const newListModal = document.getElementById('newListModal');
        const newListInput = document.getElementById('newListInput');
        const confirmModal = document.getElementById('confirmModal');

        function init() {
            const saved = localStorage.getItem('multi_list_storage');
            const savedActive = localStorage.getItem('last_active_tab');
            if (saved) {
                try {
                    lists = JSON.parse(saved);
                } catch(e) { console.error("Data load error", e); }
            }
            if (savedActive && lists[savedActive]) {
                currentTab = savedActive;
            } else {
                currentTab = Object.keys(lists)[0] || "To-Do";
            }
            
            // Ensure basic structure exists
            if (Object.keys(lists).length === 0) {
                lists = { "To-Do": [] };
                currentTab = "To-Do";
            }

            renderTabs();
            renderItems();
            setupSortable();
        }

        function saveData() {
            localStorage.setItem('multi_list_storage', JSON.stringify(lists));
            localStorage.setItem('last_active_tab', currentTab);
        }

        function renderTabs() {
            tabBar.innerHTML = '';
            Object.keys(lists).forEach(tabName => {
                const btn = document.createElement('button');
                btn.className = `tab-btn px-6 py-4 whitespace-nowrap transition-all flex items-center gap-2 ${currentTab === tabName ? 'tab-active' : 'text-slate-400'}`;
                btn.innerHTML = `<span>${tabName}</span>`;
                
                btn.onclick = () => switchTab(tabName);
                
                // Double tap or long press logic for deletion
                btn.oncontextmenu = (e) => {
                    e.preventDefault();
                    requestDeleteTab(tabName);
                };

                tabBar.appendChild(btn);
            });
        }

        function switchTab(name) {
            currentTab = name;
            renderTabs();
            renderItems();
            saveData();
            // Scroll tab into view
            const activeTab = tabBar.querySelector('.tab-active');
            if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        // --- Modals Logic ---

        function openNewListModal() {
            newListModal.style.display = 'flex';
            newListInput.value = '';
            setTimeout(() => newListInput.focus(), 100);
        }

        function closeNewListModal() {
            newListModal.style.display = 'none';
        }

        function confirmCreateList() {
            const name = newListInput.value.trim();
            if (name) {
                if (!lists[name]) {
                    lists[name] = [];
                    currentTab = name;
                    renderTabs();
                    renderItems();
                    saveData();
                    closeNewListModal();
                } else {
                    // Simple inline feedback instead of alert
                    newListInput.classList.add('ring-2', 'ring-red-500');
                    setTimeout(() => newListInput.classList.remove('ring-red-500'), 2000);
                }
            }
        }

        function requestDeleteTab(name) {
            pendingDeleteTab = name;
            document.getElementById('confirmTitle').innerText = "Delete List?";
            document.getElementById('confirmText').innerText = `Are you sure you want to delete "${name}" and all its items?`;
            const actionBtn = document.getElementById('confirmActionBtn');
            actionBtn.onclick = confirmDeleteTab;
            confirmModal.style.display = 'flex';
        }

        function confirmDeleteTab() {
            if (pendingDeleteTab) {
                delete lists[pendingDeleteTab];
                currentTab = Object.keys(lists)[0] || "";
                renderTabs();
                renderItems();
                saveData();
                closeConfirmModal();
            }
        }

        function closeConfirmModal() {
            confirmModal.style.display = 'none';
            pendingDeleteTab = null;
        }

        // --- Items Logic ---

        function addItem() {
            const text = input.value.trim();
            if (!text || !currentTab) return;

            lists[currentTab].push({
                id: Date.now().toString(),
                text: text
            });

            input.value = '';
            renderItems();
            saveData();
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItem();
        });

        newListInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') confirmCreateList();
        });

        function deleteItem(id) {
            lists[currentTab] = lists[currentTab].filter(item => item.id !== id);
            renderItems();
            saveData();
        }

        function renderItems() {
            container.innerHTML = '';
            if (!currentTab || !lists[currentTab] || lists[currentTab].length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 mt-20 px-10">No items in "${currentTab}". Add one below!</div>`;
                return;
            }

            lists[currentTab].forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = 'list-item-wrapper rounded-2xl shadow-sm bg-white';
                wrapper.dataset.id = item.id;
                wrapper.innerHTML = `
                    <div class="delete-action" onclick="deleteItem('${item.id}')">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </div>
                    <div class="list-item-content p-4 rounded-2xl flex items-center gap-4 border border-slate-50">
                        <div class="text-slate-300 shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                        </div>
                        <span class="text-slate-700 font-medium break-words overflow-hidden">${item.text}</span>
                    </div>
                `;

                let startX = 0;
                wrapper.addEventListener('touchstart', e => {
                    startX = e.touches[0].clientX;
                    document.querySelectorAll('.list-item-wrapper').forEach(w => {
                        if (w !== wrapper) w.classList.remove('swiped-left');
                    });
                }, {passive: true});

                wrapper.addEventListener('touchmove', e => {
                    let diff = startX - e.touches[0].clientX;
                    if (diff > 60) wrapper.classList.add('swiped-left');
                    if (diff < -60) wrapper.classList.remove('swiped-left');
                }, {passive: true});

                container.appendChild(wrapper);
            });
        }

        function setupSortable() {
            new Sortable(container, {
                animation: 150,
                handle: '.list-item-content',
                ghostClass: 'sortable-ghost',
                onEnd: () => {
                    const orderIds = Array.from(container.querySelectorAll('.list-item-wrapper')).map(el => el.dataset.id);
                    const newOrder = [];
                    orderIds.forEach(id => {
                        const item = lists[currentTab].find(i => i.id === id);
                        if (item) newOrder.push(item);
                    });
                    lists[currentTab] = newOrder;
                    saveData();
                }
            });
        }

        // --- Import / Export ---

        function exportData() {
            const blob = new Blob([JSON.stringify(lists, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `lists_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    importedDataTemp = JSON.parse(e.target.result);
                    importModal.style.display = 'flex';
                } catch (err) {
                    // Custom fallback for invalid files
                    container.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-xl">Error: Invalid file format.</div>` + container.innerHTML;
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function confirmImport() {
            const type = document.querySelector('input[name="importType"]:checked').value;
            const removeDupes = document.getElementById('removeDuplicates').checked;

            if (type === 'replace') {
                lists = importedDataTemp;
            } else {
                Object.keys(importedDataTemp).forEach(key => {
                    if (!lists[key]) {
                        lists[key] = importedDataTemp[key];
                    } else {
                        const existingTexts = new Set(lists[key].map(i => i.text.toLowerCase()));
                        importedDataTemp[key].forEach(newItem => {
                            if (removeDupes) {
                                if (!existingTexts.has(newItem.text.toLowerCase())) {
                                    lists[key].push(newItem);
                                    existingTexts.add(newItem.text.toLowerCase());
                                }
                            } else {
                                lists[key].push(newItem);
                            }
                        });
                    }
                });
            }

            if (!lists[currentTab]) currentTab = Object.keys(lists)[0];
            
            saveData();
            renderTabs();
            renderItems();
            closeModal('importModal');
        }

        window.onload = init;
    </script>
</body>
</html>
